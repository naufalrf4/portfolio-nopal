# -----------------------------------------------------------------------------
# NEUMORPHIC EFFECTS (THE PHYSICS)
# -----------------------------------------------------------------------------
neumorphism:
  description: |
    Core neumorphic effects using dual RGBA shadows to create soft, tactile surfaces.
    Light source from top-left, dark shadow bottom-right. Shadows use transparency
    for premium, smooth blending (never opaque hex colors).

  border_radius:
    container: 32px (rounded-[32px]) - Very soft, friendly corners for cards
    base: 16px (rounded-2xl) - Buttons, inputs, standard elements
    inner: 12px (rounded-xl) - Nested elements
    full: 9999px (rounded-full) - Pills, circular elements
    note: Neumorphism works best with generous border radius

  shadows:
    extruded_standard:
      description: Default resting state for buttons, cards
      css: "box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255,0.5);"
      tailwind: "shadow-[9px_9px_16px_rgb(163,177,198,0.6),-9px_-9px_16px_rgba(255,255,255,0.5)]"
      usage: Cards, buttons at rest, raised panels
    
    extruded_hover:
      description: Lifted state on hover - increased depth
      css: "box-shadow: 12px 12px 20px rgb(163,177,198,0.7), -12px -12px 20px rgba(255,255,255,0.6);"
      tailwind: "shadow-[12px_12px_20px_rgb(163,177,198,0.7),-12px_-12px_20px_rgba(255,255,255,0.6)]"
      usage: Hover states for cards and buttons
      combine_with: "translate-y-[-2px] for cards, translate-y-[-1px] for buttons"
    
    extruded_small:
      description: Subtle depth for smaller elements
      css: "box-shadow: 5px 5px 10px rgb(163,177,198,0.6), -5px -5px 10px rgba(255,255,255,0.5);"
      tailwind: "shadow-[5px_5px_10px_rgb(163,177,198,0.6),-5px_-5px_10px_rgba(255,255,255,0.5)]"
      usage: Small buttons, badges, pills

    inset_standard:
      description: Pressed state or shallow wells
      css: "box-shadow: inset 6px 6px 10px rgb(163,177,198,0.6), inset -6px -6px 10px rgba(255,255,255,0.5);"
      tailwind: "shadow-[inset_6px_6px_10px_rgb(163,177,198,0.6),inset_-6px_-6px_10px_rgba(255,255,255,0.5)]"
      usage: Active button press, toggle switches
    
    inset_deep:
      description: Deep carved elements - inputs, icon wells
      css: "box-shadow: inset 10px 10px 20px rgb(163,177,198,0.7), inset -10px -10px 20px rgba(255,255,255,0.6);"
      tailwind: "shadow-[inset_10px_10px_20px_rgb(163,177,198,0.7),inset_-10px_-10px_20px_rgba(255,255,255,0.6)]"
      usage: Input fields (especially on focus), icon containers, deep wells
    
    inset_small:
      description: Subtle inset for tracks and pills
      css: "box-shadow: inset 3px 3px 6px rgb(163,177,198,0.6), inset -3px -3px 6px rgba(255,255,255,0.5);"
      tailwind: "shadow-[inset_3px_3px_6px_rgb(163,177,198,0.6),inset_-3px_-3px_6px_rgba(255,255,255,0.5)]"
      usage: Progress tracks, subtle pressed states

    flat:
      description: No shadow - disabled or subtle elements
      css: "box-shadow: none;"
      tailwind: "shadow-none"
      usage: Disabled states, ghost buttons

  mobile_adaptations:
    note: Reduce shadow distance on mobile for subtler effect
    extruded_mobile: "4px 4px 10px rgb(163,177,198,0.6), -4px -4px 10px rgba(255,255,255,0.5)"
    inset_mobile: "inset 4px 4px 8px rgb(163,177,198,0.6), inset -4px -4px 8px rgba(255,255,255,0.5)"

  tailwind_utilities:
    plugin_code: |
      // tailwind.config.js plugin
      plugin(function({ addUtilities }) {
        addUtilities({
          '.neu-extruded': {
            boxShadow: '9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255,0.5)',
          },
          '.neu-extruded-hover': {
            boxShadow: '12px 12px 20px rgb(163,177,198,0.7), -12px -12px 20px rgba(255,255,255,0.6)',
          },
          '.neu-extruded-sm': {
            boxShadow: '5px 5px 10px rgb(163,177,198,0.6), -5px -5px 10px rgba(255,255,255,0.5)',
          },
          '.neu-inset': {
            boxShadow: 'inset 6px 6px 10px rgb(163,177,198,0.6), inset -6px -6px 10px rgba(255,255,255,0.5)',
          },
          '.neu-inset-deep': {
            boxShadow: 'inset 10px 10px 20px rgb(163,177,198,0.7), inset -10px -10px 20px rgba(255,255,255,0.6)',
          },
          '.neu-inset-sm': {
            boxShadow: 'inset 3px 3px 6px rgb(163,177,198,0.6), inset -3px -3px 6px rgba(255,255,255,0.5)',
          },
          '.neu-flat': {
            boxShadow: 'none',
          },
        })
      })

  nested_depth_pattern:
    description: |
      Showcase the physics by nesting elements with alternating depth states.
      Example: Card (Extruded) → Icon Well (Inset Deep) → Icon (Extruded Small)
    
    example: |
      <div class="neu-extruded rounded-[32px] p-8">
        <div class="neu-inset-deep rounded-2xl p-4 w-16 h-16 flex items-center justify-center">
          <div class="neu-extruded-sm rounded-xl p-2">
            <Icon />
          </div>
        </div>
      </div>


# -----------------------------------------------------------------------------
# COMPONENT MODIFICATIONS (SHADCN/UI)
# -----------------------------------------------------------------------------
components:
  approach: |
    Start with shadcn/ui components, apply neumorphic modifications.
    Keep accessibility features, modify visual styling only.
    All components use #E0E5EC background to maintain same-surface illusion.

  button:
    base_modifications:
      - remove default border (border-transparent)
      - apply neu-extruded shadow
      - increase border-radius to 16px (rounded-2xl)
      - add transition for shadow and transform (duration-300)
      - minimum touch target 44x44px (h-12 for default)
    
    states:
      default: neu-extruded
      hover: translate-y-[-1px] + neu-extruded-hover
      active: translate-y-[0.5px] + neu-inset (physical press)
      disabled: neu-flat with opacity-50
      focus: ring-2 ring-[#6C63FF] ring-offset-2 ring-offset-[#E0E5EC]
    
    variants:
      primary:
        background: "#6C63FF" (accent)
        text: white
        shadow: custom colored shadow for accent bg
        active: specific rgba inset for colored surface
      
      secondary:
        background: "#E0E5EC" (matches page)
        text: "#3D4852"
        shadow: standard neu-extruded
      
      ghost:
        background: transparent
        shadow: none
        hover: bg-[#E0E5EC]/50 + neu-extruded
      
      outline:
        background: transparent
        border: 2px solid with gradient or accent
        shadow: none

    code_example: |
      // components/ui/button.tsx
      import { cva, type VariantProps } from "class-variance-authority"
      
      const buttonVariants = cva(
        "inline-flex items-center justify-center rounded-2xl font-medium transition-all duration-300 ease-out focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#6C63FF] focus-visible:ring-offset-2 focus-visible:ring-offset-[#E0E5EC] disabled:pointer-events-none disabled:opacity-50 border-transparent",
        {
          variants: {
            variant: {
              default: "bg-[#6C63FF] text-white shadow-[9px_9px_16px_rgb(163,177,198,0.6),-9px_-9px_16px_rgba(255,255,255,0.5)] hover:-translate-y-[1px] hover:shadow-[12px_12px_20px_rgb(163,177,198,0.7),-12px_-12px_20px_rgba(255,255,255,0.6)] active:translate-y-[0.5px] active:shadow-[inset_3px_3px_6px_rgba(0,0,0,0.2),inset_-3px_-3px_6px_rgba(255,255,255,0.1)]",
              secondary: "bg-[#E0E5EC] text-[#3D4852] shadow-[9px_9px_16px_rgb(163,177,198,0.6),-9px_-9px_16px_rgba(255,255,255,0.5)] hover:-translate-y-[1px] hover:shadow-[12px_12px_20px_rgb(163,177,198,0.7),-12px_-12px_20px_rgba(255,255,255,0.6)] active:translate-y-[0.5px] active:shadow-[inset_6px_6px_10px_rgb(163,177,198,0.6),inset_-6px_-6px_10px_rgba(255,255,255,0.5)]",
              ghost: "bg-transparent hover:bg-[#E0E5EC]/50 hover:shadow-[9px_9px_16px_rgb(163,177,198,0.6),-9px_-9px_16px_rgba(255,255,255,0.5)]",
              outline: "border-2 border-[#6C63FF]/30 bg-transparent hover:border-[#6C63FF]",
            },
            size: {
              default: "h-12 px-6 py-3",
              sm: "h-10 px-4 py-2 text-sm",
              lg: "h-14 px-8 py-4 text-lg",
              icon: "h-12 w-12",
            },
          },
          defaultVariants: {
            variant: "default",
            size: "default",
          },
        }
      )

  card:
    modifications:
      - apply neu-extruded shadow
      - generous border-radius (32px - rounded-[32px])
      - background #E0E5EC (same as page)
      - remove hard borders
      - generous padding (p-8 to p-20)
    
    states:
      default: neu-extruded
      hover: translate-y-[-2px] + neu-extruded-hover
    
    code_example: |
      // components/ui/card.tsx
      const Card = React.forwardRef<HTMLDivElement, CardProps>(
        ({ className, ...props }, ref) => (
          <div
            ref={ref}
            className={cn(
              "rounded-[32px] bg-[#E0E5EC] p-8",
              "shadow-[9px_9px_16px_rgb(163,177,198,0.6),-9px_-9px_16px_rgba(255,255,255,0.5)]",
              "transition-all duration-300 ease-out",
              "hover:-translate-y-[2px] hover:shadow-[12px_12px_20px_rgb(163,177,198,0.7),-12px_-12px_20px_rgba(255,255,255,0.6)]",
              className
            )}
            {...props}
          />
        )
      )

  input:
    modifications:
      - apply neu-inset shadow (appears recessed)
      - remove border (border-transparent)
      - generous border-radius (16px - rounded-2xl)
      - background #E0E5EC
    
    states:
      default: neu-inset
      focus: neu-inset-deep + ring-2 ring-[#6C63FF] ring-offset-2
      error: red-tinted inset shadow
      disabled: neu-flat, opacity-50

    code_example: |
      // components/ui/input.tsx
      const Input = React.forwardRef<HTMLInputElement, InputProps>(
        ({ className, ...props }, ref) => (
          <input
            ref={ref}
            className={cn(
              "flex h-12 w-full rounded-2xl bg-[#E0E5EC] px-4 py-3",
              "shadow-[inset_6px_6px_10px_rgb(163,177,198,0.6),inset_-6px_-6px_10px_rgba(255,255,255,0.5)]",
              "text-[#3D4852] placeholder:text-[#A0AEC0]",
              "transition-all duration-300",
              "focus:shadow-[inset_10px_10px_20px_rgb(163,177,198,0.7),inset_-10px_-10px_20px_rgba(255,255,255,0.6)]",
              "focus:outline-none focus:ring-2 focus:ring-[#6C63FF] focus:ring-offset-2 focus:ring-offset-[#E0E5EC]",
              "disabled:cursor-not-allowed disabled:opacity-50 disabled:shadow-none",
              "border-transparent",
              className
            )}
            {...props}
          />
        )
      )

  navigation:
    desktop:
      style: horizontal nav with neu-extruded container
      items: ghost buttons
      active: neu-inset state
      sticky: yes with backdrop-blur
    
    mobile:
      style: hamburger menu (Menu/X icons)
      menu: slide-down panel with neu-extruded
      touch_targets: minimum 44x44px

  dialog_modal:
    modifications:
      - neu-extruded on modal container
      - backdrop blur-md
      - generous padding (p-8) and radius (rounded-[32px])
      - background #E0E5EC

  tabs:
    modifications:
      - tab list as neu-inset container (track)
      - active tab as neu-extruded element (raised)
      - smooth transition between states

  icon_wells:
    description: |
      Icon containers that appear "drilled" into cards using deep inset shadows.
      Creates strong visual hierarchy and showcases nested depth.
    
    implementation: |
      <div class="neu-inset-deep rounded-2xl p-4 w-16 h-16 flex items-center justify-center">
        <Icon className="w-8 h-8 text-[#6C63FF]" />
      </div>


# -----------------------------------------------------------------------------
# GEOMETRIC ACCENTS
# -----------------------------------------------------------------------------
geometric:
  description: |
    Playful geometric shapes used as decorative accents to add visual interest
    and reinforce brand personality.

  shapes:
    circle:
      usage: hero backgrounds, card accents
      implementation: div with border-radius full
    
    triangle:
      usage: decorative corners, pointers
      implementation: CSS clip-path or SVG
    
    hexagon:
      usage: skill badges, category icons
      implementation: CSS clip-path
    
    blob:
      usage: organic backgrounds, image masks
      implementation: SVG with smooth curves

  usage_patterns:
    hero_section:
      - large gradient circle (blurred) in background
      - small geometric shapes floating with parallax
      - grid pattern overlay (subtle)
    
    card_accents:
      - small circle or dot in corner
      - gradient line accent
    
    section_dividers:
      - wave or curved SVG divider
      - geometric pattern band

  implementation_example: |
    // components/decorative/geometric-bg.tsx
    export function GeometricBackground() {
      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          {/* Large gradient blob */}
          <div 
            className="absolute -top-1/4 -right-1/4 w-1/2 h-1/2 
                       bg-gradient-to-br from-primary/20 to-secondary/20 
                       rounded-full blur-3xl"
          />
          {/* Small floating shapes */}
          <div className="absolute top-20 left-10 w-4 h-4 bg-accent/30 rounded-full animate-float" />
          <div className="absolute bottom-32 right-20 w-6 h-6 bg-primary/20 rotate-45 animate-float-delayed" />
        </div>
      )
    }


# -----------------------------------------------------------------------------
# ANIMATIONS & TRANSITIONS
# -----------------------------------------------------------------------------
animations:
  principles:
    - purposeful: animations convey meaning
    - subtle: avoid overwhelming motion
    - performant: use transform and opacity only
    - accessible: respect prefers-reduced-motion

  durations:
    fast: 150ms
    normal: 200ms
    slow: 300ms
    emphasis: 500ms

  easings:
    default: "cubic-bezier(0.4, 0, 0.2, 1)"
    in: "cubic-bezier(0.4, 0, 1, 1)"
    out: "cubic-bezier(0, 0, 0.2, 1)"
    bounce: "cubic-bezier(0.34, 1.56, 0.64, 1)"

  common_animations:
    fade_in:
      keyframes: "opacity: 0 -> 1"
      duration: normal
      usage: page transitions, modals
    
    slide_up:
      keyframes: "translateY(10px), opacity: 0 -> translateY(0), opacity: 1"
      duration: slow
      usage: content reveal, list items
    
    scale_in:
      keyframes: "scale(0.95), opacity: 0 -> scale(1), opacity: 1"
      duration: normal
      usage: cards, buttons on enter
    
    float:
      keyframes: "translateY(0) -> translateY(-10px) -> translateY(0)"
      duration: 3000ms
      iteration: infinite
      usage: decorative elements
    
    pulse_soft:
      keyframes: "opacity: 1 -> opacity: 0.7 -> opacity: 1"
      duration: 2000ms
      usage: loading states, attention

  framer_motion_variants:
    stagger_children: |
      const containerVariants = {
        hidden: { opacity: 0 },
        visible: {
          opacity: 1,
          transition: { staggerChildren: 0.1 }
        }
      }
      
      const itemVariants = {
        hidden: { y: 20, opacity: 0 },
        visible: { y: 0, opacity: 1 }
      }

  reduced_motion: |
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }


# -----------------------------------------------------------------------------
# ICONS
# -----------------------------------------------------------------------------
icons:
  primary:
    library: Lucide React
    style: outline (2px stroke)
    size_default: 20px (w-5 h-5)
    size_small: 16px (w-4 h-4)
    size_large: 24px (w-6 h-6)
  
  brand:
    library: Simple Icons
    usage: social links, tech logos

  custom:
    approach: SVG components in packages/ui/icons
    naming: PascalCase (IconName.tsx)

  usage_guidelines:
    - always provide aria-label for standalone icons
    - use currentColor for fill/stroke
    - pair with text for clarity when possible


# -----------------------------------------------------------------------------
# RESPONSIVE DESIGN
# -----------------------------------------------------------------------------
responsive:
  approach: mobile-first
  
  breakpoint_strategy:
    mobile: 0-639px (base styles)
    tablet: 640-1023px (sm and md)
    desktop: 1024px+ (lg and up)

  key_adaptations:
    typography:
      - headings scale down 20-30% on mobile
      - body text remains same size
    
    spacing:
      - section padding reduces on mobile
      - card padding reduces slightly
    
    layout:
      - single column on mobile
      - 2-3 columns on tablet
      - full grid on desktop
    
    navigation:
      - hamburger menu on mobile
      - horizontal nav on desktop
    
    neuromorphism:
      - reduce shadow distance on mobile (4px vs 6px)
      - keeps effect but more subtle


# -----------------------------------------------------------------------------
# ACCESSIBILITY
# -----------------------------------------------------------------------------
accessibility:
  color_contrast:
    target: WCAG AA (4.5:1 for normal text, 3:1 for large)
    challenge: neuromorphism can reduce contrast
    solution: ensure text colors have sufficient contrast despite soft shadows

  focus_states:
    style: visible focus ring (2px primary)
    not_removed: focus-visible remains visible
    custom: subtle glow effect for neuromorphic consistency

  motion:
    respect_preference: prefers-reduced-motion
    fallback: instant transitions, no animation

  semantic_markup:
    - proper heading hierarchy
    - button vs link distinction
    - form labels always present
    - alt text on images

  keyboard_navigation:
    - all interactive elements focusable
    - logical tab order
    - skip links for main content
