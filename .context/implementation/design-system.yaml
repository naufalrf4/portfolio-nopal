# Design System

# =============================================================================
# NEUMORPHISM (SOFT UI) DESIGN SYSTEM WITH SHADCN/UI
# =============================================================================
# Defines the visual language, component patterns, and design tokens for the
# NaufalRF Portfolio Ecosystem. Based on shadcn/ui with neumorphism modifications.
# Uses OKLCH color space for Tailwind 4 compatibility.
# =============================================================================

# -----------------------------------------------------------------------------
# DESIGN PHILOSOPHY
# -----------------------------------------------------------------------------
philosophy:
  style: neumorphism
  description: |
    Neumorphism creates the illusion of physical depth through carefully balanced 
    dual shadows—one light source from the top-left, one dark shadow falling 
    bottom-right—on monochromatic backgrounds. Elements appear to either extrude 
    from the surface (convex/raised) or be pressed into it (concave/inset). 
    The effect mimics soft, pillowed physical objects with realistic lighting, 
    creating a "molded from the same material" aesthetic.

  principles:
    - tactile_depth: Dual opposing RGB shadows create realistic physical depth
    - monochromatic_discipline: Cool grey palette where shadows do visual heavy lifting
    - same_surface_illusion: Elements molded from same material as background
    - deep_inset_states: Wells and inputs feel significantly deeper than standard pressed states
    - hyper_rounded_corners: 32px for containers, 16px for elements - pillowed aesthetic
    - complex_nested_depth: Showcase physics through nested elements (Extruded → Inset → Extruded)
    - smooth_microinteractions: 300ms transitions with scale, rotation, shadow depth changes
    - accessible_first: WCAG AA contrast (7.5:1 primary, 4.6:1 secondary) despite soft aesthetics
    - mobile_first_responsive: Touch-friendly 44px targets, maintained aesthetic on all screens

  vibe: |
    Tactile, calm, modern, and physically grounded. UI that feels like cooler matte 
    plastic or soft ceramic. Satisfying and tangible. Deliberately restrained with 
    a cooler grey palette to feel fresh and distinct from warm legacy neumorphism.

  inspiration:
    - neumorphism.io
    - dribbble.com/tags/neumorphism
    - modern portfolio sites with depth
    - physical product design (ceramic, molded plastic)


# -----------------------------------------------------------------------------
# COLOR SYSTEM
# -----------------------------------------------------------------------------
colors:
  approach: OKLCH-based with CSS custom properties (Tailwind 4 compatible)
  
  philosophy: |
    Monochromatic "Cool Grey" discipline where shadows and highlights do all 
    visual heavy lifting. No flat backgrounds. Elements appear part of the same 
    material as the background—molded, not placed.

  light_mode:
    # Base surface - The "cool clay" everything is molded from
    background:
      hex: "#E0E5EC"
      oklch: "oklch(0.92 0.008 240)"
      description: The base cool grey surface - all elements molded from this
    
    surface:
      hex: "#E0E5EC"
      oklch: "oklch(0.92 0.008 240)"
      description: Same as background for same-surface illusion
    
    surface_raised:
      hex: "#E0E5EC"
      oklch: "oklch(0.92 0.008 240)"
      description: Elevated elements (depth from shadows, not color)
    
    surface_inset:
      hex: "#E0E5EC"
      oklch: "oklch(0.92 0.008 240)"
      description: Pressed elements (depth from inset shadows)

    # Text colors - WCAG compliant
    foreground:
      hex: "#3D4852"
      oklch: "oklch(0.35 0.015 240)"
      contrast_ratio: "7.5:1"
      description: Primary text - dark blue-grey, WCAG AAA
    
    foreground_muted:
      hex: "#6B7280"
      oklch: "oklch(0.52 0.012 240)"
      contrast_ratio: "4.6:1"
      description: Secondary text - cool grey, WCAG AA
    
    foreground_subtle:
      hex: "#A0AEC0"
      oklch: "oklch(0.72 0.010 240)"
      description: Placeholders, disabled text

    # Accent colors - Used sparingly
    accent:
      hex: "#6C63FF"
      oklch: "oklch(0.58 0.20 280)"
      description: Soft violet for CTAs and focus states
    
    accent_light:
      hex: "#8B84FF"
      oklch: "oklch(0.68 0.18 280)"
      description: Lighter violet for gradients and hover
    
    accent_secondary:
      hex: "#38B2AC"
      oklch: "oklch(0.68 0.10 190)"
      description: Teal for success states and positive indicators

    # Semantic colors
    success:
      hex: "#38B2AC"
      oklch: "oklch(0.68 0.10 190)"
    
    warning:
      hex: "#F59E0B"
      oklch: "oklch(0.75 0.15 70)"
    
    error:
      hex: "#EF4444"
      oklch: "oklch(0.62 0.22 25)"

    # Shadow colors - CRITICAL: RGBA for smooth blending
    shadow_light:
      rgba: "rgba(255, 255, 255, 0.5)"
      description: Pure white with transparency for top-left light source
    
    shadow_light_strong:
      rgba: "rgba(255, 255, 255, 0.6)"
      description: Stronger highlight for hover states
    
    shadow_dark:
      rgba: "rgb(163, 177, 198, 0.6)"
      hex_reference: "#A3B1C6"
      description: Cool blue-grey shadow for bottom-right, matches background tone
    
    shadow_dark_strong:
      rgba: "rgb(163, 177, 198, 0.7)"
      description: Deeper shadow for hover and inset states

  dark_mode:
    note: |
      Dark mode implementation TBD. Current focus is perfecting light mode 
      neumorphism. Dark mode requires careful shadow color adjustments to 
      maintain the same tactile quality.

  css_variables:
    implementation: |
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap');

      @layer base {
        :root {
          /* Base surface - cool grey */
          --background: oklch(0.92 0.008 240);
          --surface: oklch(0.92 0.008 240);
          
          /* Text colors */
          --foreground: oklch(0.35 0.015 240);
          --foreground-muted: oklch(0.52 0.012 240);
          --foreground-subtle: oklch(0.72 0.010 240);
          
          /* Accent colors */
          --accent: oklch(0.58 0.20 280);
          --accent-light: oklch(0.68 0.18 280);
          --accent-secondary: oklch(0.68 0.10 190);
          
          /* Semantic */
          --success: oklch(0.68 0.10 190);
          --warning: oklch(0.75 0.15 70);
          --error: oklch(0.62 0.22 25);
          
          /* Shadow colors - use rgba directly in shadows */
          --shadow-light: rgba(255, 255, 255, 0.5);
          --shadow-light-strong: rgba(255, 255, 255, 0.6);
          --shadow-dark: rgb(163, 177, 198, 0.6);
          --shadow-dark-strong: rgb(163, 177, 198, 0.7);
          
          /* Border radius */
          --radius-container: 32px;
          --radius-base: 16px;
          --radius-inner: 12px;
        }
        
        * {
          @apply border-transparent;
        }
        
        body {
          @apply bg-[--background] text-[--foreground] font-sans;
          scroll-behavior: smooth;
        }
      }


