          knowledge/:
            route.ts: "GET /api/internal/content/knowledge"
        health/:
          route.ts: "GET /api/internal/health"

  route_example:
    path: apps/admin/app/api/admin/projects/route.ts
    content: |
      import { NextResponse } from 'next/server'
      import { db } from '@/db'
      import { projects } from '@/db/schema'
      import { eq, ilike, or, sql } from 'drizzle-orm'
      import { withAuth, withErrorHandler, withValidation } from '@/lib/middleware'
      import { ProjectCreateSchema, PaginationQuerySchema } from '@/lib/schemas'
      import { composeMiddleware } from '@/lib/middleware/compose'
      
      // GET /api/admin/projects
      export const GET = composeMiddleware(
        withErrorHandler,
        withAuth({ requireAdmin: true })
      )(async (request, { session }) => {
        const url = new URL(request.url)
        const params = PaginationQuerySchema.parse(Object.fromEntries(url.searchParams))
        
        const where = {
          ...(params.category && { category: params.category }),
          ...(params.visible !== undefined && { visible: params.visible }),
          ...(params.search && {
            OR: [
              { title: { contains: params.search, mode: 'insensitive' } },
              { summary: { contains: params.search, mode: 'insensitive' } },
            ],
          }),
        }
        
        const [data, total] = await Promise.all([
          db.select().from(projects)
            .where(where)
            .limit(params.limit)
            .offset((params.page - 1) * params.limit)
            .orderBy(
              params.order === 'asc'
                ? asc(projects[params.sort || 'createdAt'])
                : desc(projects[params.sort || 'createdAt'])
            ),
          db.select({ count: sql<number>`count(*)::int` }).from(projects).where(where),
        ])
        
        return NextResponse.json({
          success: true,
          data,
          meta: {
            pagination: {
              page: params.page,
              limit: params.limit,
              total,
              totalPages: Math.ceil(total / params.limit),
              hasNext: params.page * params.limit < total,
              hasPrev: params.page > 1,
            },
            requestId: crypto.randomUUID(),
            timestamp: new Date().toISOString(),
          },
        })
      })
      
      // POST /api/admin/projects
      export const POST = composeMiddleware(
        withErrorHandler,
        withAuth({ requireAdmin: true }),
        withValidation(ProjectCreateSchema)
      )(async (request, data) => {
        const [project] = await db.insert(projects).values(data).returning()
        
        return NextResponse.json({
          success: true,
          data: project,
          meta: {
            requestId: crypto.randomUUID(),
            timestamp: new Date().toISOString(),
          },
        }, { status: 201 })
      })
