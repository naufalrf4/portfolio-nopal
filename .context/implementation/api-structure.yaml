# API Structure Specification

# =============================================================================
# ADMIN APP API GATEWAY (apps/admin)
# =============================================================================
# This specification defines the complete API structure for the Admin app,
# which serves as the central API gateway for the NaufalRF Portfolio Ecosystem.
# =============================================================================

version: "1.0.0"
base_path: /api
content_type: application/json

# =============================================================================
# API NAMESPACES
# =============================================================================
# Each namespace has distinct authentication and rate limiting requirements.
# =============================================================================

namespaces:
  public:
    prefix: /api/public
    description: Public read-only endpoints, no authentication required
    authentication: none
    rate_limit:
      requests: 100
      window: 60s
      by: ip
    cors:
      origins: ["*"]
      methods: ["GET", "OPTIONS"]
      headers: ["Content-Type", "Accept"]
    caching:
      default_ttl: 60s
      stale_while_revalidate: 300s

  public_write:
    prefix: /api/public-write
    description: Public write endpoints with rate limiting, optional auth
    authentication: optional # none or user
    rate_limit:
      requests: 10
      window: 60s
      by: ip
    cors:
      origins: ["*"]
      methods: ["POST", "OPTIONS"]
      headers: ["Content-Type", "Accept", "Authorization"]
    caching:
      enabled: false

  user:
    prefix: /api/user
    description: User-authenticated endpoints
    authentication: required
    required_role: user
    rate_limit:
      requests: 60
      window: 60s
      by: user_id
    cors:
      origins:
        - ${PUBLIC_APP_URL}
        - ${ADMIN_APP_URL}
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Content-Type", "Accept", "Authorization"]
    caching:
      enabled: false

  admin:
    prefix: /api/admin
    description: Admin-only endpoints for content management
    authentication: required
    required_role: admin
    rate_limit:
      requests: 120
      window: 60s
      by: user_id
    cors:
      origins:
        - ${ADMIN_APP_URL}
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Content-Type", "Accept", "Authorization"]
    caching:
      enabled: false

  internal:
    prefix: /api/internal
    description: Service-to-service communication, token authentication
    authentication: service_token
    rate_limit:
      requests: 1000
      window: 60s
      by: service_token
    cors:
      enabled: false # Internal services only
    caching:
      enabled: false

# =============================================================================
# AUTHENTICATION CONFIGURATION
# =============================================================================

authentication:
  providers:
    nextauth:
      type: session
      description: NextAuth.js session-based authentication via cookies
      session_strategy: jwt
      max_age: 2592000 # 30 days in seconds
      cookie_name: next-auth.session-token
      secure_cookie: true # In production

    bearer:
      type: bearer_token
      description: JWT Bearer token for API clients
      header: Authorization
      prefix: Bearer
      validate_with: nextauth_jwt_secret

    service_token:
      type: static_token
      description: Pre-shared token for internal service communication
      header: X-Service-Token
      env_var: INTERNAL_SERVICE_TOKEN

  roles:
    user:
      description: Authenticated user via Google OAuth
      permissions:
        - read:public
        - write:guestbook
        - read:own_entries

    admin:
      description: User in admin allowlist
      inherits: user
      permissions:
        - read:all
        - write:all
        - delete:all
        - manage:users
      allowlist_env: ADMIN_ALLOWLIST

# =============================================================================
# ZOD SCHEMAS - SHARED
# =============================================================================

schemas:
  # ---------------------------------------------------------------------------
  # PAGINATION
  # ---------------------------------------------------------------------------
  pagination:
    request:
      name: PaginationQuerySchema
      zod: |
        z.object({
          page: z.coerce.number().int().min(1).default(1),
          limit: z.coerce.number().int().min(1).max(100).default(10),
          sort: z.string().optional(),
          order: z.enum(['asc', 'desc']).default('desc'),
        })
    response:
      name: PaginationMetaSchema
      zod: |
        z.object({
          page: z.number(),
          limit: z.number(),
          total: z.number(),
          totalPages: z.number(),
          hasNext: z.boolean(),
          hasPrev: z.boolean(),
        })

  # ---------------------------------------------------------------------------
  # ERROR RESPONSE
  # ---------------------------------------------------------------------------
  error:
    name: ApiErrorSchema
    zod: |
      z.object({
        success: z.literal(false),
        error: z.object({
          code: z.string(),
          message: z.string(),
          details: z.array(z.object({
            field: z.string().optional(),
            message: z.string(),
            code: z.string().optional(),
          })).optional(),
          requestId: z.string(),
          timestamp: z.string().datetime(),
        }),
      })

  # ---------------------------------------------------------------------------
  # SUCCESS RESPONSE WRAPPER
  # ---------------------------------------------------------------------------
  success:
    single:
      name: SingleResponseSchema
      zod: |
        z.object({
          success: z.literal(true),
          data: z.unknown(), // Replaced with specific schema per endpoint
          meta: z.object({
            requestId: z.string(),
            timestamp: z.string().datetime(),
          }).optional(),
        })
    list:
      name: ListResponseSchema
      zod: |
        z.object({
          success: z.literal(true),
          data: z.array(z.unknown()), // Replaced with specific schema per endpoint
          meta: z.object({
            pagination: PaginationMetaSchema,
            requestId: z.string(),
            timestamp: z.string().datetime(),
          }),
        })

  # ---------------------------------------------------------------------------
  # ENTITY SCHEMAS
  # ---------------------------------------------------------------------------
  project:
    base:
      name: ProjectBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          title: z.string().min(1).max(200),
          slug: z.string().regex(/^[a-z0-9-]+$/).min(1).max(100),
          summary: z.string().min(1).max(500),
          category: z.enum(['WEB', 'MOBILE', 'BACKEND', 'DEVOPS', 'ML', 'OTHER']),
          thumbnailUrl: z.string().url().nullable(),
          featured: z.boolean().default(false),
          visible: z.boolean().default(true),
          order: z.number().int().default(0),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
        })
    create:
      name: ProjectCreateSchema
      zod: |
        z.object({
          title: z.string().min(1).max(200),
          slug: z.string().regex(/^[a-z0-9-]+$/).min(1).max(100),
          summary: z.string().min(1).max(500),
          category: z.enum(['WEB', 'MOBILE', 'BACKEND', 'DEVOPS', 'ML', 'OTHER']),
          thumbnailUrl: z.string().url().nullable().optional(),
          featured: z.boolean().optional().default(false),
          visible: z.boolean().optional().default(true),
          order: z.number().int().optional().default(0),
        })
    update:
      name: ProjectUpdateSchema
      zod: |
        z.object({
          title: z.string().min(1).max(200).optional(),
          slug: z.string().regex(/^[a-z0-9-]+$/).min(1).max(100).optional(),
          summary: z.string().min(1).max(500).optional(),
          category: z.enum(['WEB', 'MOBILE', 'BACKEND', 'DEVOPS', 'ML', 'OTHER']).optional(),
          thumbnailUrl: z.string().url().nullable().optional(),
          featured: z.boolean().optional(),
          visible: z.boolean().optional(),
          order: z.number().int().optional(),
        })

  project_context:
    base:
      name: ProjectContextBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          projectId: z.string().cuid(),
          type: z.enum([
            'CONTEXT',
            'ROLE',
            'DECISIONS',
            'TRADEOFFS',
            'RESULT',
            'ARCHITECTURE',
            'OPERATIONS',
            'METRICS',
          ]),
          content: z.string().min(1).max(50000),
          order: z.number().int().default(0),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
        })
    create:
      name: ProjectContextCreateSchema
      zod: |
        z.object({
          projectId: z.string().cuid(),
          type: z.enum([
            'CONTEXT',
            'ROLE',
            'DECISIONS',
            'TRADEOFFS',
            'RESULT',
            'ARCHITECTURE',
            'OPERATIONS',
            'METRICS',
          ]),
          content: z.string().min(1).max(50000),
          order: z.number().int().optional().default(0),
        })
    update:
      name: ProjectContextUpdateSchema
      zod: |
        z.object({
          type: z.enum([
            'CONTEXT',
            'ROLE',
            'DECISIONS',
            'TRADEOFFS',
            'RESULT',
            'ARCHITECTURE',
            'OPERATIONS',
            'METRICS',
          ]).optional(),
          content: z.string().min(1).max(50000).optional(),
          order: z.number().int().optional(),
        })

  blog_link:
    base:
      name: BlogLinkBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          url: z.string().url(),
          title: z.string().min(1).max(200),
          description: z.string().max(500).nullable(),
          thumbnailUrl: z.string().url().nullable(),
          source: z.string().max(100).nullable(),
          publishedAt: z.string().datetime().nullable(),
          visible: z.boolean().default(true),
          order: z.number().int().default(0),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
        })
    create:
      name: BlogLinkCreateSchema
      zod: |
        z.object({
          url: z.string().url(),
          title: z.string().min(1).max(200).optional(),
          description: z.string().max(500).nullable().optional(),
          thumbnailUrl: z.string().url().nullable().optional(),
          source: z.string().max(100).nullable().optional(),
          publishedAt: z.string().datetime().nullable().optional(),
          visible: z.boolean().optional().default(true),
          order: z.number().int().optional().default(0),
        })
    update:
      name: BlogLinkUpdateSchema
      zod: |
        z.object({
          url: z.string().url().optional(),
          title: z.string().min(1).max(200).optional(),
          description: z.string().max(500).nullable().optional(),
          thumbnailUrl: z.string().url().nullable().optional(),
          source: z.string().max(100).nullable().optional(),
          publishedAt: z.string().datetime().nullable().optional(),
          visible: z.boolean().optional(),
          order: z.number().int().optional(),
        })

  guestbook:
    base:
      name: GuestbookEntryBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          userId: z.string().cuid(),
          message: z.string().min(1).max(1000),
          visible: z.boolean().default(true),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
          user: z.object({
            id: z.string().cuid(),
            name: z.string().nullable(),
            image: z.string().url().nullable(),
          }),
          reactions: z.array(z.object({
            type: z.string(),
            count: z.number().int(),
          })).optional(),
        })
    create:
      name: GuestbookEntryCreateSchema
      zod: |
        z.object({
          message: z.string().min(1).max(1000).trim(),
        })
    update:
      name: GuestbookEntryUpdateSchema
      zod: |
        z.object({
          message: z.string().min(1).max(1000).trim().optional(),
          visible: z.boolean().optional(),
        })
    reaction:
      name: GuestbookReactionSchema
      zod: |
        z.object({
          type: z.enum(['LIKE', 'HEART', 'FIRE', 'CLAP', 'LAUGH']),
        })

  anonymous_message:
    base:
      name: AnonymousMessageBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          content: z.string().min(1).max(1000),
          ipHash: z.string(),
          isRead: z.boolean().default(false),
          createdAt: z.string().datetime(),
        })
    create:
      name: AnonymousMessageCreateSchema
      zod: |
        z.object({
          content: z.string().min(1).max(1000).trim(),
        })

  chat_log:
    base:
      name: ChatLogBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          sessionId: z.string(),
          messages: z.array(z.object({
            role: z.enum(['user', 'assistant', 'system']),
            content: z.string(),
            timestamp: z.string().datetime(),
          })),
          ipHash: z.string().nullable(),
          userAgent: z.string().nullable(),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
        })
    create:
      name: ChatLogCreateSchema
      zod: |
        z.object({
          sessionId: z.string().min(1),
          messages: z.array(z.object({
            role: z.enum(['user', 'assistant', 'system']),
            content: z.string(),
            timestamp: z.string().datetime(),
          })).min(1),
          ipHash: z.string().nullable().optional(),
          userAgent: z.string().nullable().optional(),
        })

  profile_link:
    base:
      name: ProfileLinkBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          label: z.string().min(1).max(100),
          url: z.string().url(),
          icon: z.string().max(50).nullable(),
          visible: z.boolean().default(true),
          order: z.number().int().default(0),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
        })
    create:
      name: ProfileLinkCreateSchema
      zod: |
        z.object({
          label: z.string().min(1).max(100),
          url: z.string().url(),
          icon: z.string().max(50).nullable().optional(),
          visible: z.boolean().optional().default(true),
          order: z.number().int().optional().default(0),
        })
    update:
      name: ProfileLinkUpdateSchema
      zod: |
        z.object({
          label: z.string().min(1).max(100).optional(),
          url: z.string().url().optional(),
          icon: z.string().max(50).nullable().optional(),
          visible: z.boolean().optional(),
          order: z.number().int().optional(),
        })

  knowledge_doc:
    base:
      name: KnowledgeDocBaseSchema
      zod: |
        z.object({
          id: z.string().cuid(),
          title: z.string().min(1).max(200),
          content: z.string().min(1).max(100000),
          contentType: z.enum(['TEXT', 'MARKDOWN', 'HTML']),
          source: z.string().max(500).nullable(),
          indexed: z.boolean().default(false),
          indexedAt: z.string().datetime().nullable(),
          createdAt: z.string().datetime(),
          updatedAt: z.string().datetime(),
        })
    create:
      name: KnowledgeDocCreateSchema
      zod: |
        z.object({
          title: z.string().min(1).max(200),
          content: z.string().min(1).max(100000),
          contentType: z.enum(['TEXT', 'MARKDOWN', 'HTML']).default('MARKDOWN'),
          source: z.string().max(500).nullable().optional(),
        })
    update:
      name: KnowledgeDocUpdateSchema
      zod: |
        z.object({
          title: z.string().min(1).max(200).optional(),
          content: z.string().min(1).max(100000).optional(),
          contentType: z.enum(['TEXT', 'MARKDOWN', 'HTML']).optional(),
          source: z.string().max(500).nullable().optional(),
        })

# =============================================================================
# ENDPOINT CATALOG
# =============================================================================

endpoints:

  # ---------------------------------------------------------------------------
  # PUBLIC ENDPOINTS - /api/public/*
  # ---------------------------------------------------------------------------

  # Projects - Public Read
  - namespace: public
    resource: projects
    endpoints:
      - method: GET
        path: /api/public/projects
        summary: List visible projects
        auth: none
        rate_limit:
          requests: 100
          window: 60s
        request:
          query:
            schema: |
              PaginationQuerySchema.extend({
                category: z.enum(['WEB', 'MOBILE', 'BACKEND', 'DEVOPS', 'ML', 'OTHER']).optional(),
                featured: z.coerce.boolean().optional(),
              })
        response:
          status: 200
          schema: "ListResponseSchema.extend({ data: z.array(ProjectBaseSchema) })"
          example:
            success: true
            data:
              - id: "clx1234567890abcdef"
                title: "E-Commerce Platform"
                slug: "ecommerce-platform"
                summary: "Full-stack e-commerce solution with Next.js"
                category: "WEB"
                thumbnailUrl: "https://example.com/thumb.jpg"
                featured: true
                visible: true
                order: 0
                createdAt: "2024-01-15T10:30:00.000Z"
                updatedAt: "2024-01-20T14:22:00.000Z"
            meta:
              pagination:
                page: 1
                limit: 10
                total: 25
                totalPages: 3
                hasNext: true
                hasPrev: false
              requestId: "req_abc123"
              timestamp: "2024-01-20T15:00:00.000Z"
        errors:
          - code: VALIDATION_ERROR
            status: 400
            description: Invalid query parameters
          - code: RATE_LIMIT_EXCEEDED
            status: 429
            description: Too many requests

      - method: GET
        path: /api/public/projects/:slug
        summary: Get project by slug with contexts
        auth: none
        rate_limit:
          requests: 100
          window: 60s
        request:
          params:
            slug:
              type: string
              required: true
              pattern: "^[a-z0-9-]+$"
        response:
          status: 200
          schema: |
            SingleResponseSchema.extend({
              data: ProjectBaseSchema.extend({
                contexts: z.array(ProjectContextBaseSchema),
              }),
            })
        errors:
          - code: NOT_FOUND
            status: 404
            description: Project not found or not visible

  # Blog Links - Public Read
  - namespace: public
    resource: blogs
    endpoints:
      - method: GET
        path: /api/public/blogs
        summary: List visible blog links
        auth: none
        rate_limit:
          requests: 100
          window: 60s
        request:
          query:
            schema: PaginationQuerySchema
        response:
          status: 200
          schema: "ListResponseSchema.extend({ data: z.array(BlogLinkBaseSchema) })"
        errors:
          - code: VALIDATION_ERROR
            status: 400

  # Guestbook - Public Read
  - namespace: public
    resource: guestbook
    endpoints:
      - method: GET
        path: /api/public/guestbook
        summary: List visible guestbook entries
        auth: none
        rate_limit:
          requests: 100
          window: 60s
        request:
          query:
            schema: PaginationQuerySchema
        response:
          status: 200
          schema: "ListResponseSchema.extend({ data: z.array(GuestbookEntryBaseSchema) })"

  # Profile Links - Public Read
  - namespace: public
    resource: links
    endpoints:
      - method: GET
        path: /api/public/links
        summary: List visible profile links
        auth: none
        rate_limit:
          requests: 100
          window: 60s
        response:
          status: 200
          schema: "ListResponseSchema.extend({ data: z.array(ProfileLinkBaseSchema) })"

  # ---------------------------------------------------------------------------
  # PUBLIC WRITE ENDPOINTS - /api/public-write/*
  # ---------------------------------------------------------------------------

  # Guestbook - Public Write
  - namespace: public_write
    resource: guestbook
    endpoints:
      - method: POST
        path: /api/public-write/guestbook
        summary: Create guestbook entry (requires user auth)
        auth: required
        required_role: user
        rate_limit:
          requests: 5
          window: 3600s # 1 hour
          by: user_id
        request:
          body:
            schema: GuestbookEntryCreateSchema
            example:
              message: "Great portfolio! Love the design."
        response:
          status: 201
          schema: "SingleResponseSchema.extend({ data: GuestbookEntryBaseSchema })"
        errors:
          - code: UNAUTHORIZED
            status: 401
            description: User not authenticated
          - code: VALIDATION_ERROR
            status: 400
            description: Invalid message format
          - code: RATE_LIMIT_EXCEEDED
            status: 429
            description: Too many submissions

      - method: POST
        path: /api/public-write/guestbook/:id/reactions
        summary: Add reaction to guestbook entry
        auth: required
        required_role: user
        rate_limit:
          requests: 30
          window: 60s
          by: user_id
        request:
          params:
            id:
              type: string
              required: true
          body:
            schema: GuestbookReactionSchema
        response:
          status: 200
          schema: |
            SingleResponseSchema.extend({
              data: z.object({
                entryId: z.string().cuid(),
                reactions: z.array(z.object({
                  type: z.string(),
                  count: z.number().int(),
                })),
              }),
            })

  # Anonymous Messages - Public Write
  - namespace: public_write
    resource: messages
    endpoints:
      - method: POST
        path: /api/public-write/messages
        summary: Submit anonymous message
        auth: none
        rate_limit:
          requests: 5
          window: 3600s # 1 hour
          by: ip
        request:
          body:
            schema: AnonymousMessageCreateSchema
            example:
              content: "Just wanted to say your projects are inspiring!"
        response:
          status: 201
          schema: |
            SingleResponseSchema.extend({
              data: z.object({
                message: z.literal('Message submitted successfully'),
              }),
            })
        errors:
          - code: VALIDATION_ERROR
            status: 400
            description: Invalid message content
          - code: RATE_LIMIT_EXCEEDED
            status: 429
            description: Too many submissions from this IP

  # ---------------------------------------------------------------------------
  # USER ENDPOINTS - /api/user/*
  # ---------------------------------------------------------------------------

  - namespace: user
    resource: profile
    endpoints:
      - method: GET
        path: /api/user/me
        summary: Get current user profile
        auth: required
        required_role: user
        response:
          status: 200
          schema: |
            SingleResponseSchema.extend({
              data: z.object({
                id: z.string().cuid(),
                name: z.string().nullable(),
                email: z.string().email(),
                image: z.string().url().nullable(),
                role: z.enum(['user', 'admin']),
              }),
            })

      - method: GET
        path: /api/user/guestbook
        summary: Get current user's guestbook entries
        auth: required
        required_role: user
        response:
          status: 200
          schema: "ListResponseSchema.extend({ data: z.array(GuestbookEntryBaseSchema) })"

      - method: DELETE
        path: /api/user/guestbook/:id
        summary: Delete own guestbook entry
        auth: required
        required_role: user
        request:
          params:
            id:
              type: string
              required: true
        response:
          status: 200
          schema: |
            SingleResponseSchema.extend({
              data: z.object({ deleted: z.boolean() }),
            })
        errors:
          - code: FORBIDDEN
            status: 403
            description: Cannot delete entry owned by another user

  # ---------------------------------------------------------------------------
  # ADMIN ENDPOINTS - /api/admin/*
  # ---------------------------------------------------------------------------

  # Projects - Admin CRUD
  - namespace: admin
    resource: projects
    endpoints:
      - method: GET
        path: /api/admin/projects
        summary: List all projects (including hidden)
        auth: required
        required_role: admin
        request:
          query:
            schema: |
              PaginationQuerySchema.extend({
                category: z.enum(['WEB', 'MOBILE', 'BACKEND', 'DEVOPS', 'ML', 'OTHER']).optional(),
                visible: z.coerce.boolean().optional(),
                featured: z.coerce.boolean().optional(),
                search: z.string().optional(),
              })
        response:
          status: 200
          schema: |
            ListResponseSchema.extend({
              data: z.array(ProjectBaseSchema.extend({
                _count: z.object({
                  contexts: z.number().int(),
                }).optional(),
              })),
            })

      - method: GET
        path: /api/admin/projects/:id
        summary: Get project by ID
        auth: required
        required_role: admin
        request:
          params:
            id:
              type: string
              required: true
        response:
          status: 200
          schema: |
            SingleResponseSchema.extend({
              data: ProjectBaseSchema.extend({
                contexts: z.array(ProjectContextBaseSchema),
              }),
            })

      - method: POST
        path: /api/admin/projects
        summary: Create new project
        auth: required
        required_role: admin
        request:
          body:
            schema: ProjectCreateSchema
        response:
          status: 201
          schema: "SingleResponseSchema.extend({ data: ProjectBaseSchema })"
        errors:
          - code: CONFLICT
            status: 409
            description: Slug already exists

      - method: PUT
        path: /api/admin/projects/:id
        summary: Update project
        auth: required
        required_role: admin
        request:
          params:
            id:
              type: string
              required: true
          body:
            schema: ProjectUpdateSchema
        response:
          status: 200
          schema: "SingleResponseSchema.extend({ data: ProjectBaseSchema })"
        errors:
          - code: NOT_FOUND
            status: 404
          - code: CONFLICT
            status: 409
            description: Slug already exists

      - method: DELETE
        path: /api/admin/projects/:id
        summary: Delete project and all contexts
        auth: required
        required_role: admin
        request:
          params:
            id:
              type: string
              required: true
        response:
          status: 200
          schema: |
