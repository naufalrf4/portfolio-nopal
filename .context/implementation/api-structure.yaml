# =============================================================================
# MIDDLEWARE PATTERNS
# =============================================================================

middleware:
  # ---------------------------------------------------------------------------
  # AUTHENTICATION MIDDLEWARE
  # ---------------------------------------------------------------------------
  auth:
    name: withAuth
    description: Validates session and extracts user information
    implementation: |
      import { auth } from '@/auth'
      import { NextResponse } from 'next/server'
      
      export async function withAuth(
        handler: AuthenticatedHandler,
        options: { requireAdmin?: boolean } = {}
      ) {
        return async (request: Request) => {
          const session = await auth()
          
          if (!session?.user) {
            return NextResponse.json({
              success: false,
              error: {
                code: 'UNAUTHORIZED',
                message: 'Authentication required',
                requestId: crypto.randomUUID(),
                timestamp: new Date().toISOString(),
              },
            }, { status: 401 })
          }
          
          if (options.requireAdmin && session.user.role !== 'admin') {
            return NextResponse.json({
              success: false,
              error: {
                code: 'FORBIDDEN',
                message: 'Admin access required',
                requestId: crypto.randomUUID(),
                timestamp: new Date().toISOString(),
              },
            }, { status: 403 })
          }
          
          return handler(request, { session })
        }
      }
    usage: |
      export const GET = withAuth(async (req, { session }) => {
        // Handler code
      }, { requireAdmin: true })

  # ---------------------------------------------------------------------------
  # SERVICE TOKEN MIDDLEWARE
  # ---------------------------------------------------------------------------
  service_auth:
    name: withServiceAuth
    description: Validates internal service token
    implementation: |
      import { NextResponse } from 'next/server'
      
      export function withServiceAuth(handler: ServiceHandler) {
        return async (request: Request) => {
          const token = request.headers.get('X-Service-Token')
          const expectedToken = process.env.INTERNAL_SERVICE_TOKEN
          
          if (!token || token !== expectedToken) {
            return NextResponse.json({
              success: false,
              error: {
                code: 'UNAUTHORIZED',
                message: 'Invalid service token',
                requestId: crypto.randomUUID(),
                timestamp: new Date().toISOString(),
              },
            }, { status: 401 })
          }
          
          return handler(request)
        }
      }

  # ---------------------------------------------------------------------------
  # RATE LIMITING MIDDLEWARE
  # ---------------------------------------------------------------------------
  rate_limit:
    name: withRateLimit
    description: Enforces rate limiting per IP or user
    implementation: |
      import { Ratelimit } from '@upstash/ratelimit'
      import { Redis } from '@upstash/redis'
      import { NextResponse } from 'next/server'
      
      const redis = new Redis({
        url: process.env.UPSTASH_REDIS_URL!,
        token: process.env.UPSTASH_REDIS_TOKEN!,
      })
      
      const createRateLimiter = (requests: number, window: string) =>
        new Ratelimit({
          redis,
          limiter: Ratelimit.slidingWindow(requests, window),
          analytics: true,
        })
      
      export function withRateLimit(
        handler: Handler,
        options: { requests: number; window: string; keyPrefix?: string }
      ) {
        const limiter = createRateLimiter(options.requests, options.window)
        
        return async (request: Request) => {
          const ip = request.headers.get('x-forwarded-for') ?? '127.0.0.1'
          const key = `${options.keyPrefix ?? 'api'}:${ip}`
          
          const { success, limit, reset, remaining } = await limiter.limit(key)
          
          if (!success) {
            return NextResponse.json({
              success: false,
              error: {
                code: 'RATE_LIMIT_EXCEEDED',
                message: 'Too many requests',
                requestId: crypto.randomUUID(),
                timestamp: new Date().toISOString(),
              },
            }, {
              status: 429,
              headers: {
                'X-RateLimit-Limit': limit.toString(),
                'X-RateLimit-Remaining': remaining.toString(),
                'X-RateLimit-Reset': reset.toString(),
                'Retry-After': Math.ceil((reset - Date.now()) / 1000).toString(),
              },
            })
          }
          
          const response = await handler(request)
          response.headers.set('X-RateLimit-Limit', limit.toString())
          response.headers.set('X-RateLimit-Remaining', remaining.toString())
          response.headers.set('X-RateLimit-Reset', reset.toString())
          
          return response
        }
      }
    fallback_implementation: |
      // In-memory rate limiting (for development/no Redis)
      import { LRUCache } from 'lru-cache'
      
      const rateLimitCache = new LRUCache<string, number[]>({
        max: 10000,
        ttl: 60000, // 1 minute
      })
      
      export function withInMemoryRateLimit(
        handler: Handler,
        options: { requests: number; windowMs: number }
      ) {
        return async (request: Request) => {
          const ip = request.headers.get('x-forwarded-for') ?? '127.0.0.1'
          const now = Date.now()
          const windowStart = now - options.windowMs
          
          const requests = rateLimitCache.get(ip) ?? []
          const recentRequests = requests.filter(time => time > windowStart)
          
          if (recentRequests.length >= options.requests) {
            return NextResponse.json({
              success: false,
              error: {
                code: 'RATE_LIMIT_EXCEEDED',
                message: 'Too many requests',
                requestId: crypto.randomUUID(),
                timestamp: new Date().toISOString(),
              },
            }, { status: 429 })
          }
          
          recentRequests.push(now)
          rateLimitCache.set(ip, recentRequests)
          
          return handler(request)
        }
      }

  # ---------------------------------------------------------------------------
  # VALIDATION MIDDLEWARE
  # ---------------------------------------------------------------------------
  validation:
    name: withValidation
    description: Validates request body/query against Zod schema
    implementation: |
      import { NextResponse } from 'next/server'
      import { ZodSchema, ZodError } from 'zod'
      
      export function withValidation<T>(
        handler: (request: Request, data: T) => Promise<Response>,
        schema: ZodSchema<T>,
        source: 'body' | 'query' = 'body'
      ) {
        return async (request: Request) => {
          try {
            let rawData: unknown
            
            if (source === 'body') {
              rawData = await request.json()
            } else {
              const url = new URL(request.url)
              rawData = Object.fromEntries(url.searchParams)
            }
            
            const data = schema.parse(rawData)
            return handler(request, data)
          } catch (error) {
            if (error instanceof ZodError) {
              return NextResponse.json({
                success: false,
                error: {
                  code: 'VALIDATION_ERROR',
                  message: 'Invalid request data',
                  details: error.errors.map(e => ({
                    field: e.path.join('.'),
                    message: e.message,
                    code: e.code,
                  })),
                  requestId: crypto.randomUUID(),
                  timestamp: new Date().toISOString(),
                },
              }, { status: 400 })
            }
            throw error
          }
        }
      }

  # ---------------------------------------------------------------------------
  # ERROR HANDLING MIDDLEWARE
  # ---------------------------------------------------------------------------
  error_handler:
    name: withErrorHandler
    description: Global error handler for API routes
    implementation: |
      import { NextResponse } from 'next/server'
      import { DrizzleError, NotFoundError } from 'drizzle-orm'
      import { logger } from '@/lib/logger'
      
      export class ApiError extends Error {
        constructor(
          public code: string,
          public message: string,
          public status: number = 500,
          public details?: Array<{ field?: string; message: string }>
        ) {
          super(message)
          this.name = 'ApiError'
        }
      }
      
      export function withErrorHandler(handler: Handler) {
        return async (request: Request) => {
          const requestId = crypto.randomUUID()
          
          try {
            return await handler(request)
          } catch (error) {
            logger.error('API Error', {
              requestId,
              error,
              path: new URL(request.url).pathname,
              method: request.method,
            })
            
            // Handle known error types
            if (error instanceof ApiError) {
              return NextResponse.json({
                success: false,
                error: {
                  code: error.code,
                  message: error.message,
                  details: error.details,
                  requestId,
                  timestamp: new Date().toISOString(),
                },
              }, { status: error.status })
            }
            
            // Database errors (Drizzle/postgres.js)
            if (error instanceof Error && error.message.includes('duplicate key')) {
              return NextResponse.json({
                success: false,
                error: {
                  code: 'CONFLICT',
                  message: 'Resource already exists',
                  requestId,
                  timestamp: new Date().toISOString(),
                },
              }, { status: 409 })
            }
            
            // Generic error
            return NextResponse.json({
              success: false,
              error: {
                code: 'INTERNAL_ERROR',
                message: 'An unexpected error occurred',
                requestId,
                timestamp: new Date().toISOString(),
              },
            }, { status: 500 })
          }
        }
      }

  # ---------------------------------------------------------------------------
  # CORS MIDDLEWARE
  # ---------------------------------------------------------------------------
  cors:
    name: withCors
    description: CORS headers for cross-origin requests
    implementation: |
      import { NextResponse } from 'next/server'
      
      type CorsOptions = {
        origins: string[] | '*'
        methods: string[]
        headers: string[]
        credentials?: boolean
        maxAge?: number
      }
      
      export function withCors(handler: Handler, options: CorsOptions) {
        return async (request: Request) => {
          const origin = request.headers.get('origin')
          
          // Handle preflight
          if (request.method === 'OPTIONS') {
            return new NextResponse(null, {
              status: 204,
              headers: getCorsHeaders(origin, options),
            })
          }
          
          const response = await handler(request)
          const corsHeaders = getCorsHeaders(origin, options)
          
          Object.entries(corsHeaders).forEach(([key, value]) => {
            response.headers.set(key, value)
          })
          
          return response
        }
      }
      
      function getCorsHeaders(origin: string | null, options: CorsOptions) {
        const headers: Record<string, string> = {}
        
        if (options.origins === '*') {
          headers['Access-Control-Allow-Origin'] = '*'
        } else if (origin && options.origins.includes(origin)) {
          headers['Access-Control-Allow-Origin'] = origin
          headers['Vary'] = 'Origin'
        }
        
        headers['Access-Control-Allow-Methods'] = options.methods.join(', ')
        headers['Access-Control-Allow-Headers'] = options.headers.join(', ')
        
        if (options.credentials) {
          headers['Access-Control-Allow-Credentials'] = 'true'
        }
        
        if (options.maxAge) {
          headers['Access-Control-Max-Age'] = options.maxAge.toString()
        }
        
        return headers
      }

  # ---------------------------------------------------------------------------
  # COMBINED MIDDLEWARE
  # ---------------------------------------------------------------------------
  compose:
    name: composeMiddleware
    description: Compose multiple middleware functions
    implementation: |
      type Middleware = (handler: Handler) => Handler
      
      export function composeMiddleware(...middlewares: Middleware[]) {
        return (handler: Handler): Handler => {
          return middlewares.reduceRight(
            (acc, middleware) => middleware(acc),
            handler
          )
        }
      }
      
      // Example usage:
      const protectedRoute = composeMiddleware(
        withErrorHandler,
        withCors({ origins: ['https://admin.example.com'], methods: ['GET', 'POST'], headers: ['Content-Type'] }),
        withRateLimit({ requests: 60, window: '1m' }),
        withAuth({ requireAdmin: true })
      )
      
      export const POST = protectedRoute(async (request, { session }) => {
        // Handler code
      })

# =============================================================================
# RESPONSE FORMAT STANDARDS
# =============================================================================

response_standards:
  # ---------------------------------------------------------------------------
  # SUCCESS RESPONSES
  # ---------------------------------------------------------------------------
  success:
    single_resource:
      description: Response for single resource operations
      format:
        success: true
        data: "{ ...resource }"
        meta:
          requestId: "string"
          timestamp: "ISO 8601 datetime"
      example:
        success: true
        data:
          id: "clx1234567890abcdef"
          title: "My Project"
          slug: "my-project"
        meta:
          requestId: "req_abc123def456"
          timestamp: "2024-01-20T15:30:00.000Z"

    list_resource:
      description: Response for list operations
      format:
        success: true
        data: "[...resources]"
        meta:
          pagination:
            page: "number"
            limit: "number"
            total: "number"
            totalPages: "number"
            hasNext: "boolean"
            hasPrev: "boolean"
          requestId: "string"
          timestamp: "ISO 8601 datetime"

    created:
      status: 201
      description: Resource created successfully

    accepted:
      status: 202
      description: Request accepted for async processing
      format:
        success: true
        data:
          jobId: "string"
          status: "queued"

    no_content:
      status: 204
      description: Operation successful, no content returned

  # ---------------------------------------------------------------------------
  # ERROR RESPONSES
  # ---------------------------------------------------------------------------
  errors:
    format:
      success: false
      error:
        code: "UPPER_SNAKE_CASE error code"
        message: "Human-readable message"
        details: "[{ field?, message, code? }]"
        requestId: "string"
        timestamp: "ISO 8601 datetime"

    codes:
      - code: VALIDATION_ERROR
        status: 400
        description: Request validation failed
        example:
          success: false
          error:
            code: "VALIDATION_ERROR"
            message: "Invalid request data"
            details:
              - field: "email"
                message: "Invalid email format"
                code: "invalid_string"
            requestId: "req_abc123"
            timestamp: "2024-01-20T15:30:00.000Z"

      - code: UNAUTHORIZED
        status: 401
        description: Authentication required or invalid

      - code: FORBIDDEN
        status: 403
        description: User lacks required permissions

      - code: NOT_FOUND
        status: 404
        description: Requested resource not found

      - code: CONFLICT
        status: 409
        description: Resource conflict (e.g., duplicate slug)

      - code: RATE_LIMIT_EXCEEDED
        status: 429
        description: Too many requests
        headers:
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
          - X-RateLimit-Reset
          - Retry-After

      - code: INTERNAL_ERROR
        status: 500
        description: Unexpected server error

      - code: SERVICE_UNAVAILABLE
        status: 503
        description: Service temporarily unavailable

# =============================================================================
# PAGINATION PATTERNS
# =============================================================================

pagination:
  default_limit: 10
  max_limit: 100
  
  strategies:
    offset:
      description: Page-based pagination using offset
      query_params:
        page: "Page number (1-indexed)"
        limit: "Items per page"
      implementation: |
        const page = Math.max(1, params.page)
        const limit = Math.min(100, Math.max(1, params.limit))
        const skip = (page - 1) * limit
        
        const [data, total] = await Promise.all([
          db.select().from(model).where(query.where).limit(limit).offset(skip).orderBy(query.orderBy),
          db.select({ count: sql<number>`count(*)::int` }).from(model).where(query.where),
        ])
        
        return {
          data,
          meta: {
            pagination: {
              page,
              limit,
              total,
              totalPages: Math.ceil(total / limit),
              hasNext: page * limit < total,
              hasPrev: page > 1,
            },
          },
        }

    cursor:
      description: Cursor-based pagination for large datasets
      query_params:
        cursor: "Last item ID from previous page"
        limit: "Items per page"
      implementation: |
        const limit = Math.min(100, Math.max(1, params.limit))
        const cursor = params.cursor
        
        const data = await db.select().from(model)
          .where(cursor ? and(query.where, gt(model.id, cursor)) : query.where)
          .limit(limit + 1) // Fetch one extra to check hasNext
          .orderBy(model.id)
        
        const hasNext = data.length > limit
        if (hasNext) data.pop()
        
        return {
          data,
          meta: {
            pagination: {
              nextCursor: hasNext ? data[data.length - 1].id : null,
              hasNext,
            },
          },
        }

  sorting:
    description: Sorting configuration
    default_field: createdAt
    default_order: desc
    allowed_fields:
      projects: [createdAt, updatedAt, title, order]
      blogs: [createdAt, publishedAt, order]
      guestbook: [createdAt]
      messages: [createdAt, isRead]
      chat_logs: [createdAt, updatedAt]
    implementation: |
      const sortField = allowedFields.includes(params.sort) ? params.sort : 'createdAt'
      const sortOrder = params.order === 'asc' ? 'asc' : 'desc'
      
      return {
        orderBy: { [sortField]: sortOrder },
      }

# =============================================================================
# SDK INTEGRATION PATTERNS
# =============================================================================

sdk:
  package_location: packages/sdk
  
  structure:
    - src/
      - admin-api/
        - client.ts
        - types.ts
        - projects.ts
        - contexts.ts
        - blogs.ts
        - guestbook.ts
        - messages.ts
        - chat-logs.ts
        - links.ts
        - knowledge.ts
      - public-api/
        - client.ts
        - types.ts
      - internal-api/
        - client.ts
        - types.ts
      - index.ts

  client_pattern:
    description: Type-safe API client pattern
    implementation: |
      // packages/sdk/src/admin-api/client.ts
      import type { 
        Project, ProjectCreate, ProjectUpdate,
        PaginationParams, PaginatedResponse, ApiResponse,
      } from './types'
      
      export class AdminApiClient {
        private baseUrl: string
        private getToken: () => Promise<string>
        
        constructor(config: { baseUrl: string; getToken: () => Promise<string> }) {
          this.baseUrl = config.baseUrl
          this.getToken = config.getToken
        }
        
        private async fetch<T>(
          path: string,
          options: RequestInit = {}
        ): Promise<ApiResponse<T>> {
          const token = await this.getToken()
          
          const response = await fetch(`${this.baseUrl}${path}`, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
              ...options.headers,
            },
          })
          
          const data = await response.json()
          
          if (!response.ok) {
            throw new ApiError(data.error.code, data.error.message, response.status)
          }
          
          return data
        }
        
        // Projects
        projects = {
          list: (params?: PaginationParams) =>
            this.fetch<PaginatedResponse<Project>>(`/api/admin/projects?${new URLSearchParams(params)}`),
          
          get: (id: string) =>
            this.fetch<Project>(`/api/admin/projects/${id}`),
          
          create: (data: ProjectCreate) =>
            this.fetch<Project>('/api/admin/projects', {
              method: 'POST',
              body: JSON.stringify(data),
            }),
          
          update: (id: string, data: ProjectUpdate) =>
            this.fetch<Project>(`/api/admin/projects/${id}`, {
              method: 'PUT',
              body: JSON.stringify(data),
            }),
          
          delete: (id: string) =>
            this.fetch<{ deleted: boolean }>(`/api/admin/projects/${id}`, {
              method: 'DELETE',
            }),
        }
        
        // ... other resources
      }

  usage_example: |
    // In apps/admin
    import { AdminApiClient } from '@naufalrf/sdk'
    import { auth } from '@/auth'
    
    const client = new AdminApiClient({
      baseUrl: process.env.NEXT_PUBLIC_API_URL!,
      getToken: async () => {
        const session = await auth()
        return session?.accessToken ?? ''
      },
    })
    
    // Usage
    const projects = await client.projects.list({ page: 1, limit: 10 })
    const project = await client.projects.create({ title: 'New Project', slug: 'new-project', ... })

  public_client_pattern:
    description: Public API client (no auth)
    implementation: |
      // packages/sdk/src/public-api/client.ts
      export class PublicApiClient {
        private baseUrl: string
        
        constructor(baseUrl: string) {
          this.baseUrl = baseUrl
        }
        
        private async fetch<T>(path: string): Promise<ApiResponse<T>> {
          const response = await fetch(`${this.baseUrl}${path}`, {
            next: { revalidate: 60 }, // Next.js caching
          })
          
          if (!response.ok) {
            throw new Error(`API Error: ${response.status}`)
          }
          
          return response.json()
        }
        
        projects = {
          list: (params?: { category?: string; featured?: boolean }) =>
            this.fetch<PaginatedResponse<Project>>(
              `/api/public/projects?${new URLSearchParams(params)}`
            ),
          
          getBySlug: (slug: string) =>
            this.fetch<ProjectWithContexts>(`/api/public/projects/${slug}`),
        }
        
        blogs = {
          list: () => this.fetch<PaginatedResponse<BlogLink>>('/api/public/blogs'),
        }
        
        guestbook = {
          list: () => this.fetch<PaginatedResponse<GuestbookEntry>>('/api/public/guestbook'),
        }
        
        links = {
          list: () => this.fetch<PaginatedResponse<ProfileLink>>('/api/public/links'),
        }
      }

  internal_client_pattern:
    description: Internal API client with service token
    implementation: |
      // packages/sdk/src/internal-api/client.ts
      export class InternalApiClient {
        private baseUrl: string
        private serviceToken: string
        
        constructor(config: { baseUrl: string; serviceToken: string }) {
          this.baseUrl = config.baseUrl
          this.serviceToken = config.serviceToken
        }
        
        private async fetch<T>(
          path: string,
          options: RequestInit = {}
        ): Promise<ApiResponse<T>> {
          const response = await fetch(`${this.baseUrl}${path}`, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'X-Service-Token': this.serviceToken,
              ...options.headers,
            },
          })
          
          if (!response.ok) {
            throw new Error(`Internal API Error: ${response.status}`)
          }
          
          return response.json()
        }
        
        chatLogs = {
          create: (data: ChatLogCreate) =>
            this.fetch<{ id: string; sessionId: string }>('/api/internal/chat-logs', {
              method: 'POST',
              body: JSON.stringify(data),
            }),
        }
        
        content = {
          export: () =>
            this.fetch<ContentExport>('/api/internal/content'),
          
          projects: () =>
            this.fetch<ProjectWithContexts[]>('/api/internal/content/projects'),
          
          knowledge: () =>
            this.fetch<KnowledgeDoc[]>('/api/internal/content/knowledge'),
        }
      }

