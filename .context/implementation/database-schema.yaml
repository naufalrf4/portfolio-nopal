seeding:
  file_location: "apps/admin/db/seed.ts"
  
  command:
    development: "pnpm --filter admin db:seed"
    configuration: |
      // In apps/admin/package.json
      {
        "scripts": {
          "db:seed": "tsx db/seed.ts"
        }
      }

  seed_script: |
    // apps/admin/db/seed.ts
    import { db } from './index';
