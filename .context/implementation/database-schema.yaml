# =============================================================================
# DATABASE CLIENT SETUP
# =============================================================================

database_client:
  location: "apps/admin/db/index.ts"
  
  setup: |
    // apps/admin/db/index.ts
    import { drizzle } from 'drizzle-orm/postgres-js';
    import postgres from 'postgres';
    import * as schema from './schema';

    // Create postgres.js client
    const client = postgres(process.env.DATABASE_URL!, {
      max: 10,
      idle_timeout: 20,
      connect_timeout: 10,
    });

    // Initialize Drizzle with schema
    export const db = drizzle(client, { schema });
    
    // Export all schema tables and helpers
    export * from './schema';
  
  usage: |
    // In any file that needs database access
    import { db, projects, eq } from '@/db';
    
    const allProjects = await db.select().from(projects);
    const project = await db.select()
      .from(projects)
      .where(eq(projects.id, projectId))
      .limit(1);

# =============================================================================
# MIGRATION COMMANDS REFERENCE
# =============================================================================

migration_commands:
  generate:
    command: "pnpm --filter admin db:generate"
    description: "Generate migration files from schema changes"
    when: "After modifying db/schema.ts"
  
  migrate:
    command: "pnpm --filter admin db:migrate"
    description: "Apply pending migrations to database"
    when: "Deploy to staging/production"
  
  push:
    command: "pnpm --filter admin db:push"
    description: "Push schema directly without migrations (dev only)"
    when: "Rapid prototyping in development"
    warning: "Skips migration history - use only in development"
  
  studio:
    command: "pnpm --filter admin db:studio"
    description: "Open Drizzle Studio for database browsing"
    port: 4983
  
  pull:
    command: "pnpm --filter admin db:pull"
    description: "Introspect database and generate schema"
    when: "Reverse-engineer existing database"

# =============================================================================
# Portfolio Ecosystem Database Schema Specification
# =============================================================================
# Version: 2.0.0
# Database: PostgreSQL (via Drizzle ORM + postgres.js)
# Last Updated: 2024
# =============================================================================

metadata:
  name: "Portfolio Ecosystem Database"
  version: "1.0.0"
  database: "PostgreSQL"
  orm: "Drizzle ORM"
  driver: "postgres.js"
  description: |
    Comprehensive database schema for a personal portfolio ecosystem including
    projects, blog links, guestbook, anonymous messages, chat logs, and more.

# =============================================================================
# ENTITY RELATIONSHIP DIAGRAM (Text-Based)
# =============================================================================

relationship_diagram: |
  ┌─────────────────────────────────────────────────────────────────────────────┐
  │                        PORTFOLIO ECOSYSTEM ERD                              │
  └─────────────────────────────────────────────────────────────────────────────┘
  
  ┌──────────────────┐         ┌──────────────────────┐
  │      User        │         │      Project         │
  ├──────────────────┤         ├──────────────────────┤
  │ PK id            │         │ PK id                │
  │    email (unique)│         │    title             │
  │    name          │         │    slug (unique)     │
  │    image         │         │    summary           │
  │    role (enum)   │         │    description       │
  │    createdAt     │         │    category          │
  │    updatedAt     │         │    techStack[]       │
  └────────┬─────────┘         │    liveUrl           │
           │                   │    repoUrl           │
           │ 1:N               │    featured          │
           │                   │    visible           │
           ▼                   │    order             │
  ┌──────────────────┐         │    createdAt         │
  │  GuestbookEntry  │         │    updatedAt         │
  ├──────────────────┤         └──────────┬───────────┘
  │ PK id            │                    │
  │ FK userId ───────┼────────────────────┤ 1:N
  │    message       │                    │
  │    reactions     │                    ▼
  │    visible       │         ┌──────────────────────┐
  │    createdAt     │         │   ProjectContext     │
  │    updatedAt     │         ├──────────────────────┤
  └──────────────────┘         │ PK id                │
                               │ FK projectId ────────┤
                               │    type (enum)       │
                               │    title             │
                               │    content (markdown)│
                               │    order             │
                               │    createdAt         │
                               │    updatedAt         │
                               └──────────────────────┘
  
  ┌──────────────────┐         ┌──────────────────────┐
  │    BlogLink      │         │  AnonymousMessage    │
  ├──────────────────┤         ├──────────────────────┤
  │ PK id            │         │ PK id                │
  │    url (unique)  │         │    content           │
  │    title         │         │    ipHash            │
  │    description   │         │    read              │
  │    imageUrl      │         │    createdAt         │
  │    source        │         │    updatedAt         │
  │    publishedAt   │         └──────────────────────┘
  │    visible       │
  │    order         │         ┌──────────────────────┐
  │    createdAt     │         │      ChatLog         │
  │    updatedAt     │         ├──────────────────────┤
  └──────────────────┘         │ PK id                │
                               │    sessionId (unique)│
                               │    messages (JSON[]) │
                               │    createdAt         │
                               │    updatedAt         │
                               └──────────────────────┘
  
  ┌──────────────────┐         ┌──────────────────────┐
  │   ProfileLink    │         │   KnowledgeDoc       │
  ├──────────────────┤         ├──────────────────────┤
  │ PK id            │         │ PK id                │
  │    label         │         │    filename (unique) │
  │    url           │         │    content           │
  │    icon          │         │    indexed           │
  │    visible       │         │    createdAt         │
  │    order         │         │    updatedAt         │
  │    createdAt     │         └──────────────────────┘
  │    updatedAt     │
  └──────────────────┘
  
  ═══════════════════════════════════════════════════════════════════════════════
  LEGEND:
    PK = Primary Key
    FK = Foreign Key
    1:N = One-to-Many Relationship
    ──► = Foreign Key Reference
  ═══════════════════════════════════════════════════════════════════════════════

# =============================================================================
# ENUM DEFINITIONS
# =============================================================================

enums:
  UserRole:
    description: "Defines user permission levels"
    values:
      - name: ADMIN
        description: "Full access to all features including content management"
      - name: USER
        description: "Standard user access for guestbook and interactions"
    default: USER

  ProjectContextType:
    description: "Categories for project context sections"
    values:
      - name: CONTEXT
        description: "Background and problem statement"
      - name: ROLE
        description: "Personal role and responsibilities"
      - name: DECISIONS
        description: "Key technical and design decisions"
      - name: TRADEOFFS
        description: "Tradeoffs considered and made"
      - name: RESULT
        description: "Outcomes and achievements"
      - name: ARCHITECTURE
        description: "System architecture and design patterns"
      - name: OPERATIONS
        description: "Deployment, monitoring, and maintenance"
      - name: METRICS
        description: "Performance metrics and KPIs"

# =============================================================================
# JSON FIELD STRUCTURES
# =============================================================================

json_structures:
  GuestbookReactions:
    description: "Structure for storing emoji reactions on guestbook entries"
    schema:
      type: object
      properties:
        emoji:
          type: string
          description: "Emoji character or code"
        count:
          type: integer
          description: "Number of times this reaction was used"
        userIds:
          type: array
          items:
            type: string
          description: "List of user IDs who reacted"
    example: |
      {
        "reactions": [
          { "emoji": "heart", "count": 5, "userIds": ["user1", "user2", "user3", "user4", "user5"] },
          { "emoji": "fire", "count": 3, "userIds": ["user1", "user6", "user7"] },
          { "emoji": "thumbsup", "count": 2, "userIds": ["user2", "user8"] }
        ]
      }

  ChatMessages:
    description: "Structure for storing chat conversation messages"
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          role:
            type: string
            enum: [user, assistant, system]
          content:
            type: string
          timestamp:
            type: string
            format: datetime
          metadata:
            type: object
            properties:
              model:
                type: string
              tokens:
                type: integer
              duration:
                type: number
    example: |
      {
        "messages": [
          {
            "id": "msg_001",
            "role": "user",
            "content": "Tell me about your experience with React",
            "timestamp": "2024-01-15T10:30:00Z",
            "metadata": null
          },
          {
            "id": "msg_002",
            "role": "assistant",
            "content": "I have extensive experience with React...",
            "timestamp": "2024-01-15T10:30:02Z",
            "metadata": {
              "model": "gpt-4",
              "tokens": 150,
              "duration": 1.2
            }
          }
        ]
      }

# =============================================================================
# DRIZZLE SCHEMA DEFINITION
# =============================================================================

drizzle_schema: |
  // ==========================================================================
  // Drizzle Schema for Portfolio Ecosystem
  // ==========================================================================
  // Location: apps/admin/db/schema.ts
  // Run: pnpm --filter admin db:generate
  // Run: pnpm --filter admin db:migrate
  // ==========================================================================

  // --------------------------------------------------------------------------
  // IMPORTS
  // --------------------------------------------------------------------------

  import { pgTable, pgEnum, uuid, text, timestamp, boolean, integer, jsonb, varchar } from 'drizzle-orm/pg-core';
  import { relations } from 'drizzle-orm';
  import { vector } from 'pgvector/drizzle-orm';

  // --------------------------------------------------------------------------
  // ENUMS
  // --------------------------------------------------------------------------

  export const userRoleEnum = pgEnum('user_role', ['user', 'admin']);
  export const projectContextTypeEnum = pgEnum('project_context_type', [
    'context',
    'role',
    'decisions',
    'tradeoffs',
    'result',
    'architecture',
    'operations',
    'metrics',
  ]);
  export const bookingStatusEnum = pgEnum('booking_status', ['pending', 'confirmed', 'cancelled', 'completed']);
  export const slotStatusEnum = pgEnum('slot_status', ['available', 'booked']);

  // --------------------------------------------------------------------------
  // USER TABLE
  // --------------------------------------------------------------------------

  export const users = pgTable('users', {
    id: uuid('id').primaryKey().defaultRandom(),
    email: text('email').notNull().unique(),
    name: text('name'),
    image: text('image'),
    role: userRoleEnum('role').default('user').notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    emailIdx: index('users_email_idx').on(table.email),
    roleIdx: index('users_role_idx').on(table.role),
    createdAtIdx: index('users_created_at_idx').on(table.createdAt),
  }));

  export const usersRelations = relations(users, ({ many }) => ({
    accounts: many(accounts),
    sessions: many(sessions),
    guestbookEntries: many(guestbookEntries),
  }));

  // --------------------------------------------------------------------------
  // NEXTAUTH TABLES (Account, Session, VerificationToken)
  // --------------------------------------------------------------------------

  export const accounts = pgTable('accounts', {
    id: uuid('id').primaryKey().defaultRandom(),
    userId: uuid('user_id').notNull().references(() => users.id, { onDelete: 'cascade' }),
    type: text('type').notNull(),
    provider: text('provider').notNull(),
    providerAccountId: text('provider_account_id').notNull(),
    refresh_token: text('refresh_token'),
    access_token: text('access_token'),
    expires_at: integer('expires_at'),
    token_type: text('token_type'),
    scope: text('scope'),
    id_token: text('id_token'),
    session_state: text('session_state'),
  }, (table) => ({
    providerProviderAccountIdKey: unique('accounts_provider_provider_account_id_key').on(table.provider, table.providerAccountId),
  }));

  export const accountsRelations = relations(accounts, ({ one }) => ({
    user: one(users, { fields: [accounts.userId], references: [users.id] }),
  }));

  export const sessions = pgTable('sessions', {
    id: uuid('id').primaryKey().defaultRandom(),
    sessionToken: text('session_token').notNull().unique(),
    userId: uuid('user_id').notNull().references(() => users.id, { onDelete: 'cascade' }),
    expires: timestamp('expires').notNull(),
  });

  export const sessionsRelations = relations(sessions, ({ one }) => ({
    user: one(users, { fields: [sessions.userId], references: [users.id] }),
  }));

  export const verificationTokens = pgTable('verification_tokens', {
    identifier: text('identifier').notNull(),
    token: text('token').notNull().unique(),
    expires: timestamp('expires').notNull(),
  }, (table) => ({
    identifierTokenKey: unique('verification_tokens_identifier_token_key').on(table.identifier, table.token),
  }));

  // --------------------------------------------------------------------------
  // PROJECT TABLE
  // --------------------------------------------------------------------------

  export const projects = pgTable('projects', {
    id: uuid('id').primaryKey().defaultRandom(),
    title: text('title').notNull(),
    slug: text('slug').notNull().unique(),
    summary: text('summary').notNull(),
    description: text('description').notNull(),
    category: text('category').notNull(),
    techStack: text('tech_stack').array().notNull().default([]),
    tags: text('tags').array().notNull().default([]),
    liveUrl: text('live_url'),
    repoUrl: text('repo_url'),
    imageUrl: text('image_url'),
    featured: boolean('featured').default(false).notNull(),
    visible: boolean('visible').default(true).notNull(),
    order: integer('order').default(0).notNull(),
    startDate: timestamp('start_date'),
    endDate: timestamp('end_date'),
    projectDate: text('project_date'),
    content: text('content'),
    thumbnailId: uuid('thumbnail_id'),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    slugIdx: index('projects_slug_idx').on(table.slug),
    categoryIdx: index('projects_category_idx').on(table.category),
    featuredIdx: index('projects_featured_idx').on(table.featured),
    visibleIdx: index('projects_visible_idx').on(table.visible),
    orderIdx: index('projects_order_idx').on(table.order),
    createdAtIdx: index('projects_created_at_idx').on(table.createdAt),
    visibleFeaturedOrderIdx: index('projects_visible_featured_order_idx').on(table.visible, table.featured, table.order),
  }));

  export const projectsRelations = relations(projects, ({ many }) => ({
    contexts: many(projectContexts),
    images: many(projectImages),
  }));

  // --------------------------------------------------------------------------
  // PROJECT CONTEXT TABLE
  // --------------------------------------------------------------------------

  export const projectContexts = pgTable('project_contexts', {
    id: uuid('id').primaryKey().defaultRandom(),
    projectId: uuid('project_id').notNull().references(() => projects.id, { onDelete: 'cascade' }),
    type: projectContextTypeEnum('type').notNull(),
    title: text('title').notNull(),
    content: text('content').notNull(),
    order: integer('order').default(0).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    projectIdIdx: index('project_contexts_project_id_idx').on(table.projectId),
    typeIdx: index('project_contexts_type_idx').on(table.type),
    orderIdx: index('project_contexts_order_idx').on(table.order),
    projectIdTypeIdx: index('project_contexts_project_id_type_idx').on(table.projectId, table.type),
    projectIdOrderIdx: index('project_contexts_project_id_order_idx').on(table.projectId, table.order),
  }));

  export const projectContextsRelations = relations(projectContexts, ({ one }) => ({
    project: one(projects, { fields: [projectContexts.projectId], references: [projects.id] }),
  }));

  // --------------------------------------------------------------------------
  // PROJECT IMAGE TABLE
  // --------------------------------------------------------------------------

  export const projectImages = pgTable('project_images', {
    id: uuid('id').primaryKey().defaultRandom(),
    projectId: uuid('project_id').notNull().references(() => projects.id, { onDelete: 'cascade' }),
    url: text('url').notNull(),
    key: text('key').notNull(),
    order: integer('order').default(0).notNull(),
    caption: text('caption'),
    alt: text('alt'),
    createdAt: timestamp('created_at').defaultNow().notNull(),
  }, (table) => ({
    projectIdIdx: index('project_images_project_id_idx').on(table.projectId),
    orderIdx: index('project_images_order_idx').on(table.order),
  }));

  export const projectImagesRelations = relations(projectImages, ({ one }) => ({
    project: one(projects, { fields: [projectImages.projectId], references: [projects.id] }),
  }));

  // --------------------------------------------------------------------------
  // BLOG LINK TABLE
  // --------------------------------------------------------------------------

  export const blogLinks = pgTable('blog_links', {
    id: uuid('id').primaryKey().defaultRandom(),
    url: text('url').notNull(),
    title: text('title').notNull(),
    description: text('description'),
    imageUrl: text('image_url'),
    source: text('source').notNull(),
    category: text('category'),
    tags: text('tags').array().notNull().default([]),
    publishedAt: timestamp('published_at').notNull(),
    visible: boolean('visible').default(true).notNull(),
    order: integer('order').default(0).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    sourceIdx: index('blog_links_source_idx').on(table.source),
    visibleIdx: index('blog_links_visible_idx').on(table.visible),
    orderIdx: index('blog_links_order_idx').on(table.order),
    publishedAtIdx: index('blog_links_published_at_idx').on(table.publishedAt),
    visibleOrderIdx: index('blog_links_visible_order_idx').on(table.visible, table.order),
  }));

  // --------------------------------------------------------------------------
  // GUESTBOOK ENTRY TABLE
  // --------------------------------------------------------------------------

  export const guestbookEntries = pgTable('guestbook_entries', {
    id: uuid('id').primaryKey().defaultRandom(),
    userId: uuid('user_id').notNull().references(() => users.id, { onDelete: 'cascade' }),
    message: text('message').notNull(),
    reactions: jsonb('reactions').default([]).notNull(),
    visible: boolean('visible').default(true).notNull(),
    ipAddress: text('ip_address'),
    countryCode: text('country_code'),
    country: text('country'),
    city: text('city'),
    region: text('region'),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    userIdIdx: index('guestbook_entries_user_id_idx').on(table.userId),
    visibleIdx: index('guestbook_entries_visible_idx').on(table.visible),
    createdAtIdx: index('guestbook_entries_created_at_idx').on(table.createdAt),
    visibleCreatedAtIdx: index('guestbook_entries_visible_created_at_idx').on(table.visible, table.createdAt),
    countryCodeIdx: index('guestbook_entries_country_code_idx').on(table.countryCode),
  }));

  export const guestbookEntriesRelations = relations(guestbookEntries, ({ one }) => ({
    user: one(users, { fields: [guestbookEntries.userId], references: [users.id] }),
  }));

  // --------------------------------------------------------------------------
  // ANALYTICS EVENT TABLE
  // --------------------------------------------------------------------------

  export const analyticsEvents = pgTable('analytics_events', {
    id: uuid('id').primaryKey().defaultRandom(),
    page: varchar('page', { length: 100 }).notNull(),
    entityType: varchar('entity_type', { length: 50 }).notNull(),
    entityId: text('entity_id'),
    eventType: varchar('event_type', { length: 20 }).notNull(),
    data: jsonb('data'),
    userSession: text('user_session'),
    ipAddress: varchar('ip_address', { length: 45 }),
    countryCode: varchar('country_code', { length: 2 }),
    city: varchar('city', { length: 100 }),
    createdAt: timestamp('created_at').defaultNow().notNull(),
  }, (table) => ({
    pageIdx: index('analytics_events_page_idx').on(table.page),
    eventTypeIdx: index('analytics_events_event_type_idx').on(table.eventType),
    entityTypeEntityIdIdx: index('analytics_events_entity_type_entity_id_idx').on(table.entityType, table.entityId),
    createdAtIdx: index('analytics_events_created_at_idx').on(table.createdAt),
  }));

  // --------------------------------------------------------------------------
  // ANONYMOUS MESSAGE TABLE
  // --------------------------------------------------------------------------

  export const anonymousMessages = pgTable('anonymous_messages', {
    id: uuid('id').primaryKey().defaultRandom(),
    content: text('content').notNull(),
    ipHash: text('ip_hash').notNull(),
    read: boolean('read').default(false).notNull(),
    ipAddress: text('ip_address'),
    countryCode: text('country_code'),
    country: text('country'),
    city: text('city'),
    region: text('region'),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    readIdx: index('anonymous_messages_read_idx').on(table.read),
    createdAtIdx: index('anonymous_messages_created_at_idx').on(table.createdAt),
    readCreatedAtIdx: index('anonymous_messages_read_created_at_idx').on(table.read, table.createdAt),
    countryCodeIdx: index('anonymous_messages_country_code_idx').on(table.countryCode),
    cityIdx: index('anonymous_messages_city_idx').on(table.city),
  }));

  // --------------------------------------------------------------------------
  // CHAT LOG TABLE
  // --------------------------------------------------------------------------

  export const chatLogs = pgTable('chat_logs', {
    id: uuid('id').primaryKey().defaultRandom(),
    sessionId: text('session_id').notNull().unique(),
    messages: jsonb('messages').default([]).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    sessionIdIdx: index('chat_logs_session_id_idx').on(table.sessionId),
    createdAtIdx: index('chat_logs_created_at_idx').on(table.createdAt),
  }));

  // --------------------------------------------------------------------------
  // PROFILE LINK TABLE
  // --------------------------------------------------------------------------

  export const profileLinks = pgTable('profile_links', {
    id: uuid('id').primaryKey().defaultRandom(),
    label: text('label').notNull(),
    url: text('url').notNull(),
    icon: text('icon'),
    visible: boolean('visible').default(true).notNull(),
    order: integer('order').default(0).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    visibleIdx: index('profile_links_visible_idx').on(table.visible),
    orderIdx: index('profile_links_order_idx').on(table.order),
    visibleOrderIdx: index('profile_links_visible_order_idx').on(table.visible, table.order),
  }));

  // --------------------------------------------------------------------------
  // KNOWLEDGE DOC TABLE
  // --------------------------------------------------------------------------

  export const knowledgeDocs = pgTable('knowledge_docs', {
    id: uuid('id').primaryKey().defaultRandom(),
    filename: text('filename').notNull().unique(),
    content: text('content').notNull(),
    indexed: boolean('indexed').default(false).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    filenameIdx: index('knowledge_docs_filename_idx').on(table.filename),
    indexedIdx: index('knowledge_docs_indexed_idx').on(table.indexed),
    createdAtIdx: index('knowledge_docs_created_at_idx').on(table.createdAt),
    indexedUpdatedAtIdx: index('knowledge_docs_indexed_updated_at_idx').on(table.indexed, table.updatedAt),
  }));

  // --------------------------------------------------------------------------
  // CONTACT FORM TABLE
  // --------------------------------------------------------------------------

  export const contactForms = pgTable('contact_forms', {
    id: uuid('id').primaryKey().defaultRandom(),
    name: text('name').notNull(),
    email: text('email').notNull(),
    subject: text('subject'),
    message: text('message').notNull(),
    ipHash: text('ip_hash').notNull(),
    ipAddress: text('ip_address'),
    countryCode: text('country_code'),
    country: text('country'),
    city: text('city'),
    region: text('region'),
    read: boolean('read').default(false).notNull(),
    replied: boolean('replied').default(false).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    readIdx: index('contact_forms_read_idx').on(table.read),
    createdAtIdx: index('contact_forms_created_at_idx').on(table.createdAt),
    countryCodeIdx: index('contact_forms_country_code_idx').on(table.countryCode),
  }));

  export const contactSettings = pgTable('contact_settings', {
    id: uuid('id').primaryKey().defaultRandom(),
    notificationEmail: text('notification_email'),
    blockedKeywords: text('blocked_keywords').array().notNull().default([]),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  });

  // --------------------------------------------------------------------------
  // BOOKING TABLES
  // --------------------------------------------------------------------------

  export const bookingSlots = pgTable('booking_slots', {
    id: uuid('id').primaryKey().defaultRandom(),
    date: timestamp('date', { mode: 'date' }).notNull(),
    time: text('time').notNull(),
    duration: integer('duration').default(60).notNull(),
    status: slotStatusEnum('status').default('available').notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    dateTimeKey: unique('booking_slots_date_time_key').on(table.date, table.time),
    dateStatusIdx: index('booking_slots_date_status_idx').on(table.date, table.status),
  }));

  export const bookings = pgTable('bookings', {
    id: uuid('id').primaryKey().defaultRandom(),
    name: text('name').notNull(),
    email: text('email').notNull(),
    phone: text('phone'),
    notes: text('notes'),
    status: bookingStatusEnum('status').default('pending').notNull(),
    slotId: uuid('slot_id').unique().references(() => bookingSlots.id),
    ipHash: text('ip_hash').notNull(),
    ipAddress: text('ip_address'),
    countryCode: text('country_code'),
    country: text('country'),
    city: text('city'),
    region: text('region'),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    statusIdx: index('bookings_status_idx').on(table.status),
    createdAtIdx: index('bookings_created_at_idx').on(table.createdAt),
    countryCodeIdx: index('bookings_country_code_idx').on(table.countryCode),
  }));

  export const bookingSettings = pgTable('booking_settings', {
    id: uuid('id').primaryKey().defaultRandom(),
    notificationEmail: text('notification_email'),
    reminderEnabled: boolean('reminder_enabled').default(true).notNull(),
    reminderDay: integer('reminder_day').default(6).notNull(),
    reminderTime: text('reminder_time').default('09:00').notNull(),
    timezone: text('timezone').default('Asia/Jakarta').notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  });

  export const bookingAvailability = pgTable('booking_availability', {
    id: uuid('id').primaryKey().defaultRandom(),
    dayOfWeek: integer('day_of_week').notNull(),
    startTime: text('start_time').notNull(),
    endTime: text('end_time').notNull(),
    enabled: boolean('enabled').default(true).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    dayOfWeekStartTimeEndTimeKey: unique('booking_availability_day_of_week_start_time_end_time_key').on(table.dayOfWeek, table.startTime, table.endTime),
    dayOfWeekIdx: index('booking_availability_day_of_week_idx').on(table.dayOfWeek),
    enabledIdx: index('booking_availability_enabled_idx').on(table.enabled),
  }));

  // --------------------------------------------------------------------------
  // ABOUT ME & ACHIEVEMENT TABLES
  // --------------------------------------------------------------------------

  export const aboutMe = pgTable('about_me', {
    id: uuid('id').primaryKey().defaultRandom(),
    fullName: text('full_name').notNull(),
    tagline: text('tagline').notNull(),
    roles: text('roles').array().notNull().default([]),
    bio: text('bio').notNull(),
    email: text('email').notNull(),
    phone: text('phone'),
    location: text('location'),
    avatarUrl: text('avatar_url'),
    resumeUrl: text('resume_url'),
    availabilityStatus: text('availability_status'),
    skills: text('skills').array().notNull().default([]),
    experience: jsonb('experience'),
    socialLinks: jsonb('social_links'),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  });

  export const achievements = pgTable('achievements', {
    id: uuid('id').primaryKey().defaultRandom(),
    name: text('name').notNull(),
    location: text('location').notNull(),
    monthYear: text('month_year').notNull(),
    photos: text('photos').array().notNull().default([]),
    description: text('description').notNull(),
    externalUrl: text('external_url'),
    order: integer('order').default(0).notNull(),
    visible: boolean('visible').default(true).notNull(),
    createdAt: timestamp('created_at').defaultNow().notNull(),
    updatedAt: timestamp('updated_at').defaultNow().notNull(),
  }, (table) => ({
    orderIdx: index('achievements_order_idx').on(table.order),
    visibleIdx: index('achievements_visible_idx').on(table.visible),
  }));

# =============================================================================
# INDEX STRATEGY
# =============================================================================

indexes:
  description: |
    Indexes are designed to optimize common query patterns while balancing
    write performance. Composite indexes are used for frequently combined filters.

  strategy:
    primary_keys:
      - description: "All tables use CUID as primary key for distributed-friendly IDs"
        reason: "CUIDs are collision-resistant and sortable by creation time"

    unique_indexes:
      - table: User
        columns: [email]
        reason: "Email must be unique for authentication"
      - table: Project
        columns: [slug]
        reason: "URL-friendly unique identifier for routing"
      - table: BlogLink
        columns: [url]
        reason: "Prevent duplicate blog link entries"
      - table: ChatLog
        columns: [sessionId]
        reason: "Unique session identification"
      - table: KnowledgeDoc
        columns: [filename]
        reason: "Unique document identification"

    performance_indexes:
      User:
        - columns: [email]
          reason: "Fast lookup during authentication"
        - columns: [role]
          reason: "Filter users by permission level"
        - columns: [createdAt]
          reason: "Sort users by registration date"

      Project:
        - columns: [slug]
          reason: "Fast project lookup by URL slug"
        - columns: [category]
          reason: "Filter projects by category"
        - columns: [featured]
          reason: "Quick access to featured projects"
        - columns: [visible]
          reason: "Filter published projects"
        - columns: [order]
          reason: "Custom ordering of projects"
        - columns: [visible, featured, order]
          reason: "Composite index for homepage project listing"

      ProjectContext:
        - columns: [projectId]
          reason: "Fast retrieval of all contexts for a project"
        - columns: [type]
          reason: "Filter contexts by type"
        - columns: [projectId, type]
          reason: "Get specific context type for a project"
        - columns: [projectId, order]
          reason: "Ordered retrieval of project contexts"

      BlogLink:
        - columns: [visible, order]
          reason: "Efficient listing of visible blog links"
        - columns: [publishedAt]
          reason: "Sort by publication date"

      GuestbookEntry:
        - columns: [userId]
          reason: "Find all entries by a user"
        - columns: [visible, createdAt]
          reason: "List visible entries chronologically"

      AnonymousMessage:
        - columns: [ipHash]
          reason: "Rate limiting by IP"
        - columns: [read, createdAt]
          reason: "Admin inbox filtering"

      ChatLog:
        - columns: [sessionId]
          reason: "Session lookup"
        - columns: [updatedAt]
          reason: "Recent activity sorting"

      KnowledgeDoc:
        - columns: [indexed, updatedAt]
          reason: "Find documents needing re-indexing"

# =============================================================================
# MIGRATION STRATEGY
# =============================================================================

migration:
  approach: "Incremental migrations with drizzle-kit"
  
  initial_setup:
    steps:
      - step: 1
        action: "Configure DATABASE_URL in .env"
        example: |
          DATABASE_URL="postgresql://user:password@localhost:5432/portfolio"
          DIRECT_URL="postgresql://user:password@localhost:5432/portfolio"
          
      - step: 2
        action: "Create drizzle config"
        file: "apps/admin/drizzle.config.ts"
        example: |
          import { defineConfig } from 'drizzle-kit';
          export default defineConfig({
            schema: './db/schema.ts',
            out: './db/migrations',
            dialect: 'postgresql',
            dbCredentials: {
              url: process.env.DIRECT_URL!,
            },
          });
          
      - step: 3
        action: "Generate migration files"
        command: "pnpm --filter admin db:generate"
        
      - step: 4
        action: "Apply migrations to database"
        command: "pnpm --filter admin db:migrate"

  versioning:
    naming_convention: "NNNN_descriptive_name.sql (auto-numbered by drizzle-kit)"
    examples:
      - "0000_init.sql"
      - "0001_add_project_contexts.sql"
      - "0002_add_reactions_to_guestbook.sql"

  production_workflow:
    steps:
      - step: 1
        description: "Create migration in development"
        command: "pnpm --filter admin db:generate"
        
      - step: 2
        description: "Review generated SQL"
        location: "apps/admin/db/migrations/NNNN_name.sql"
        
      - step: 3
        description: "Test migration on staging"
        command: "pnpm --filter admin db:migrate"
        
      - step: 4
        description: "Deploy to production"
        command: "pnpm --filter admin db:migrate"

  rollback_strategy:
    description: |
      Drizzle doesn't support automatic rollbacks. For production:
      1. Always backup database before migrations
      2. Create reverse migration SQL scripts manually
      3. Test migrations thoroughly on staging
      4. Use database snapshots for critical migrations
      5. Apply reverse migrations with: psql $DATABASE_URL < reverse_migration.sql

  zero_downtime_considerations:
    - "Add new columns as nullable first"
    - "Create new indexes concurrently when possible"
    - "Use multi-phase migrations for breaking changes"
    - "Deploy code that handles both old and new schema"

