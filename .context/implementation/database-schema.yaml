# =============================================================================
# COMMON QUERY PATTERNS
# =============================================================================

query_patterns:
  description: |
    Common query patterns optimized for performance with proper indexing.
    All examples use Drizzle ORM syntax with postgres.js driver.

  user_queries:
    find_by_email:
      description: "Authenticate user by email"
      query: |
        import { db } from '@/db';
        import { users, guestbookEntries, eq, desc } from '@/db/schema';

        const user = await db.select()
          .from(users)
          .where(eq(users.email, 'user@example.com'))
          .limit(1);
        
        // With guestbook entries (separate query for relational data)
        const entries = await db.select()
          .from(guestbookEntries)
          .where(
            and(
              eq(guestbookEntries.userId, user[0].id),
              eq(guestbookEntries.visible, true)
            )
          )
          .orderBy(desc(guestbookEntries.createdAt))
          .limit(5);

    list_admin_users:
      description: "Get all admin users"
      query: |
        import { db } from '@/db';
        import { users, eq, asc } from '@/db/schema';

        const admins = await db.select()
          .from(users)
          .where(eq(users.role, 'admin'))
          .orderBy(asc(users.createdAt));

  project_queries:
    get_featured_projects:
      description: "Homepage featured projects"
      query: |
        import { db } from '@/db';
        import { projects, projectContexts, eq, and, asc } from '@/db/schema';

        const featuredProjects = await db.select()
          .from(projects)
          .where(
            and(
              eq(projects.visible, true),
              eq(projects.featured, true)
            )
          )
          .orderBy(asc(projects.order));
        
        // Get result contexts for each project
        const projectIds = featuredProjects.map(p => p.id);
        const resultContexts = await db.select()
          .from(projectContexts)
          .where(
            and(
              inArray(projectContexts.projectId, projectIds),
              eq(projectContexts.type, 'result')
            )
          )
          .limit(1);

    get_project_by_slug:
      description: "Full project page with all contexts"
      query: |
        import { db } from '@/db';
        import { projects, projectContexts, eq, asc } from '@/db/schema';

        const [project] = await db.select()
          .from(projects)
          .where(eq(projects.slug, 'project-slug'))
          .limit(1);
        
        if (project) {
          const contexts = await db.select()
            .from(projectContexts)
            .where(eq(projectContexts.projectId, project.id))
            .orderBy(asc(projectContexts.order));
        }

    list_projects_by_category:
      description: "Filter projects by category"
      query: |
        import { db } from '@/db';
        import { projects, eq, and, desc, asc } from '@/db/schema';

        const results = await db.select()
          .from(projects)
          .where(
            and(
              eq(projects.visible, true),
              eq(projects.category, 'Web Application')
            )
          )
          .orderBy(desc(projects.featured), asc(projects.order));

    search_projects:
      description: "Full-text search on projects"
      query: |
        import { db } from '@/db';
        import { projects, eq, or, ilike, arrayContains, asc } from '@/db/schema';

        const searchTerm = 'react';
        const results = await db.select()
          .from(projects)
          .where(
            and(
              eq(projects.visible, true),
              or(
                ilike(projects.title, `%${searchTerm}%`),
                ilike(projects.summary, `%${searchTerm}%`),
                ilike(projects.description, `%${searchTerm}%`),
                arrayContains(projects.techStack, [searchTerm])
              )
            )
          )
          .orderBy(asc(projects.order));

  blog_queries:
    get_visible_posts:
      description: "List all visible blog links"
      query: |
        import { db } from '@/db';
        import { blogLinks, eq, asc, desc } from '@/db/schema';

        const posts = await db.select()
          .from(blogLinks)
          .where(eq(blogLinks.visible, true))
          .orderBy(asc(blogLinks.order), desc(blogLinks.publishedAt));

    get_posts_by_source:
      description: "Filter blog links by platform"
      query: |
        import { db } from '@/db';
        import { blogLinks, eq, and, desc } from '@/db/schema';

        const mediumPosts = await db.select()
          .from(blogLinks)
          .where(
            and(
              eq(blogLinks.visible, true),
              eq(blogLinks.source, 'medium')
            )
          )
          .orderBy(desc(blogLinks.publishedAt));

  guestbook_queries:
    get_recent_entries:
      description: "Paginated guestbook entries"
      query: |
        import { db } from '@/db';
        import { guestbookEntries, users, eq, desc } from '@/db/schema';

        const page = 0;
        const entries = await db.select({
          id: guestbookEntries.id,
          message: guestbookEntries.message,
          reactions: guestbookEntries.reactions,
          createdAt: guestbookEntries.createdAt,
          user: {
            id: users.id,
            name: users.name,
            image: users.image,
          },
        })
        .from(guestbookEntries)
        .leftJoin(users, eq(guestbookEntries.userId, users.id))
        .where(eq(guestbookEntries.visible, true))
        .orderBy(desc(guestbookEntries.createdAt))
        .limit(20)
        .offset(page * 20);

    add_reaction:
      description: "Add reaction to guestbook entry"
      query: |
        import { db } from '@/db';
        import { guestbookEntries, eq } from '@/db/schema';
        import { sql } from 'drizzle-orm';

        // Using raw SQL for JSON manipulation
        const updated = await db.execute(
          sql`UPDATE guestbook_entries
              SET reactions = jsonb_set(
                COALESCE(reactions, '[]'::jsonb),
                '{reactions}',
                (COALESCE(reactions->'reactions', '[]'::jsonb) || ${JSON.stringify({ emoji, userId })}::jsonb)
              )
              WHERE id = ${entryId}`
        );

  anonymous_message_queries:
    get_unread_messages:
      description: "Admin inbox - unread messages"
      query: |
        import { db } from '@/db';
        import { anonymousMessages, eq, desc } from '@/db/schema';

        const unreadMessages = await db.select()
          .from(anonymousMessages)
          .where(eq(anonymousMessages.read, false))
          .orderBy(desc(anonymousMessages.createdAt));

    mark_as_read:
      description: "Mark message as read"
      query: |
        import { db } from '@/db';
        import { anonymousMessages, eq } from '@/db/schema';

        const [message] = await db.update(anonymousMessages)
          .set({ read: true })
          .where(eq(anonymousMessages.id, messageId))
          .returning();

    rate_limit_check:
      description: "Check rate limit by IP hash"
      query: |
        import { db } from '@/db';
        import { anonymousMessages, eq, gte, count } from '@/db/schema';
        import { sql } from 'drizzle-orm';

        const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
        const [result] = await db.select({ count: count() })
          .from(anonymousMessages)
          .where(
            and(
              eq(anonymousMessages.ipHash, hashedIp),
              gte(anonymousMessages.createdAt, oneHourAgo)
            )
          );

  chat_queries:
    get_or_create_session:
      description: "Get existing or create new chat session"
      query: |
        import { db } from '@/db';
        import { chatLogs, eq } from '@/db/schema';

        let [chatLog] = await db.select()
          .from(chatLogs)
          .where(eq(chatLogs.sessionId, sessionId))
          .limit(1);

        if (!chatLog) {
          [chatLog] = await db.insert(chatLogs)
            .values({ sessionId, messages: [] })
            .returning();
        }

    append_message:
      description: "Add message to chat log"
      query: |
        import { db } from '@/db';
        import { chatLogs, eq } from '@/db/schema';
        import { sql } from 'drizzle-orm';

        // Using raw SQL for JSON array append
        const [updated] = await db.execute(
          sql`UPDATE chat_logs
              SET messages = messages || ${JSON.stringify(newMessage)}::jsonb,
                  updated_at = NOW()
              WHERE session_id = ${sessionId}
              RETURNING *`
        );

    cleanup_old_sessions:
      description: "Remove sessions older than 30 days"
      query: |
        import { db } from '@/db';
        import { chatLogs, lt } from '@/db/schema';

        const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
        const deleted = await db.delete(chatLogs)
          .where(lt(chatLogs.updatedAt, thirtyDaysAgo));

  knowledge_queries:
    get_unindexed_docs:
      description: "Find documents needing indexing"
      query: |
        import { db } from '@/db';
        import { knowledgeDocs, eq, asc } from '@/db/schema';

        const unindexedDocs = await db.select()
          .from(knowledgeDocs)
          .where(eq(knowledgeDocs.indexed, false))
          .orderBy(asc(knowledgeDocs.createdAt));

    mark_as_indexed:
      description: "Update document indexed status"
      query: |
        import { db } from '@/db';
        import { knowledgeDocs, eq } from '@/db/schema';

        const [doc] = await db.update(knowledgeDocs)
          .set({ indexed: true })
          .where(eq(knowledgeDocs.id, docId))
          .returning();

    search_knowledge:
      description: "Search knowledge base content"
      query: |
        import { db } from '@/db';
        import { knowledgeDocs, ilike } from '@/db/schema';

        const results = await db.select()
          .from(knowledgeDocs)
          .where(ilike(knowledgeDocs.content, `%${searchTerm}%`));

# =============================================================================
# PERFORMANCE CONSIDERATIONS
# =============================================================================

performance:
  connection_pooling:
    description: "Configure connection pool for production"
    config: |
      // apps/admin/db/index.ts
      import { drizzle } from 'drizzle-orm/postgres-js';
      import postgres from 'postgres';
      import * as schema from './schema';

      const client = postgres(process.env.DATABASE_URL!, {
        max: 10, // Connection pool size
        idle_timeout: 20,
        connect_timeout: 10,
      });

      export const db = drizzle(client, { 
        schema,
        logger: process.env.NODE_ENV === 'development',
      });

  query_optimization:
    tips:
      - "Use `.select()` with specific columns to fetch only needed fields"
      - "Avoid N+1 queries; use joins or batch queries for relations"
      - "Implement offset/limit pagination for large datasets (or cursor-based for better performance)"
      - "Use raw SQL queries (`db.execute(sql`...`)`) for complex aggregations"
      - "Cache frequently accessed, rarely changed data (profile links, etc.)"
      - "Use prepared statements for repeated queries"
      - "Index foreign keys and frequently queried columns"

  caching_strategy:
    static_content:
      - "Profile links: Cache for 1 hour"
      - "Featured projects: Cache for 15 minutes"
      - "Blog links: Cache for 30 minutes"
    
    dynamic_content:
      - "Guestbook: No caching or short TTL (1 minute)"
      - "Anonymous messages: No caching"
      - "Chat logs: No caching"

# =============================================================================
# BACKUP AND RECOVERY
# =============================================================================

backup:
  strategy: "Automated daily backups with point-in-time recovery"
  
  tools:
    - name: "pg_dump"
      usage: "pg_dump -Fc portfolio > backup_$(date +%Y%m%d).dump"
      
    - name: "Drizzle ORM"
      usage: "For data export, use Drizzle to query and export to JSON"

  retention:
    daily: "7 days"
    weekly: "4 weeks"
    monthly: "12 months"

# =============================================================================
# SECURITY CONSIDERATIONS
# =============================================================================

security:
  data_protection:
    - "Hash IP addresses before storing (AnonymousMessage.ipHash)"
    - "Never store raw passwords; use OAuth providers"
    - "Sanitize all user inputs before database insertion"
    - "Use parameterized queries (Drizzle handles this automatically)"

  access_control:
    - "Implement row-level security where needed"
    - "Use UserRole enum for permission checks"
    - "Validate user ownership before updates/deletes"

  audit_logging:
    recommendation: |
      Consider adding an AuditLog table for sensitive operations:
      - User role changes
      - Content visibility changes
      - Bulk deletions
