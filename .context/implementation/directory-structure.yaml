      │
      ├── astro.config.mjs                      # Astro config (Node adapter)
      ├── tsconfig.json
      └── package.json

  # ---------------------------------------------------------------------------
  # apps/ngl - Anonymous Feedback
  # ---------------------------------------------------------------------------
  ngl:
    description: Anonymous feedback/questions app (like NGL)
    architecture: SvelteKit (see sveltekit_app pattern)
    port: 3003
    key_features:
      - Anonymous question submission
      - Question display
      - Spam filtering
      - Write-only API consumer (Admin API)

    tree: |
      apps/ngl/
      ├── src/
      │   ├── routes/
      │   │   ├── +page.svelte                  # Submit question form
      │   │   ├── +page.server.ts               # Form action for submissions
      │   │   ├── inbox/
      │   │   │   ├── +page.svelte              # View questions (protected)
      │   │   │   ├── +page.server.ts           # Load questions data
      │   │   │   └── +layout.server.ts        # Auth guard
      │   │   └── +layout.svelte                # Root layout
      │   │
      │   ├── lib/
      │   │   ├── server/                       # Server-only code
      │   │   │   ├── api.ts                    # Admin API client
      │   │   │   └── spam-check.ts             # Spam detection
      │   │   └── components/
