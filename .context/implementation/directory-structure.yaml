      │   │   ├── __init__.py
      │   │   ├── rag_service.py                # RAG orchestration
      │   │   ├── embedding_service.py          # OpenAI embeddings
      │   │   ├── vector_store_service.py       # pgvector operations
      │   │   ├── llm_service.py                # LLM interactions
