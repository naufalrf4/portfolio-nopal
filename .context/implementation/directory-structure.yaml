  # apps/rag-service - RAG Chatbot Service
  # ---------------------------------------------------------------------------
  rag_service:
    description: |
      Node.js/Fastify service for RAG-based AI chatbot.
      Handles document ingestion, vector storage, and query processing.

    tree: |
      apps/rag-service/
      ├── src/
      │   ├── server.ts                         # Fastify server entry
      │   ├── app.ts                            # App configuration
      │   │
