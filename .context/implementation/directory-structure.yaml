# =============================================================================
# SHARED PACKAGES STRUCTURE
# =============================================================================

packages:
  # ---------------------------------------------------------------------------
  # packages/ui - Shared UI Components
  # ---------------------------------------------------------------------------
  ui:
    description: |
      Shared UI component library used across all Next.js apps.
      Built with React, Tailwind CSS, and optionally Radix UI primitives.

    tree: |
      packages/ui/
      ├── src/
      │   ├── components/                       # UI components
      │   │   ├── button/
      │   │   │   ├── Button.tsx
      │   │   │   ├── Button.stories.tsx        # Storybook stories
      │   │   │   ├── Button.test.tsx           # Tests
      │   │   │   ├── button.styles.ts          # Variant styles
      │   │   │   └── index.ts
      │   │   │
      │   │   ├── card/
      │   │   │   ├── Card.tsx
      │   │   │   ├── CardHeader.tsx
      │   │   │   ├── CardContent.tsx
      │   │   │   ├── CardFooter.tsx
      │   │   │   └── index.ts
      │   │   │
      │   │   ├── input/
      │   │   │   ├── Input.tsx
      │   │   │   ├── TextArea.tsx
      │   │   │   └── index.ts
      │   │   │
      │   │   ├── badge/
      │   │   ├── avatar/
      │   │   ├── skeleton/
      │   │   ├── spinner/
      │   │   ├── tooltip/
      │   │   └── ... (other components)
      │   │
      │   ├── hooks/                            # Shared hooks
      │   │   ├── useMediaQuery.ts
      │   │   └── index.ts
      │   │
      │   ├── utils/                            # Utility functions
      │   │   ├── cn.ts                         # classnames helper
      │   │   └── index.ts
      │   │
      │   └── index.ts                          # Main barrel export
      │
      ├── tailwind.config.ts                    # Tailwind preset
      ├── tsconfig.json
      ├── package.json
      └── README.md

    exports:
      pattern: "@repo/ui"
      examples:
        - "import { Button, Card, Input } from '@repo/ui'"
        - "import { cn } from '@repo/ui/utils'"

  # ---------------------------------------------------------------------------
  # packages/types - Shared TypeScript Types
  # ---------------------------------------------------------------------------
  types:
    description: |
      Shared TypeScript type definitions used across all packages and apps.
      Contains entity types, API types, and utility types.

    tree: |
      packages/types/
      ├── src/
      │   ├── entities/                         # Domain entity types
      │   │   ├── project.ts
      │   │   ├── article.ts
      │   │   ├── link.ts
      │   │   ├── feedback.ts
      │   │   ├── user.ts
      │   │   └── index.ts
      │   │
      │   ├── api/                              # API-related types
      │   │   ├── requests.ts                   # Request types
      │   │   ├── responses.ts                  # Response types
      │   │   ├── errors.ts                     # Error types
      │   │   └── index.ts
      │   │
      │   ├── common/                           # Common utility types
      │   │   ├── pagination.ts
      │   │   ├── filters.ts
      │   │   ├── sorting.ts
      │   │   └── index.ts
      │   │
      │   ├── rag/                              # RAG-specific types
      │   │   ├── document.ts
      │   │   ├── query.ts
      │   │   ├── conversation.ts
      │   │   └── index.ts
      │   │
      │   └── index.ts                          # Main barrel export
      │
      ├── tsconfig.json
      └── package.json

    exports:
      pattern: "@repo/types"
      examples:
        - "import type { Project, Article } from '@repo/types'"
        - "import type { ApiResponse, PaginatedResponse } from '@repo/types/api'"

  # ---------------------------------------------------------------------------
  # packages/sdk - API Clients
  # ---------------------------------------------------------------------------
  sdk:
    description: |
      Type-safe API clients for interacting with backend services.
      Provides a consistent interface for all apps to communicate with APIs.

    tree: |
      packages/sdk/
      ├── src/
      │   ├── clients/                          # API clients
      │   │   ├── admin/                        # Admin API client
      │   │   │   ├── AdminClient.ts
      │   │   │   ├── projects.ts
      │   │   │   ├── articles.ts
      │   │   │   ├── links.ts
      │   │   │   ├── feedback.ts
      │   │   │   └── index.ts
      │   │   │
      │   │   ├── rag/                          # RAG service client
      │   │   │   ├── RagClient.ts
      │   │   │   ├── query.ts
      │   │   │   ├── documents.ts
      │   │   │   └── index.ts
      │   │   │
      │   │   └── index.ts
      │   │
      │   ├── core/                             # Core client utilities
      │   │   ├── BaseClient.ts                 # Base HTTP client
      │   │   ├── interceptors.ts               # Request/response interceptors
      │   │   ├── errors.ts                     # Error handling
      │   │   └── index.ts
      │   │
      │   ├── types/                            # SDK-specific types
      │   │   ├── config.ts
      │   │   └── index.ts
      │   │
      │   └── index.ts
      │
      ├── tsconfig.json
      └── package.json

    exports:
      pattern: "@repo/sdk"
      examples:
        - "import { AdminClient, RagClient } from '@repo/sdk'"
        - "import { createAdminClient } from '@repo/sdk/admin'"

  # ---------------------------------------------------------------------------
  # packages/config - Shared Configurations
  # ---------------------------------------------------------------------------
  config:
    description: |
      Shared configuration files and presets for build tools, linting, etc.
      Provides consistent tooling configuration across all packages.

    tree: |
      packages/config/
      ├── eslint/
      │   ├── base.js                           # Base ESLint config
      │   ├── next.js                           # Next.js ESLint config
      │   ├── react.js                          # React ESLint config
      │   ├── node.js                           # Node.js ESLint config
      │   └── index.js
      │
      ├── typescript/
      │   ├── base.json                         # Base TS config
      │   ├── nextjs.json                       # Next.js TS config
      │   ├── node.json                         # Node.js TS config
      │   ├── react-library.json                # React library TS config
      │   └── index.js
      │
      ├── tailwind/
      │   ├── base.config.ts                    # Base Tailwind config
      │   ├── preset.ts                         # Shared Tailwind preset
      │   └── index.ts
      │
      ├── prettier/
      │   └── index.js                          # Prettier config
      │
      ├── jest/
      │   ├── base.config.js                    # Base Jest config
      │   └── index.js
      │
      └── package.json

    exports:
      pattern: "@repo/config/*"
      examples:
        - "extends: ['@repo/config/eslint/next']"
        - "extends: '@repo/config/typescript/nextjs.json'"

  # ---------------------------------------------------------------------------
  # packages/auth - NextAuth Configuration
  # ---------------------------------------------------------------------------
  auth:
    description: |
      Shared NextAuth.js v5 configuration and utilities.
      Used ONLY by apps/admin (Next.js App Router).
      
      Note: apps/public uses Lucia Auth v3 separately with Google OAuth via arctic.
      This package is NOT used by apps/public, apps/links, apps/ngl, or apps/rag-service.

    tree: |
      packages/auth/
      ├── src/
      │   ├── config/
      │   │   ├── auth.config.ts                # NextAuth configuration
      │   │   ├── providers.ts                  # Auth providers setup
      │   │   └── index.ts
      │   │
      │   ├── adapters/
      │   │   ├── drizzle.ts                    # Drizzle adapter
      │   │   └── index.ts
      │   │
      │   ├── callbacks/
      │   │   ├── jwt.ts                        # JWT callback
      │   │   ├── session.ts                    # Session callback
      │   │   └── index.ts
      │   │
      │   ├── utils/
      │   │   ├── getSession.ts                 # Get session utilities
      │   │   ├── requireAuth.ts                # Auth guards
      │   │   └── index.ts
      │   │
      │   ├── types/
      │   │   ├── next-auth.d.ts                # NextAuth type augmentation
      │   │   └── index.ts
      │   │
      │   └── index.ts
      │
      ├── tsconfig.json
      └── package.json

    exports:
      pattern: "@repo/auth"
      examples:
        - "import { authConfig } from '@repo/auth'"
        - "import { getServerSession, requireAuth } from '@repo/auth'"

# =============================================================================
# OTHER APPS STRUCTURE
# =============================================================================

other_apps:
  # ---------------------------------------------------------------------------
  # apps/links - Links Hub
  # ---------------------------------------------------------------------------
  links:
    description: Link-in-bio style links hub (like Linktree)
    architecture: Astro SSR (see astro_app pattern)
    port: 3002
    key_features:
      - Public links page
      - Click tracking
      - Custom themes
      - Read-only API consumer (Admin API)

    tree: |
      apps/links/
      ├── src/
      │   ├── pages/
      │   │   ├── index.astro                   # Main links page
      │   │   ├── [slug].astro                  # Custom slug pages
      │   │   └── api/
      │   │       └── click.ts                  # Track clicks API endpoint
      │   │
      │   ├── layouts/
      │   │   └── BaseLayout.astro              # Base HTML layout
      │   │
      │   ├── components/
      │   │   ├── LinksList.astro               # Server-rendered links
      │   │   ├── LinkButton.astro              # Individual link button
      │   │   ├── SocialLinks.astro             # Social media icons
      │   │   ├── ProfileHeader.astro           # Profile section
      │   │   └── ClickTracker.tsx              # React island for analytics
      │   │
      │   ├── features/
      │   │   └── links/
      │   │       ├── services/
