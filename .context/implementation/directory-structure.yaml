      │   │   ├── index.ts                      # Route registration
      │   │   ├── health.route.ts               # Health check
      │   │   ├── query.route.ts                # Query endpoint
      │   │   ├── documents.route.ts            # Document management
      │   │   └── conversations.route.ts        # Conversation history
      │   │
      │   ├── services/                         # Business logic
