# =============================================================================
# DIRECTORY STRUCTURE SPECIFICATION
# naufalrf-portfolio pnpm Workspaces Monorepo
# =============================================================================
#
# This document defines the canonical directory structure, naming conventions,
# and architectural patterns for the monorepo. All new code must conform to
# these specifications.
#
# Architecture: Feature-Based Modular Architecture
# Pattern: Vertical Slice + Shared Horizontal Layers
# =============================================================================

version: "1.0.0"
last_updated: "2025-01-10"

# =============================================================================
# ROOT MONOREPO STRUCTURE
# =============================================================================

root:
  description: |
    The monorepo root contains configuration files, tooling setup, and
    workspace definitions. All apps and packages are organized under their
    respective directories.

  structure:
    # -------------------------------------------------------------------------
    # Configuration Files
    # -------------------------------------------------------------------------
    configuration:
      - file: package.json
        purpose: Root package.json with workspace definitions

        required: true

      - file: pnpm-workspace.yaml
        purpose: PNPM workspace configuration
        required: true

      - file: tsconfig.json
        purpose: Base TypeScript configuration (extended by packages)
        required: true

      - file: .eslintrc.js
        purpose: Root ESLint configuration
        required: true

      - file: .prettierrc
        purpose: Prettier formatting rules
        required: true

      - file: .gitignore
        purpose: Git ignore patterns
        required: true

      - file: .npmrc
        purpose: NPM/PNPM configuration
        required: true

    # -------------------------------------------------------------------------
    # Docker & Infrastructure
    # -------------------------------------------------------------------------
    infrastructure:
      - file: docker-compose.yml
        purpose: Development environment orchestration
        required: true

      - file: docker-compose.prod.yml
        purpose: Production deployment configuration
        required: false

      - file: Dockerfile.base
        purpose: Base image for all services
        required: false

      - directory: .docker/
        purpose: Docker-related configurations and scripts
        contents:
          - nginx/
          - postgres/
          - redis/

    # -------------------------------------------------------------------------
    # CI/CD & Tooling
    # -------------------------------------------------------------------------
    tooling:
      - directory: .github/
        purpose: GitHub Actions workflows and templates
        contents:
          - workflows/
          - ISSUE_TEMPLATE/
          - PULL_REQUEST_TEMPLATE.md

      - directory: .husky/
        purpose: Git hooks (pre-commit, commit-msg, etc.)
        required: true

      - directory: scripts/
        purpose: Build, deployment, and utility scripts
        contents:
          - build.sh
          - deploy.sh
          - seed-db.ts
          - generate-types.ts

    # -------------------------------------------------------------------------
    # Documentation & Context
    # -------------------------------------------------------------------------
    documentation:
      - directory: .context/
        purpose: AI assistant context and project documentation
        contents:
          - base/
          - implementation/
          - decisions/

      - file: README.md
        purpose: Project overview and setup instructions
        required: true

  # Tree visualization
  tree: |
    /
    ├── apps/                          # Application packages
    │   ├── public/                    # Portfolio website
    │   ├── admin/                     # Admin dashboard + API
    │   ├── links/                     # Links hub
    │   ├── ngl/                       # Anonymous feedback
    │   └── rag-service/               # RAG chatbot service
    │
    ├── packages/                      # Shared packages
    │   ├── ui/                        # Shared UI components
    │   ├── types/                     # Shared TypeScript types
    │   ├── sdk/                       # API clients
    │   ├── config/                    # Shared configurations
    │   └── auth/                      # NextAuth configuration
    │
    ├── .context/                      # AI context files
    │   ├── base/
    │   ├── implementation/
    │   └── decisions/
    │
    ├── .docker/                       # Docker configurations
    ├── .github/                       # GitHub workflows
    ├── .husky/                        # Git hooks
    ├── scripts/                       # Build/deploy scripts
    │
    ├── package.json                   # Root package.json
    ├── tsconfig.json                  # Base TS config
    ├── docker-compose.yml             # Dev environment
    └── README.md

# =============================================================================
# NEXT.JS APP ARCHITECTURE
# =============================================================================

nextjs_app:
  description: |
    All Next.js applications follow a feature-based architecture pattern.
    Features are self-contained modules that encapsulate related functionality.
    Shared code lives in horizontal layers (components/ui, lib, etc.).

  # ---------------------------------------------------------------------------
  # App Router Structure (Next.js 14+)
  # ---------------------------------------------------------------------------
  app_router:
    description: |
      The app/ directory follows Next.js App Router conventions.
      Route groups, layouts, and special files are organized logically.

    structure:
      - directory: app/
        purpose: Next.js App Router root
        contents:
          # Route Groups
          - directory: (public)/
            purpose: Public-facing routes (no auth required)
            note: Parentheses create route group without URL segment

          - directory: (auth)/
            purpose: Authentication routes (login, register, etc.)

          - directory: (dashboard)/
            purpose: Authenticated dashboard routes

          # API Routes
          - directory: api/
            purpose: API route handlers
            pattern: "api/[resource]/route.ts"

          # Special Files
          - file: layout.tsx
            purpose: Root layout component

          - file: page.tsx
            purpose: Root page component

          - file: loading.tsx
            purpose: Loading UI for Suspense boundaries

          - file: error.tsx
            purpose: Error boundary component

          - file: not-found.tsx
            purpose: 404 page component

          - file: globals.css
            purpose: Global styles (imported in root layout)

  # ---------------------------------------------------------------------------
  # Feature-Based Architecture
  # ---------------------------------------------------------------------------
  features:
    description: |
      Features are self-contained modules organized by business domain.
      Each feature encapsulates its own components, hooks, services, and types.
      Features should be independent and loosely coupled.

    location: src/features/

    structure:
      feature_module:
        description: A single feature module structure
        contents:
          - directory: components/
            purpose: Feature-specific React components
            files:
              - pattern: "{ComponentName}.tsx"
                example: "ProjectCard.tsx"
              - pattern: "{ComponentName}.test.tsx"
                example: "ProjectCard.test.tsx"
              - pattern: index.ts
                purpose: Barrel export for components

          - directory: hooks/
            purpose: Feature-specific custom hooks
            files:
              - pattern: "use{HookName}.ts"
                example: "useProjects.ts"
              - pattern: "use{HookName}.test.ts"
                example: "useProjects.test.ts"
              - pattern: index.ts
                purpose: Barrel export for hooks

          - directory: services/
            purpose: Feature-specific API calls and business logic
            files:
              - pattern: "{serviceName}.service.ts"
                example: "projects.service.ts"
              - pattern: "{serviceName}.service.test.ts"
                example: "projects.service.test.ts"
              - pattern: index.ts
                purpose: Barrel export for services

          - directory: types/
            purpose: Feature-specific TypeScript types
            files:
              - pattern: "{typeName}.types.ts"
                example: "project.types.ts"
              - pattern: index.ts
                purpose: Barrel export for types

          - directory: utils/
            purpose: Feature-specific utility functions
            files:
              - pattern: "{utilName}.util.ts"
                example: "projectSlug.util.ts"
              - pattern: index.ts
                purpose: Barrel export for utils

          - directory: stores/
            purpose: Feature-specific state management (optional)
            files:
              - pattern: "{storeName}.store.ts"
                example: "projectFilters.store.ts"
              - pattern: index.ts
                purpose: Barrel export for stores

          - file: index.ts
            purpose: Feature barrel export (public API)
            note: Only export what should be used outside the feature

    examples:
      - name: projects
        description: Project showcase feature
        exports:
          - ProjectGrid
          - ProjectCard
          - useProjects
          - useProjectDetail
          - projectsService

      - name: blog
        description: Blog/articles feature
        exports:
          - ArticleList
          - ArticleCard
          - ArticleContent
          - useBlogPosts
          - blogService

      - name: contact
        description: Contact form feature
        exports:
          - ContactForm
          - useContactForm
          - contactService

  # ---------------------------------------------------------------------------
  # Shared App-Level Directories
  # ---------------------------------------------------------------------------
  shared:
    description: |
      Shared directories contain code that is used across multiple features
      within the same application. This is the horizontal layer of the architecture.

    directories:
      - directory: src/components/
        purpose: Shared components within the app
        subdirectories:
          - directory: ui/
            purpose: Base UI components (often wrapping @repo/ui)
            examples:
              - Button.tsx
              - Input.tsx
              - Card.tsx
              - Modal.tsx

          - directory: layout/
            purpose: Layout components
            examples:
              - Header.tsx
              - Footer.tsx
              - Sidebar.tsx
              - Container.tsx

          - directory: common/
            purpose: Common composite components
            examples:
              - SEOHead.tsx
              - LoadingSpinner.tsx
              - ErrorBoundary.tsx

      - directory: src/lib/
        purpose: Shared utilities and configurations
        subdirectories:
          - directory: utils/
            purpose: Utility functions
            examples:
              - cn.ts          # classnames helper
              - format.ts      # formatters
              - validation.ts  # validation helpers

          - directory: constants/
            purpose: Application constants
            examples:
              - routes.ts
              - config.ts
              - seo.ts

          - directory: api/
            purpose: API client configuration
            examples:
              - client.ts
              - interceptors.ts

      - directory: src/styles/
        purpose: Styling files
        files:
          - globals.css
          - variables.css
          - animations.css
          - typography.css

      - directory: src/hooks/
        purpose: Shared custom hooks (app-wide)
        examples:
          - useMediaQuery.ts
          - useLocalStorage.ts
          - useDebounce.ts

      - directory: src/providers/
        purpose: React context providers
        examples:
          - ThemeProvider.tsx
          - QueryProvider.tsx
          - AuthProvider.tsx

      - directory: src/types/
        purpose: Shared app-level types
        files:
          - global.d.ts
          - env.d.ts

# =============================================================================
# ASTRO SSR APP ARCHITECTURE
# =============================================================================

astro_app:
  description: |
    Astro SSR applications combine file-based routing with component-based architecture.
    .astro files are server-rendered by default (zero JS). React islands add interactivity
    only where needed. Features follow the same modular pattern as Next.js apps.

  # ---------------------------------------------------------------------------
  # Pages Structure (File-Based Routing)
  # ---------------------------------------------------------------------------
  pages:
    description: |
      File-based routing in src/pages/. Each file becomes a route.
      .astro files are server-rendered. API routes live in src/pages/api/.

    structure:
      - directory: src/pages/
        purpose: File-based routes
        files:
          - pattern: "index.astro"
            purpose: Homepage
          - pattern: "about.astro"
            purpose: About page
          - pattern: "[slug].astro"
            purpose: Dynamic route
          - pattern: "api/[resource].ts"
            purpose: API endpoint

  # ---------------------------------------------------------------------------
  # Layouts & Components
  # ---------------------------------------------------------------------------
  layouts:
    description: |
      Layouts wrap pages. Defined in src/layouts/.
      Can include slots for flexible composition.

    location: src/layouts/
    examples:
      - BaseLayout.astro
      - BlogLayout.astro

  components:
    description: |
      .astro components are server-rendered (no JS by default).
      React/.tsx components are islands - wrap with client:* directives.

    locations:
      - src/components/        # Astro components
      - src/features/*/components/  # Feature components

    client_directives:
      - client:load            # Hydrate immediately
      - client:visible         # Hydrate when visible
      - client:idle            # Hydrate when browser idle
      - client:only            # Only client-side (no SSR)

  # ---------------------------------------------------------------------------
  # Middleware & Auth
  # ---------------------------------------------------------------------------
  middleware:
    description: |
      Middleware runs on every request. Defined in src/middleware.ts.
      Used for auth checks, redirects, logging.

    location: src/middleware.ts
    use_cases:
      - Lucia Auth session validation
      - Protected route checks
      - Request logging

  # ---------------------------------------------------------------------------
  # Shared Directories (Same as Next.js)
  # ---------------------------------------------------------------------------
  shared:
    description: |
      Same feature-based architecture as Next.js.
      Features in src/features/, shared code in src/lib/, src/hooks/, etc.

    directories:
      - src/features/          # Feature modules
      - src/components/        # Shared components
      - src/lib/               # Utilities
      - src/hooks/             # Shared hooks (for React islands)
      - src/styles/            # Global styles
      - src/types/             # Shared types

# =============================================================================
# SVELTEKIT APP ARCHITECTURE
# =============================================================================

sveltekit_app:
  description: |
    SvelteKit uses file-based routing with special files like +page.svelte,
    +page.server.ts, +layout.svelte. Server and client code are clearly separated.
    Features follow modular patterns with Svelte components.

  # ---------------------------------------------------------------------------
  # Routes Structure (File-Based)
  # ---------------------------------------------------------------------------
  routes:
    description: |
      File-based routing in src/routes/. Special files:
      - +page.svelte: Page component
      - +page.server.ts: Server-side load functions and form actions
      - +layout.svelte: Layout component
      - +layout.server.ts: Layout server logic
      - +server.ts: API endpoint

    structure:
      - directory: src/routes/
        purpose: File-based routes
        files:
          - pattern: "+page.svelte"
            purpose: Page component
          - pattern: "+page.server.ts"
            purpose: Server load function + form actions
          - pattern: "+layout.svelte"
            purpose: Layout component
          - pattern: "+layout.server.ts"
            purpose: Layout server logic
          - pattern: "+server.ts"
            purpose: API endpoint
          - pattern: "+error.svelte"
            purpose: Error boundary

  # ---------------------------------------------------------------------------
  # Load Functions & Form Actions
  # ---------------------------------------------------------------------------
  server_logic:
    description: |
      Server-side logic in +page.server.ts and +layout.server.ts.
      Load functions fetch data. Form actions handle POST requests.

    load_function:
      pattern: "export const load: PageServerLoad = async ({ params }) => { ... }"
      purpose: Fetch data for page (runs on server)

    form_actions:
      pattern: "export const actions: Actions = { default: async ({ request }) => { ... } }"
      purpose: Handle form submissions (progressive enhancement)

  # ---------------------------------------------------------------------------
  # Components & Stores
  # ---------------------------------------------------------------------------
  components:
    description: |
      Svelte components (.svelte files) in src/lib/components/.
      Feature components in src/features/*/components/.

    locations:
      - src/lib/components/    # Shared Svelte components
      - src/features/*/components/  # Feature components

  stores:
    description: |
      Svelte stores for client-side state management.
      Located in src/lib/stores/ or src/features/*/stores/.

    location: src/lib/stores/
    examples:
      - writable stores
      - derived stores
      - custom stores

  # ---------------------------------------------------------------------------
  # Shared Directories
  # ---------------------------------------------------------------------------
  shared:
    description: |
      Feature-based architecture adapted for SvelteKit.

    directories:
      - src/routes/            # Routes (file-based)
      - src/lib/               # Shared library code
      - src/lib/components/    # Shared components
      - src/lib/server/        # Server-only utilities
      - src/lib/stores/        # Client stores
      - src/features/          # Feature modules

# =============================================================================
# PYTHON FASTAPI SERVICE ARCHITECTURE
# =============================================================================

python_fastapi_service:
  description: |
    Python FastAPI service for RAG chatbot. Uses FastAPI framework with
    async/await, Pydantic models, and modular router architecture.
    Vector operations use pgvector extension in PostgreSQL.

  # ---------------------------------------------------------------------------
  # Project Structure
  # ---------------------------------------------------------------------------
  structure:
    description: |
      Standard Python package structure with src/ layout.
      Uses pyproject.toml for dependencies (managed by uv).

    root_files:
      - pyproject.toml         # Python project metadata + dependencies
      - .python-version        # Python version (3.12)
      - README.md

  # ---------------------------------------------------------------------------
  # Application Entry & Config
  # ---------------------------------------------------------------------------
  app_entry:
    location: src/main.py
    description: FastAPI app initialization and lifespan management
    pattern: |
      from fastapi import FastAPI
      from contextlib import asynccontextmanager

      @asynccontextmanager
      async def lifespan(app: FastAPI):
          # startup logic
          yield
          # shutdown logic

      app = FastAPI(lifespan=lifespan)

  config:
    location: src/config.py
    description: Environment variables and settings (using pydantic-settings)
    pattern: |
      from pydantic_settings import BaseSettings

      class Settings(BaseSettings):
          openai_api_key: str
          database_url: str

  # ---------------------------------------------------------------------------
  # Routers (API Endpoints)
  # ---------------------------------------------------------------------------
  routers:
    description: |
      API route handlers organized by domain.
      Each router is a separate module in src/routers/.

    location: src/routers/
    pattern: |
      from fastapi import APIRouter

      router = APIRouter(prefix="/chat", tags=["chat"])

      @router.post("/")
      async def chat_endpoint(request: ChatRequest) -> ChatResponse:
          ...

    examples:
      - chat.py                # Chat endpoint
      - documents.py           # Document management
      - health.py              # Health check

  # ---------------------------------------------------------------------------
  # Services (Business Logic)
  # ---------------------------------------------------------------------------
  services:
    description: |
      Business logic and orchestration.
      Located in src/services/.

    location: src/services/
    examples:
      - rag.py                 # RAG pipeline orchestration
      - embeddings.py          # Embedding generation (OpenAI)
      - llm.py                 # LLM interactions
      - documents.py           # Document processing

  # ---------------------------------------------------------------------------
  # Database & Vector Store
  # ---------------------------------------------------------------------------
  database:
    description: |
      PostgreSQL with pgvector extension for vector storage.
      Connection management in src/db/.

    location: src/db/
    files:
      - vector.py              # pgvector operations
      - client.py              # Database client (asyncpg)

  # ---------------------------------------------------------------------------
  # Models (Pydantic)
  # ---------------------------------------------------------------------------
  models:
    description: |
      Pydantic models for request/response validation.
      Located in src/models/.

    location: src/models/
    examples:
      - chat.py                # ChatRequest, ChatResponse
      - document.py            # DocumentModel

  # ---------------------------------------------------------------------------
  # Shared Directories
  # ---------------------------------------------------------------------------
  shared:
    directories:
      - src/main.py            # FastAPI app entry
      - src/config.py          # Settings
      - src/routers/           # API route handlers
      - src/services/          # Business logic
      - src/models/            # Pydantic models
      - src/db/                # Database operations
      - src/utils/             # Utility functions
      - tests/                 # pytest tests

