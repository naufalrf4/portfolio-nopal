# =============================================================================
# NAMING CONVENTIONS
# =============================================================================

naming_conventions:
  description: |
    Consistent naming conventions ensure code readability and maintainability.
    All team members must follow these conventions strictly.

  # ---------------------------------------------------------------------------
  # Files & Directories
  # ---------------------------------------------------------------------------
  files_and_directories:
    directories:
      pattern: kebab-case
      examples:
        - src/features/
        - src/components/ui/
        - user-profile/
        - api-clients/

    react_components:
      pattern: PascalCase.tsx
      examples:
        - Button.tsx
        - ProjectCard.tsx
        - DashboardLayout.tsx
      note: Component filename must match the default export name

    hooks:
      pattern: use{HookName}.ts (camelCase with "use" prefix)
      examples:
        - useProjects.ts
        - useMediaQuery.ts
        - useLocalStorage.ts

    services:
      pattern: "{name}.service.ts"
      examples:
        - projects.service.ts
        - auth.service.ts
        - analytics.service.ts

    types:
      pattern: "{name}.types.ts"
      examples:
        - project.types.ts
        - api.types.ts
        - user.types.ts

    utilities:
      pattern: "{name}.util.ts or {name}.ts"
      examples:
        - format.util.ts
        - validation.util.ts
        - cn.ts

    constants:
      pattern: "{name}.ts (lowercase)"
      examples:
        - routes.ts
        - config.ts
        - seo.ts

    tests:
      pattern: "{name}.test.ts or {name}.spec.ts"
      examples:
        - Button.test.tsx
        - useProjects.test.ts
        - projects.service.test.ts

    barrel_exports:
      pattern: index.ts
      purpose: Re-export all public APIs from a directory
      example: |
        // src/features/projects/components/index.ts
        export { ProjectGrid } from './ProjectGrid'
        export { ProjectCard } from './ProjectCard'
        export { ProjectDetail } from './ProjectDetail'

  # ---------------------------------------------------------------------------
  # Code Naming
  # ---------------------------------------------------------------------------
  code:
    components:
      pattern: PascalCase
      examples:
        - Button
        - ProjectCard
        - DashboardLayout

    hooks:
      pattern: useCamelCase
      examples:
        - useProjects
        - useAuth
        - useMediaQuery

    functions:
      pattern: camelCase
      examples:
        - fetchProjects
        - formatDate
        - validateEmail

    constants:
      pattern: SCREAMING_SNAKE_CASE
      examples:
        - API_BASE_URL
        - MAX_FILE_SIZE
        - DEFAULT_PAGE_SIZE

    types_and_interfaces:
      pattern: PascalCase
      prefix: None (avoid I prefix for interfaces)
      examples:
        - Project
        - ApiResponse
        - UserProfile
        - CreateProjectRequest

    enums:
      pattern: PascalCase
      values: SCREAMING_SNAKE_CASE or PascalCase
      examples:
        - "enum ProjectStatus { DRAFT, PUBLISHED, ARCHIVED }"
        - "enum HttpMethod { Get, Post, Put, Delete }"

    type_parameters:
      pattern: Single uppercase letter or descriptive PascalCase
      examples:
        - T, K, V (for generics)
        - TData, TError (for descriptive generics)

  # ---------------------------------------------------------------------------
  # API Naming
  # ---------------------------------------------------------------------------
  api:
    routes:
      pattern: kebab-case, plural nouns for resources
      examples:
        - /api/v1/projects
        - /api/v1/blog-posts
        - /api/v1/user-settings

    query_parameters:
      pattern: camelCase
      examples:
        - "?pageSize=10"
        - "?sortBy=createdAt"
        - "?includeArchived=true"

    request_body:
      pattern: camelCase
      example: |
        {
          "title": "My Project",
          "description": "...",
          "techStack": ["React", "Node.js"]
        }

# =============================================================================
# IMPORT/EXPORT PATTERNS
# =============================================================================

import_export_patterns:
  description: |
    Consistent import/export patterns improve code organization and prevent
    circular dependencies. Follow these patterns strictly.

  # ---------------------------------------------------------------------------
  # Import Order
  # ---------------------------------------------------------------------------
  import_order:
    description: Imports should be organized in the following order
    order:
      - group: External packages
        examples:
          - "import React from 'react'"
          - "import { NextRequest } from 'next/server'"
          - "import { z } from 'zod'"

      - group: Monorepo packages
        prefix: "@repo/"
        examples:
          - "import { Button } from '@repo/ui'"
          - "import type { Project } from '@repo/types'"
          - "import { AdminClient } from '@repo/sdk'"

      - group: Absolute imports (app aliases)
        prefix: "@/"
        examples:
          - "import { ProjectCard } from '@/features/projects'"
          - "import { cn } from '@/lib/utils'"
          - "import { Header } from '@/components/layout'"

      - group: Relative imports
        examples:
          - "import { formatDate } from './utils'"
          - "import { ProjectCard } from '../components'"

      - group: Type imports (at the end)
        examples:
          - "import type { Project } from '@repo/types'"
          - "import type { ComponentProps } from 'react'"

    example: |
      // External packages
      import React, { useState, useCallback } from 'react'
      import { useQuery } from '@tanstack/react-query'
      import { z } from 'zod'

      // Monorepo packages
      import { Button, Card } from '@repo/ui'
      import { AdminClient } from '@repo/sdk'

      // Absolute imports
      import { ProjectCard } from '@/features/projects'
      import { cn } from '@/lib/utils'

      // Relative imports
      import { formatDate } from './utils'

      // Type imports
      import type { Project } from '@repo/types'
      import type { ComponentProps } from 'react'

  # ---------------------------------------------------------------------------
  # Export Patterns
  # ---------------------------------------------------------------------------
  export_patterns:
    # Named exports (preferred)
    named_exports:
      description: Prefer named exports for better refactoring and tree-shaking
      example: |
        // components/Button.tsx
        export function Button(props: ButtonProps) { ... }

        // hooks/useProjects.ts
        export function useProjects() { ... }

        // services/projects.service.ts
        export const projectsService = { ... }

    # Default exports (for pages and layouts)
    default_exports:
      description: Use default exports only for Next.js pages and layouts
      example: |
        // app/projects/page.tsx
        export default function ProjectsPage() { ... }

        // app/layout.tsx
        export default function RootLayout({ children }) { ... }

    # Barrel exports
    barrel_exports:
      description: Use index.ts files to re-export public APIs
      rules:
        - Only export items that should be used outside the directory
        - Keep internal implementations private
        - Use explicit named exports (avoid export *)

      example: |
        // src/features/projects/index.ts
        // Components
        export { ProjectGrid } from './components/ProjectGrid'
        export { ProjectCard } from './components/ProjectCard'

        // Hooks
        export { useProjects } from './hooks/useProjects'
        export { useProjectDetail } from './hooks/useProjectDetail'

        // Services
        export { projectsService } from './services/projects.service'

        // Types (re-export from types/)
        export type { Project, ProjectFilters } from './types'

    # Type exports
    type_exports:
      description: Use explicit type exports for TypeScript types
      example: |
        // types/project.types.ts
        export interface Project {
          id: string
          title: string
          // ...
        }

        export type ProjectStatus = 'draft' | 'published' | 'archived'

        // Re-export in index.ts
        export type { Project, ProjectStatus } from './project.types'

  # ---------------------------------------------------------------------------
  # Path Aliases
  # ---------------------------------------------------------------------------
  path_aliases:
    description: Configure path aliases in tsconfig.json for clean imports
    configuration:
      tsconfig: |
        {
          "compilerOptions": {
            "baseUrl": ".",
            "paths": {
              "@/*": ["./src/*"],
              "@/features/*": ["./src/features/*"],
              "@/components/*": ["./src/components/*"],
              "@/lib/*": ["./src/lib/*"],
              "@/hooks/*": ["./src/hooks/*"],
              "@/types/*": ["./src/types/*"]
            }
          }
        }

    usage:
      - pattern: "@/features/{feature}"
        example: "import { ProjectCard } from '@/features/projects'"

      - pattern: "@/components/{category}"
        example: "import { Button } from '@/components/ui'"

      - pattern: "@/lib/{module}"
        example: "import { cn } from '@/lib/utils'"

  # ---------------------------------------------------------------------------
  # Import Rules
  # ---------------------------------------------------------------------------
  import_rules:
    feature_isolation:
      description: Features should not import from other features directly
      rule: Use shared components/hooks/services or elevate to shared layer
      bad_example: |
        // Bad: Direct import between features
        // src/features/blog/components/ArticleCard.tsx
        import { ProjectTechStack } from '@/features/projects'

      good_example: |
        // Good: Use shared component
        // src/features/blog/components/ArticleCard.tsx
        import { TechStack } from '@/components/common'

    circular_dependency_prevention:
      description: Prevent circular dependencies with proper layering
      rules:
        - Features can import from shared layers (components, lib, hooks)
        - Shared layers should not import from features
        - Lower layers should not import from higher layers

      layer_order:
        - level: 1
          name: features
          can_import_from: [components, lib, hooks, providers, types, "@repo/*"]

        - level: 2
          name: components
          can_import_from: [lib, hooks, types, "@repo/*"]

        - level: 3
          name: hooks
          can_import_from: [lib, types, "@repo/*"]

        - level: 4
          name: lib
          can_import_from: [types, "@repo/*"]

        - level: 5
          name: types
          can_import_from: ["@repo/types"]

# =============================================================================
# ADDITIONAL GUIDELINES
# =============================================================================

guidelines:
  # ---------------------------------------------------------------------------
  # Component Guidelines
  # ---------------------------------------------------------------------------
  components:
    file_structure:
      description: Each component file should follow this structure
      template: |
        // 1. Imports
        import React from 'react'
        import { cn } from '@/lib/utils'
        import type { ComponentProps } from './types'

        // 2. Types (if not in separate file)
        interface Props {
          // ...
        }

        // 3. Component
        export function ComponentName({ prop1, prop2 }: Props) {
          // Hooks
          // State
          // Effects
          // Handlers
          // Render
          return (...)
        }

        // 4. Sub-components (if any)
        function SubComponent() { ... }

    colocation:
      description: Keep related files close to components
      example: |
        components/
        └── ProjectCard/
            ├── ProjectCard.tsx        # Component
            ├── ProjectCard.test.tsx   # Tests
            ├── ProjectCard.stories.tsx # Storybook (optional)
            └── index.ts               # Barrel export

  # ---------------------------------------------------------------------------
  # API Route Guidelines (Next.js)
  # ---------------------------------------------------------------------------
  api_routes:
    structure:
      description: API route handler structure
      template: |
        // app/api/v1/projects/route.ts
        import { NextRequest, NextResponse } from 'next/server'
        import { z } from 'zod'
        import { db } from '@/lib/db'
        import { projects } from '@/db/schema'
        import { eq } from 'drizzle-orm'
        import { requireAuth } from '@repo/auth'

        // Validation schema
        const createProjectSchema = z.object({
          title: z.string().min(1),
          description: z.string(),
        })

        // GET /api/v1/projects
        export async function GET(request: NextRequest) {
          try {
            const result = await db.select().from(projects)
            return NextResponse.json({ data: projects })
          } catch (error) {
            return NextResponse.json(
              { error: 'Failed to fetch projects' },
              { status: 500 }
            )
          }
        }

        // POST /api/v1/projects
        export async function POST(request: NextRequest) {
          try {
            const session = await requireAuth()
            const body = await request.json()
            const data = createProjectSchema.parse(body)

            const [project] = await db.insert(projects).values(data).returning()
            return NextResponse.json({ data: project }, { status: 201 })
          } catch (error) {
            // Handle validation/auth/db errors
          }
        }

  # ---------------------------------------------------------------------------
  # Testing Guidelines
  # ---------------------------------------------------------------------------
  testing:
    location:
      unit_tests: Colocated with source files (.test.ts suffix)
      integration_tests: tests/integration/ directory
      e2e_tests: tests/e2e/ or e2e/ directory

    naming:
      pattern: "{filename}.test.ts or {filename}.spec.ts"
      examples:
        - Button.test.tsx
        - useProjects.test.ts
        - projects.service.test.ts

# =============================================================================
# END OF SPECIFICATION
# =============================================================================
