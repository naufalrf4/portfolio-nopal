  # ---------------------------------------------------------------------------
  # Complete JSON-LD Components
  # ---------------------------------------------------------------------------
  jsonld_components:
    main_component: |
      // src/components/seo/json-ld.tsx
      'use client'

      import Script from 'next/script'

      interface JsonLdProps {
        data: Record<string, unknown> | Record<string, unknown>[]
      }

      export function JsonLd({ data }: JsonLdProps) {
        const jsonLdData = Array.isArray(data) 
          ? data.map((item, index) => ({ ...item, '@id': `#${index}` }))
          : data

        return (
          <Script
            id="json-ld-data"
            type="application/ld+json"
            dangerouslySetInnerHTML={{ 
              __html: JSON.stringify(jsonLdData, null, 0) 
            }}
            strategy="afterInteractive"
          />
        )
      }

    schema_library: |
      // src/lib/seo/schemas.ts
      const BASE_URL = 'https://naufalrf.tech'

      // Person Schema
      export function getPersonSchema() {
        return {
          '@context': 'https://schema.org',
          '@type': 'Person',
          '@id': `${BASE_URL}/#person`,
          name: 'Naufal Rizqullah Firdaus',
          alternateName: 'Naufal RF',
          url: BASE_URL,
          image: `${BASE_URL}/images/profile.jpg`,
          description: 'Full-stack software engineer',
          jobTitle: 'Software Engineer',
          sameAs: [
            'https://github.com/naufalrf4',
            'https://linkedin.com/in/naufalrf',
            'https://twitter.com/naufalrf',
          ],
        }
      }

      // WebSite Schema
      export function getWebSiteSchema() {
        return {
          '@context': 'https://schema.org',
          '@type': 'WebSite',
          '@id': `${BASE_URL}/#website`,
          name: 'Naufal RF Portfolio',
          url: BASE_URL,
          publisher: { '@id': `${BASE_URL}/#person` },
          inLanguage: 'en-US',
        }
      }

      // Breadcrumb Schema
      export function getBreadcrumbSchema(
        items: { name: string; url: string }[]
      ) {
        return {
          '@context': 'https://schema.org',
          '@type': 'BreadcrumbList',
          itemListElement: items.map((item, index) => ({
            '@type': 'ListItem',
            position: index + 1,
            name: item.name,
            item: item.url,
          })),
        }
      }

      // Project Schema
      export function getProjectSchema(project: {
        title: string
        description: string
        slug: string
        datePublished: string
        dateModified?: string
        technologies: string[]
        image?: string
        demoUrl?: string
        repoUrl?: string
      }) {
        return {
          '@context': 'https://schema.org',
          '@type': 'SoftwareApplication',
          name: project.title,
          description: project.description,
          url: `${BASE_URL}/projects/${project.slug}`,
          image: project.image || `${BASE_URL}/og-project-default.png`,
          datePublished: project.datePublished,
          dateModified: project.dateModified || project.datePublished,
          author: { '@id': `${BASE_URL}/#person` },
          applicationCategory: 'WebApplication',
          operatingSystem: 'Web Browser',
          offers: {
            '@type': 'Offer',
            price: '0',
            priceCurrency: 'USD',
          },
          keywords: project.technologies.join(', '),
          ...(project.demoUrl && { installUrl: project.demoUrl }),
          ...(project.repoUrl && { codeRepository: project.repoUrl }),
        }
      }

      // Combined page schemas
      export function getHomePageSchemas() {
        return [
          getWebSiteSchema(),
          getPersonSchema(),
          getBreadcrumbSchema([{ name: 'Home', url: BASE_URL }]),
        ]
      }

      export function getProjectPageSchemas(project: Parameters<typeof getProjectSchema>[0]) {
        return [
          getProjectSchema(project),
          getBreadcrumbSchema([
            { name: 'Home', url: BASE_URL },
            { name: 'Projects', url: `${BASE_URL}/projects` },
            { name: project.title, url: `${BASE_URL}/projects/${project.slug}` },
          ]),
        ]
      }

  # ---------------------------------------------------------------------------
  # SEO Utilities
  # ---------------------------------------------------------------------------
  utilities:
    seo_config: |
      // src/lib/seo/config.ts
      export const seoConfig = {
        siteUrl: 'https://naufalrf.tech',
        siteName: 'Naufal RF Portfolio',
        siteDescription: 'Full-stack software engineer portfolio',
        author: {
          name: 'Naufal Rizqullah Firdaus',
          email: 'contact@naufalrf.tech',
          twitter: '@naufalrf',
        },
        defaultOgImage: '/og-image.png',
        twitterCardType: 'summary_large_image' as const,
      }

    generate_og_image_url: |
      // src/lib/seo/og-image.ts
      // For dynamic OG image generation with Vercel OG
      export function generateOgImageUrl(params: {
        title: string
        subtitle?: string
        type?: 'project' | 'blog' | 'default'
      }): string {
        const searchParams = new URLSearchParams({
          title: params.title,
          ...(params.subtitle && { subtitle: params.subtitle }),
          ...(params.type && { type: params.type }),
        })
        
        return `https://naufalrf.tech/api/og?${searchParams.toString()}`
      }

    canonical_helper: |
      // src/lib/seo/canonical.ts
      import { seoConfig } from './config'

      export function getCanonicalUrl(path: string): string {
        const cleanPath = path.startsWith('/') ? path : `/${path}`
        const normalizedPath = cleanPath.replace(/\/+$/, '') // Remove trailing slashes
        return `${seoConfig.siteUrl}${normalizedPath}`
      }

