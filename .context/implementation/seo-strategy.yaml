# SEO Strategy Specification
# Portfolio Site: naufalrf.tech
# Target Audience: Recruiters, Engineers, Clients
# Last Updated: 2025-01-10

metadata:
  version: "1.0.0"
  site_url: "https://naufalrf.tech"
  site_name: "Naufal RF - Engineer Portfolio"
  locale: "en_US"
  author:
    name: "Naufal Rizqullah Firdaus"
    handle: "@naufalrf"
    email: "contact@naufalrf.tech"

# =============================================================================
# 1. TECHNICAL SEO
# =============================================================================
technical_seo:
  # ---------------------------------------------------------------------------
  # Next.js Metadata API Configuration
  # ---------------------------------------------------------------------------
  metadata_api:
    description: |
      Use Next.js 14+ Metadata API for SEO optimization.
      Prefer static metadata exports where possible for better performance.
      Use generateMetadata for dynamic pages that require data fetching.

    static_metadata_pattern: |
      // src/app/layout.tsx - Root layout with base metadata
      import type { Metadata } from 'next'

      export const metadata: Metadata = {
        metadataBase: new URL('https://naufalrf.tech'),
        title: {
          default: 'Naufal RF - Software Engineer Portfolio',
          template: '%s | Naufal RF'
        },
        description: 'Full-stack software engineer specializing in React, Next.js, and cloud architecture. View my projects, skills, and experience.',
        keywords: [
          'software engineer',
          'full-stack developer',
          'React developer',
          'Next.js developer',
          'portfolio',
          'Naufal RF'
        ],
        authors: [{ name: 'Naufal Rizqullah Firdaus', url: 'https://naufalrf.tech' }],
        creator: 'Naufal Rizqullah Firdaus',
        publisher: 'Naufal Rizqullah Firdaus',
        robots: {
          index: true,
          follow: true,
          googleBot: {
            index: true,
            follow: true,
            'max-video-preview': -1,
            'max-image-preview': 'large',
            'max-snippet': -1,
          },
        },
        alternates: {
          canonical: 'https://naufalrf.tech',
        },
        openGraph: {
          type: 'website',
          locale: 'en_US',
          url: 'https://naufalrf.tech',
          siteName: 'Naufal RF Portfolio',
          title: 'Naufal RF - Engineer Portfolio',
          description: 'Full-stack software engineer specializing in React, Next.js, and cloud architecture.',
          images: [
            {
              url: '/og-image.png',
              width: 1200,
              height: 630,
              alt: 'Naufal RF - Software Engineer Portfolio',
            },
          ],
        },
        twitter: {
          card: 'summary_large_image',
          title: 'Naufal RF - Software Engineer Portfolio',
          description: 'Full-stack software engineer specializing in React, Next.js, and cloud architecture.',
          creator: '@naufalrf',
          images: ['/og-image.png'],
        },
        verification: {
          google: 'your-google-verification-code',
          // yandex: 'your-yandex-verification-code',
        },
        category: 'technology',
      }

    generate_metadata_pattern: |
      // src/app/projects/[slug]/page.tsx - Dynamic project pages
      import type { Metadata, ResolvingMetadata } from 'next'
      import { getProject } from '@/lib/projects'

      type Props = {
        params: { slug: string }
      }

      export async function generateMetadata(
        { params }: Props,
        parent: ResolvingMetadata
      ): Promise<Metadata> {
        const project = await getProject(params.slug)
        
        if (!project) {
          return {
            title: 'Project Not Found',
            description: 'The requested project could not be found.',
          }
        }

        const previousImages = (await parent).openGraph?.images || []

        return {
          title: project.title,
          description: project.summary,
          keywords: [...project.technologies, 'project', 'portfolio'],
          alternates: {
            canonical: `/projects/${params.slug}`,
          },
          openGraph: {
            title: project.title,
            description: project.summary,
            type: 'article',
            publishedTime: project.date,
            authors: ['Naufal Rizqullah Firdaus'],
            tags: project.technologies,
            images: project.thumbnail 
              ? [{ url: project.thumbnail, width: 1200, height: 630, alt: project.title }]
              : previousImages,
          },
          twitter: {
            card: 'summary_large_image',
            title: project.title,
            description: project.summary,
            images: project.thumbnail ? [project.thumbnail] : undefined,
          },
        }
      }

  # ---------------------------------------------------------------------------
  # robots.txt Configuration
  # ---------------------------------------------------------------------------
  robots_txt:
    location: "src/app/robots.ts"
    implementation: |
      // src/app/robots.ts
      import { MetadataRoute } from 'next'

      export default function robots(): MetadataRoute.Robots {
        return {
          rules: [
            {
              userAgent: '*',
              allow: '/',
              disallow: [
                '/api/',
                '/admin/',
                '/_next/',
                '/private/',
              ],
            },
            {
              userAgent: 'GPTBot',
              allow: '/',
            },
          ],
          sitemap: 'https://naufalrf.tech/sitemap.xml',
          host: 'https://naufalrf.tech',
        }
      }

    rules:
      - agent: "*"
        allow:
          - "/"
        disallow:
          - "/api/"
          - "/admin/"
          - "/_next/"
          - "/private/"
      - agent: "GPTBot"
        allow:
          - "/"

  # ---------------------------------------------------------------------------
  # Sitemap Generation
  # ---------------------------------------------------------------------------
  sitemap:
    location: "src/app/sitemap.ts"
    implementation: |
      // src/app/sitemap.ts
      import { MetadataRoute } from 'next'
      import { getAllProjects } from '@/lib/projects'

      export default async function sitemap(): Promise<MetadataRoute.Sitemap> {
        const baseUrl = 'https://naufalrf.tech'
        
        // Get all project slugs
        const projects = await getAllProjects()
        const projectUrls = projects.map((project) => ({
          url: `${baseUrl}/projects/${project.slug}`,
          lastModified: new Date(project.updatedAt || project.date),
          changeFrequency: 'monthly' as const,
          priority: 0.7,
        }))

        // Static pages
        const staticPages = [
          {
            url: baseUrl,
            lastModified: new Date(),
            changeFrequency: 'weekly' as const,
            priority: 1.0,
          },
          {
            url: `${baseUrl}/projects`,
            lastModified: new Date(),
            changeFrequency: 'weekly' as const,
            priority: 0.9,
          },
          {
            url: `${baseUrl}/about`,
            lastModified: new Date(),
            changeFrequency: 'monthly' as const,
            priority: 0.8,
          },
          {
            url: `${baseUrl}/blog`,
            lastModified: new Date(),
            changeFrequency: 'weekly' as const,
            priority: 0.8,
          },
          {
            url: `${baseUrl}/contact`,
            lastModified: new Date(),
            changeFrequency: 'monthly' as const,
            priority: 0.6,
          },
        ]

        return [...staticPages, ...projectUrls]
      }

    pages:
      - path: "/"
        priority: 1.0
        changefreq: "weekly"
      - path: "/projects"
        priority: 0.9
        changefreq: "weekly"
      - path: "/projects/*"
        priority: 0.7
        changefreq: "monthly"
      - path: "/about"
        priority: 0.8
        changefreq: "monthly"
      - path: "/blog"
        priority: 0.8
        changefreq: "weekly"
      - path: "/contact"
        priority: 0.6
        changefreq: "monthly"

  # ---------------------------------------------------------------------------
  # Canonical URLs
  # ---------------------------------------------------------------------------
  canonical_urls:
    strategy: "absolute_urls"
    description: |
      Always use absolute canonical URLs with https://.
      Handle trailing slashes consistently (no trailing slash).
      Implement alternates for any potential duplicate content.

    implementation: |
      // In any page metadata
      alternates: {
        canonical: 'https://naufalrf.tech/projects/my-project',
        languages: {
          'en-US': 'https://naufalrf.tech/projects/my-project',
          // Add more if multilingual
        },
      }

    rules:
      - use_https: true
      - include_www: false
      - trailing_slash: false
      - lowercase_urls: true

# =============================================================================
# 2. META TAGS
# =============================================================================
meta_tags:
