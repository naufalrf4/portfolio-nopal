    implementation: |
      // src/app/projects/[slug]/page.tsx
      import { Metadata } from 'next'
      import { notFound } from 'next/navigation'
      import { getProject, getAllProjects } from '@/lib/projects'
      import { JsonLd } from '@/components/seo/json-ld'
      import { getProjectPageSchemas } from '@/lib/seo'

      export async function generateStaticParams() {
        const projects = await getAllProjects()
        return projects.map((project) => ({
          slug: project.slug,
        }))
      }

      export async function generateMetadata({ params }): Promise<Metadata> {
        const project = await getProject(params.slug)
        
        if (!project) {
          return { title: 'Project Not Found' }
        }

        return {
          title: project.title,
          description: project.summary,
          keywords: project.technologies,
          alternates: {
            canonical: `https://naufalrf.tech/projects/${params.slug}`,
          },
          openGraph: {
            type: 'article',
            title: project.title,
            description: project.summary,
            publishedTime: project.date,
            authors: ['Naufal Rizqullah Firdaus'],
            tags: project.technologies,
            images: [
              {
                url: project.thumbnail || '/og-project-default.png',
                width: 1200,
                height: 630,
                alt: project.title,
              },
            ],
          },
        }
      }

      export default async function ProjectPage({ params }) {
        const project = await getProject(params.slug)
        
        if (!project) {
          notFound()
        }

        const schemas = getProjectPageSchemas({
          title: project.title,
          description: project.summary,
          slug: project.slug,
          datePublished: project.date,
          technologies: project.technologies,
          image: project.thumbnail,
          demoUrl: project.demoUrl,
          repoUrl: project.repoUrl,
        })

        return (
          <>
            {schemas.map((schema, i) => (
              <JsonLd key={i} data={schema} />
            ))}
            {/* Project content */}
          </>
        )
      }

