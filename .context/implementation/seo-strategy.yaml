      locale: "en_US"
      type: "website"

    images:
      default:
        url: "/og-image.png"
        width: 1200
        height: 630
        alt: "Naufal RF - Software Engineer Portfolio"

      project:
        width: 1200
        height: 630
        fallback: "/og-project-default.png"

    types_per_page:
      home: "website"
      about: "profile"
      projects_list: "website"
      project_detail: "article"
      blog_post: "article"
      contact: "website"

    implementation: |
      // Open Graph configuration example
      openGraph: {
        type: 'article',
        locale: 'en_US',
        url: `https://naufalrf.tech/projects/${slug}`,
        siteName: 'Naufal RF Portfolio',
        title: project.title,
        description: project.summary,
        publishedTime: project.createdAt,
        modifiedTime: project.updatedAt,
        authors: ['Naufal Rizqullah Firdaus'],
        tags: project.technologies,
        images: [
          {
            url: project.ogImage || '/og-project-default.png',
            width: 1200,
            height: 630,
            alt: project.title,
            type: 'image/png',
          },
        ],
      }

  # ---------------------------------------------------------------------------
  # Twitter Card Tags
  # ---------------------------------------------------------------------------
  twitter_cards:
    card_type: "summary_large_image"
    site: "@naufalrf"
    creator: "@naufalrf"

    implementation: |
      twitter: {
        card: 'summary_large_image',
        site: '@naufalrf',
        creator: '@naufalrf',
        title: pageTitle,
        description: pageDescription,
        images: {
          url: imageUrl,
          alt: imageAlt,
        },
      }

  # ---------------------------------------------------------------------------
  # Author & Creator Tags
  # ---------------------------------------------------------------------------
  authorship:
    author:
      name: "Naufal Rizqullah Firdaus"
      url: "https://naufalrf.tech"
    creator: "Naufal Rizqullah Firdaus"
    publisher: "Naufal Rizqullah Firdaus"

    implementation: |
      authors: [
        { 
          name: 'Naufal Rizqullah Firdaus', 
          url: 'https://naufalrf.tech' 
        }
      ],
      creator: 'Naufal Rizqullah Firdaus',
      publisher: 'Naufal Rizqullah Firdaus',

# =============================================================================
# 3. STRUCTURED DATA (JSON-LD)
# =============================================================================
structured_data:
  # ---------------------------------------------------------------------------
  # JSON-LD Component
  # ---------------------------------------------------------------------------
  base_component: |
    // src/components/seo/json-ld.tsx
    import Script from 'next/script'

    interface JsonLdProps {
      data: Record<string, unknown>
    }

    export function JsonLd({ data }: JsonLdProps) {
      return (
        <Script
          id="json-ld"
          type="application/ld+json"
          dangerouslySetInnerHTML={{ __html: JSON.stringify(data) }}
          strategy="afterInteractive"
        />
      )
    }

    // Alternative: Using metadata.other in Next.js 14+
    // This can be included in page metadata exports

  # ---------------------------------------------------------------------------
  # Person Schema (Portfolio Owner)
  # ---------------------------------------------------------------------------
  person_schema:
    description: "Represents the portfolio owner"
    usage_pages:
      - home
      - about
    implementation: |
      // src/lib/seo/schemas.ts
      export function getPersonSchema() {
        return {
          '@context': 'https://schema.org',
          '@type': 'Person',
          '@id': 'https://naufalrf.tech/#person',
          name: 'Naufal Rizqullah Firdaus',
          alternateName: 'Naufal RF',
          url: 'https://naufalrf.tech',
          image: {
            '@type': 'ImageObject',
            url: 'https://naufalrf.tech/images/profile.jpg',
            width: 400,
            height: 400,
          },
          description: 'Full-stack software engineer specializing in React, Next.js, and cloud architecture.',
          email: 'mailto:contact@naufalrf.tech',
          jobTitle: 'Software Engineer',
          worksFor: {
            '@type': 'Organization',
            name: 'Freelance / Open to Opportunities',
          },
          knowsAbout: [
            'JavaScript',
            'TypeScript',
            'React',
            'Next.js',
            'Node.js',
            'Python',
            'Cloud Architecture',
            'PostgreSQL',
            'MongoDB',
          ],
          sameAs: [
            'https://github.com/naufalrf',
            'https://linkedin.com/in/naufalrf',
            'https://twitter.com/naufalrf',
          ],
          alumniOf: {
            '@type': 'EducationalOrganization',
            name: 'Your University Name',
          },
        }
      }

  # ---------------------------------------------------------------------------
  # WebSite Schema
  # ---------------------------------------------------------------------------
  website_schema:
    description: "Represents the portfolio website"
    usage_pages:
      - home
    implementation: |
      export function getWebSiteSchema() {
        return {
          '@context': 'https://schema.org',
          '@type': 'WebSite',
          '@id': 'https://naufalrf.tech/#website',
          name: 'Naufal RF Portfolio',
          alternateName: 'Naufal Rizqullah Firdaus Portfolio',
          url: 'https://naufalrf.tech',
          description: 'Portfolio and blog of Naufal RF, a software engineer.',
          publisher: {
            '@id': 'https://naufalrf.tech/#person',
          },
          inLanguage: 'en-US',
          potentialAction: {
            '@type': 'SearchAction',
            target: {
              '@type': 'EntryPoint',
              urlTemplate: 'https://naufalrf.tech/search?q={search_term_string}',
            },
            'query-input': 'required name=search_term_string',
          },
        }
      }

  # ---------------------------------------------------------------------------
  # BreadcrumbList Schema
  # ---------------------------------------------------------------------------
  breadcrumb_schema:
    description: "Navigation breadcrumbs for better SEO and UX"
    implementation: |
      // src/lib/seo/schemas.ts
      interface BreadcrumbItem {
        name: string
        url: string
      }

      export function getBreadcrumbSchema(items: BreadcrumbItem[]) {
        return {
          '@context': 'https://schema.org',
          '@type': 'BreadcrumbList',
          itemListElement: items.map((item, index) => ({
            '@type': 'ListItem',
            position: index + 1,
            name: item.name,
            item: item.url,
          })),
        }
      }

      // Usage example for project page:
      const projectBreadcrumbs = getBreadcrumbSchema([
        { name: 'Home', url: 'https://naufalrf.tech' },
        { name: 'Projects', url: 'https://naufalrf.tech/projects' },
        { name: project.title, url: `https://naufalrf.tech/projects/${project.slug}` },
      ])

  # ---------------------------------------------------------------------------
  # Article/SoftwareApplication Schema (Projects)
  # ---------------------------------------------------------------------------
  project_schema:
    description: "For individual project pages"
    implementation: |
      // src/lib/seo/schemas.ts
      interface ProjectSchemaProps {
        title: string
        description: string
        slug: string
        datePublished: string
        dateModified?: string
        technologies: string[]
        image?: string
        demoUrl?: string
        repoUrl?: string
      }

      export function getProjectSchema(project: ProjectSchemaProps) {
        // Use SoftwareApplication for software projects
        // Use Article for project write-ups/case studies
        return {
          '@context': 'https://schema.org',
          '@type': 'SoftwareApplication',
          name: project.title,
          description: project.description,
          url: `https://naufalrf.tech/projects/${project.slug}`,
          image: project.image || 'https://naufalrf.tech/og-project-default.png',
          datePublished: project.datePublished,
          dateModified: project.dateModified || project.datePublished,
          author: {
            '@id': 'https://naufalrf.tech/#person',
          },
          applicationCategory: 'WebApplication',
          operatingSystem: 'Web Browser',
          offers: {
            '@type': 'Offer',
            price: '0',
            priceCurrency: 'USD',
          },
          keywords: project.technologies.join(', '),
          // If it's a demo project
          ...(project.demoUrl && { 
            installUrl: project.demoUrl,
          }),
          // Link to source code
          ...(project.repoUrl && {
            codeRepository: project.repoUrl,
          }),
        }
      }

      // Alternative: Article schema for project case studies
      export function getProjectArticleSchema(project: ProjectSchemaProps) {
        return {
          '@context': 'https://schema.org',
          '@type': 'Article',
          headline: project.title,
          description: project.description,
          url: `https://naufalrf.tech/projects/${project.slug}`,
          image: project.image || 'https://naufalrf.tech/og-project-default.png',
          datePublished: project.datePublished,
          dateModified: project.dateModified || project.datePublished,
          author: {
            '@id': 'https://naufalrf.tech/#person',
          },
          publisher: {
            '@id': 'https://naufalrf.tech/#person',
          },
          mainEntityOfPage: {
            '@type': 'WebPage',
            '@id': `https://naufalrf.tech/projects/${project.slug}`,
          },
          keywords: project.technologies.join(', '),
          articleSection: 'Projects',
        }
      }

  # ---------------------------------------------------------------------------
  # FAQPage Schema
  # ---------------------------------------------------------------------------
  faq_schema:
    description: "For FAQ sections if applicable"
    usage_pages:
      - about (if includes FAQ)
      - contact (for common questions)
    implementation: |
      // src/lib/seo/schemas.ts
      interface FAQItem {
        question: string
        answer: string
      }

      export function getFAQSchema(faqs: FAQItem[]) {
        return {
          '@context': 'https://schema.org',
          '@type': 'FAQPage',
          mainEntity: faqs.map((faq) => ({
            '@type': 'Question',
            name: faq.question,
            acceptedAnswer: {
              '@type': 'Answer',
              text: faq.answer,
            },
          })),
        }
      }

      // Example FAQs for portfolio
      const portfolioFAQs = [
        {
          question: 'What technologies do you specialize in?',
          answer: 'I specialize in React, Next.js, TypeScript, Node.js, and cloud technologies including AWS and GCP.',
        },
        {
          question: 'Are you available for freelance work?',
          answer: 'Yes, I am available for freelance projects and consulting work. Please contact me for availability.',
        },
        {
          question: 'Do you work remotely?',
          answer: 'Yes, I am available for remote work and have experience collaborating with distributed teams.',
        },
      ]

  # ---------------------------------------------------------------------------
  # ProfilePage Schema
  # ---------------------------------------------------------------------------
  profile_schema:
    description: "For about page"
    implementation: |
      export function getProfilePageSchema() {
        return {
          '@context': 'https://schema.org',
          '@type': 'ProfilePage',
          mainEntity: {
            '@id': 'https://naufalrf.tech/#person',
          },
          dateCreated: '2024-01-01',
          dateModified: new Date().toISOString(),
        }
      }

  # ---------------------------------------------------------------------------
  # Combined Schema Helper
  # ---------------------------------------------------------------------------
  combined_implementation: |
    // src/lib/seo/index.ts
    export function getHomePageSchemas() {
      return [
        getWebSiteSchema(),
        getPersonSchema(),
        getBreadcrumbSchema([
          { name: 'Home', url: 'https://naufalrf.tech' },
        ]),
      ]
    }

    export function getProjectPageSchemas(project: ProjectSchemaProps) {
      return [
        getProjectSchema(project),
        getBreadcrumbSchema([
          { name: 'Home', url: 'https://naufalrf.tech' },
          { name: 'Projects', url: 'https://naufalrf.tech/projects' },
          { name: project.title, url: `https://naufalrf.tech/projects/${project.slug}` },
        ]),
      ]
    }

    // Component to render multiple schemas
    export function MultiJsonLd({ schemas }: { schemas: Record<string, unknown>[] }) {
      return (
        <>
          {schemas.map((schema, index) => (
            <Script
              key={index}
              id={`json-ld-${index}`}
              type="application/ld+json"
              dangerouslySetInnerHTML={{ __html: JSON.stringify(schema) }}
            />
          ))}
        </>
      )
    }

# =============================================================================
# 4. PERFORMANCE SEO
# =============================================================================
performance_seo:
  # ---------------------------------------------------------------------------
  # Core Web Vitals Targets
  # ---------------------------------------------------------------------------
  core_web_vitals:
    lcp: # Largest Contentful Paint
      target: "<2.5s"
      good: "<2.5s"
      needs_improvement: "2.5s - 4.0s"
      poor: ">4.0s"
      strategies:
        - "Optimize hero images with priority loading"
        - "Use next/image for automatic optimization"
        - "Preload critical fonts"
        - "Implement server-side rendering"

    fid: # First Input Delay (or INP - Interaction to Next Paint)
      target: "<100ms"
      good: "<100ms"
      needs_improvement: "100ms - 300ms"
      poor: ">300ms"
      strategies:
        - "Minimize JavaScript execution time"
        - "Break up long tasks"
        - "Use web workers for heavy computations"
        - "Implement code splitting"

    cls: # Cumulative Layout Shift
      target: "<0.1"
      good: "<0.1"
      needs_improvement: "0.1 - 0.25"
      poor: ">0.25"
      strategies:
        - "Always include width/height for images"
        - "Reserve space for dynamic content"
        - "Avoid inserting content above existing content"
        - "Use CSS aspect-ratio for media"

    inp: # Interaction to Next Paint (replacing FID)
      target: "<200ms"
      good: "<200ms"
      needs_improvement: "200ms - 500ms"
      poor: ">500ms"

  # ---------------------------------------------------------------------------
  # Image Optimization
  # ---------------------------------------------------------------------------
  image_optimization:
    strategy: "next/image with automatic optimization"
    formats:
      - "WebP"
      - "AVIF (progressive enhancement)"
    implementation: |
      // Always use next/image for optimized images
      import Image from 'next/image'

      // Hero/above-fold images - use priority
      <Image
        src="/hero-image.jpg"
        alt="Hero description"
        width={1200}
        height={630}
        priority
        quality={85}
        placeholder="blur"
        blurDataURL="data:image/jpeg;base64,..."
      />

      // Below-fold images - lazy load (default)
      <Image
        src={project.thumbnail}
        alt={project.title}
        width={400}
        height={300}
        loading="lazy"
        sizes="(max-width: 768px) 100vw, (max-width: 1200px) 50vw, 33vw"
      />

    config: |
      // next.config.js
      module.exports = {
        images: {
          formats: ['image/avif', 'image/webp'],
          deviceSizes: [640, 750, 828, 1080, 1200, 1920, 2048, 3840],
          imageSizes: [16, 32, 48, 64, 96, 128, 256, 384],
          minimumCacheTTL: 60 * 60 * 24 * 365, // 1 year
          remotePatterns: [
            {
              protocol: 'https',
              hostname: '**.githubusercontent.com',
            },
          ],
        },
      }

  # ---------------------------------------------------------------------------
  # Font Optimization
  # ---------------------------------------------------------------------------
  font_optimization:
    strategy: "next/font with local fonts and preloading"
    implementation: |
      // src/app/layout.tsx
      import { Inter, JetBrains_Mono } from 'next/font/google'

      const inter = Inter({
        subsets: ['latin'],
        display: 'swap',
        variable: '--font-inter',
        preload: true,
      })

      const jetbrainsMono = JetBrains_Mono({
        subsets: ['latin'],
        display: 'swap',
        variable: '--font-mono',
        preload: false, // Only preload primary font
      })

      export default function RootLayout({ children }) {
        return (
          <html lang="en" className={`${inter.variable} ${jetbrainsMono.variable}`}>
            <body className={inter.className}>{children}</body>
          </html>
        )
      }

    best_practices:
      - "Use font-display: swap for FOUT prevention"
      - "Limit font weights (2-3 max)"
      - "Subset fonts to required characters"
      - "Self-host when possible for best performance"

  # ---------------------------------------------------------------------------
  # Lazy Loading Strategy
  # ---------------------------------------------------------------------------
  lazy_loading:
    images:
      above_fold: "priority={true} - no lazy loading"
      below_fold: "loading='lazy' (default in next/image)"

    components:
      strategy: "Dynamic imports with loading states"
      implementation: |
        // Lazy load heavy components
        import dynamic from 'next/dynamic'

        const ProjectGallery = dynamic(
          () => import('@/components/project-gallery'),
          {
            loading: () => <ProjectGallerySkeleton />,
            ssr: true, // Enable SSR for SEO
          }
        )

        // For client-only components
        const ThreeScene = dynamic(
          () => import('@/components/three-scene'),
          {
            ssr: false,
            loading: () => <div className="scene-placeholder" />,
          }
        )

    intersection_observer: |
      // Custom hook for lazy loading sections
      import { useInView } from 'react-intersection-observer'

      function LazySection({ children }) {
        const { ref, inView } = useInView({
          triggerOnce: true,
          threshold: 0.1,
          rootMargin: '100px',
        })

        return (
          <section ref={ref}>
            {inView ? children : <SectionSkeleton />}
          </section>
        )
      }

