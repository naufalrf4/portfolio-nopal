current_observations:
  admin:
    direct_db_access: true
    auth:
      provider: Google OAuth via NextAuth v5 beta
      allowlist: ADMIN_EMAILS env gate in `src/lib/auth-security.ts`
    notable_config:
      - trustHost true in src/lib/auth.ts
      - public API CORS is currently wildcarded in `src/proxy.ts` and `next.config.js`
      - internal service token used for RAG ingest requests
  public_astro:
    direct_db_access: false
    public_inputs:
      - guestbook
      - auth sync
      - chatbot client requests
  links_astro:
    direct_db_access: false
  ngl_svelte:
    direct_db_access: false
    public_inputs:
      - anonymous message submission
      - Turnstile token
  rag_service:
    direct_db_access: true
    db_scope: intended for `rag` schema and retrieval/ingest responsibilities
    service_auth:
      - ADMIN_SERVICE_TOKEN
      - Admin API URL backchannel

recommended_hardening_from_user_direction_and_reference_research:
  - Use distinct Neon/Postgres roles for Admin, RAG, and migrations; do not share a single super-role.
  - Keep Public, Links, and NGL on API-only access.
  - Scope RAG database access to approved schemas/tables and least privilege.
  - Prefer Neon connection pooling for direct actors.
  - Restrict production database access with allowlists or equivalent network controls.
  - Keep service tokens and database URLs in secrets storage only.
  - Rotate service tokens and non-user credentials on a regular cadence.
  - Narrow CORS from wildcard origins to explicit allowed origins before production hardening is considered complete.
  - Keep public write endpoints rate-limited and CAPTCHA-protected.

database_policy:
  centralized_database: Neon/Postgres
  direct_db_actors:
    - apps/admin
    - apps/rag-service
  api_only_actors:
    - apps/public-astro
    - apps/links-astro
    - apps/ngl-svelte

known_gaps_or_unverified_items:
  - No row-level security evidence was found in this repo shell.
  - No CI-enforced security checks were found.
  - Current wildcard CORS settings are broader than the target hardening posture.
  - The hardening recommendations above come from the user's security-improvement direction plus external best-practice research, not from already-enforced repo policy.
