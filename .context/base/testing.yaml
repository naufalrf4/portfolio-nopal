# Testing Strategy

# =============================================================================
# COMPREHENSIVE TESTING STRATEGY
# =============================================================================
# Defines test levels, automation policies, coverage targets, and ownership
# for the NaufalRF Portfolio Ecosystem.
# =============================================================================

# -----------------------------------------------------------------------------
# TESTING PHILOSOPHY
# -----------------------------------------------------------------------------
philosophy:
  principles:
    - test_at_appropriate_level
    - testing_pyramid
    - deterministic_tests
    - fast_feedback
    - meaningful_coverage

  principle_details:
    test_at_appropriate_level: Prefer lower-level tests for logic, higher-level for integration
    testing_pyramid: Many unit tests, fewer integration tests, minimal E2E tests
    deterministic_tests: No flaky tests; fix or remove
    fast_feedback: Tests should run quickly in CI
    meaningful_coverage: Cover critical paths, not vanity metrics

  coverage_targets:
    unit: ">= 80% for business logic"
    integration: ">= 60% for API routes"
    e2e: Critical user journeys covered
    overall: ">= 70%"

  anti_patterns:
    - testing_implementation_details
    - excessive_mocking
    - testing_library_code
    - snapshot_overuse
    - flaky_tests


# -----------------------------------------------------------------------------
# TEST LEVELS
# -----------------------------------------------------------------------------
levels:

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  unit:
    description: Test individual functions, utilities, and pure logic in isolation.
    framework: Vitest
    location_pattern: "**/*.test.ts, **/*.spec.ts"
    
    scope:
      - utility_functions
      - validation_schemas
      - transformers
      - hooks_logic
      - pure_components

    scope_paths:
      utility_functions: packages/*/src/utils/**
      validation_schemas: packages/types/src/**
      transformers: data transformation functions
      hooks_logic: custom hook logic (not React rendering)
      pure_components: components without side effects

    characteristics:
      no_external_dependencies: mock all externals
      fast_execution: less than 100ms per test
      isolated: no shared state between tests
      deterministic: same input equals same output

    patterns:
      arrange_act_assert:
        description: Standard test structure
        example_code: |
          describe('slugify', () => {
            it('should convert spaces to hyphens', () => {
              const input = 'Hello World';
              const result = slugify(input);
              expect(result).toBe('hello-world');
            });
          });

      table_driven:
        description: Parameterized testing
        example_code: |
          describe('validateEmail', () => {
            const cases = [
              { input: 'valid@email.com', expected: true },
              { input: 'invalid', expected: false },
            ];
            it.each(cases)('validates $input', ({ input, expected }) => {
              expect(validateEmail(input)).toBe(expected);
            });
          });

    coverage:
      target: ">= 80%"
      enforcement: CI failure if below threshold
      excluded_patterns:
        - "*.config.*"
        - "*.d.ts"
        - index_reexports

  # ---------------------------------------------------------------------------
  # Component Tests
  # ---------------------------------------------------------------------------
  component:
    description: Test React components in isolation with mocked dependencies.
    framework: Vitest with Testing Library
    location_pattern: "**/*.test.tsx"

    scope:
      - ui_components
      - page_components
      - form_components

    scope_paths:
      ui_components: packages/ui/src/components/**
      page_components: apps/*/src/components/**
      form_components: form behavior and validation

    characteristics:
      render_in_isolation: no full app context
      test_user_behavior: not implementation
      accessible_queries: use accessible selectors
      mock_api_calls: no real network requests

    query_priority:
      - getByRole (most accessible)
      - getByLabelText (form elements)
      - getByText (static content)
      - getByTestId (last resort)

    patterns:
      user_centric:
        description: Test from user perspective
        example_code: |
          describe('Button', () => {
            it('calls onClick when clicked', async () => {
              const handleClick = vi.fn();
              render(<Button onClick={handleClick}>Click</Button>);
              await userEvent.click(screen.getByRole('button'));
              expect(handleClick).toHaveBeenCalledOnce();
            });
          });

  # ---------------------------------------------------------------------------
  # Integration Tests
  # ---------------------------------------------------------------------------
  integration:
    description: Test API routes and database operations together.
    framework: Vitest with Supertest
    location_pattern: "apps/*/src/**/*.integration.test.ts"

    scope:
      - api_routes
      - database_operations
      - auth_flows
      - cross_service

    scope_paths:
      api_routes: apps/admin/src/app/api/**
      database_operations: Prisma queries
      auth_flows: authentication and authorization
      cross_service: Admin API consumption

    characteristics:
      real_database: use test database
      real_prisma: no ORM mocking
      mock_externals: LLM APIs and external services
      transaction_isolation: rollback after each test

    patterns:
      api_route_testing:
        description: Test HTTP endpoints
        example_code: |
          describe('GET /api/public/projects', () => {
            it('returns only visible projects', async () => {
              const response = await request(app)
                .get('/api/public/projects')
                .expect(200);
              expect(response.body.data).toHaveLength(1);
            });
          });

    database_strategy:
      approach: test_database_with_transactions
      setup_steps:
        - create test database
        - run migrations
        - seed minimal fixtures
      cleanup_steps:
        - transaction rollback per test
        - truncate tables between suites

  # ---------------------------------------------------------------------------
  # End-to-End Tests
  # ---------------------------------------------------------------------------
  e2e:
    description: Test complete user journeys through the browser.
    framework: Playwright
    location_pattern: "e2e/**/*.spec.ts"

    scope:
      - critical_user_journeys
      - cross_app_flows
      - visual_regression_optional

    characteristics:
      real_browser: Chromium, Firefox, WebKit
      real_backend: running services
      real_database: test data seeded
      network_isolation: mock external LLM APIs

    journeys:
      public_portfolio:
        browse_projects:
          priority: critical
          steps:
            - visit home page
            - click on projects link
            - filter by category
            - click on project card
            - verify context sections render

        guestbook_interaction:
          priority: high
          steps:
            - visit guestbook page
            - sign in with Google (mocked)
            - submit entry
            - verify entry appears
            - add reaction

        chatbot_conversation:
          priority: high
          steps:
            - open chatbot
            - send message
            - verify response appears
            - click suggested link

      admin_dashboard:
        project_crud:
          priority: critical
          steps:
            - sign in as admin
            - create new project
            - add context sections
            - verify project in list
            - edit project
            - delete project

        content_moderation:
          priority: medium
          steps:
            - view guestbook entries
            - toggle visibility
            - delete entry
            - verify changes

      links_hub:
        view_links:
          priority: low
          steps:
            - visit links page
            - verify links render
            - click external link

      ngl_app:
        submit_message:
          priority: medium
          steps:
            - visit NGL page
            - type message
            - submit
            - verify success confirmation

    configuration:
      browsers:
        - chromium
        - firefox
        - webkit_optional
      parallelism: 4 workers
      retries_on_ci: 2
      timeouts:
        action: 10s
        navigation: 30s
        expect: 5s

  # ---------------------------------------------------------------------------
  # API Contract Tests
  # ---------------------------------------------------------------------------
  contract:
    description: Verify API responses match TypeScript contracts.
    framework: Vitest with Zod
    location_pattern: "packages/sdk/**/*.contract.test.ts"

    scope:
      - response_shapes
      - error_formats
      - pagination_meta

    patterns:
      response_validation:
        description: Validate response against schema
        example_code: |
          describe('Projects API Contract', () => {
            it('returns valid ProjectDTO', async () => {
              const response = await sdk.getProjects();
              const result = ProjectListResponseSchema.safeParse(response);
              expect(result.success).toBe(true);
            });
          });


# -----------------------------------------------------------------------------
# AUTOMATION
# -----------------------------------------------------------------------------
automation:

  # ---------------------------------------------------------------------------
  # CI Pipeline
  # ---------------------------------------------------------------------------
  ci:
    stages:
      unit_and_component:
        name: Unit and Component Tests
        command: pnpm test:unit
        parallel: true
        required: true

      integration:
        name: Integration Tests
        command: pnpm test:integration
        parallel: false
        required: true
        needs: test_database

      e2e:
        name: E2E Tests
        command: pnpm test:e2e
        parallel: true
        required: true
        needs: running_services

    triggers:
      - push_to_any_branch
      - pull_request_to_main

    failure_policy:
      block_merge: true
      notify_slack: optional
      create_issue_for_flaky: true

  # ---------------------------------------------------------------------------
  # Test Commands
  # ---------------------------------------------------------------------------
  commands:
    all:
      command: pnpm test
      description: Run all tests

    unit:
      command: pnpm test:unit
      description: Run unit and component tests only

    integration:
      command: pnpm test:integration
      description: Run integration tests only

    e2e:
      command: pnpm test:e2e
      description: Run E2E tests only

    coverage:
      command: pnpm test:coverage
      description: Run tests with coverage report

    watch:
      command: pnpm test:watch
      description: Run tests in watch mode for development

  # ---------------------------------------------------------------------------
  # Coverage Configuration
  # ---------------------------------------------------------------------------
  coverage:
    tool: v8 via Vitest
    
    thresholds:
      statements: 70
      branches: 70
      functions: 70
      lines: 70

    reporting:
      formats:
        - text_console_output
        - lcov_for_ci
        - html_for_local

    ignored_patterns:
      - "**/*.config.*"
      - "**/*.d.ts"
      - "**/index.ts"
      - "e2e/**"
      - "**/__mocks__/**"

  # ---------------------------------------------------------------------------
  # Test Data Management
  # ---------------------------------------------------------------------------
  test_data:
    strategy: fixtures_and_factories

    fixtures:
      location: tests/fixtures/**
      format: TypeScript objects
      scope: static reusable data

    factories:
      location: tests/factories/**
      library: "@faker-js/faker"
      scope: dynamic randomized data

    seeding:
      command: pnpm db:seed:test
      scope: minimal data for E2E
      reset_timing: before each E2E run


# -----------------------------------------------------------------------------
# OWNERSHIP
# -----------------------------------------------------------------------------
ownership:

  # ---------------------------------------------------------------------------
  # Responsibility Matrix
  # ---------------------------------------------------------------------------
  responsibility:
    developer:
      - write unit tests for new code
      - write component tests for new components
      - write integration tests for new API routes
      - maintain tests when refactoring
      - fix broken tests immediately

    reviewer:
      - verify test coverage for new features
      - check test quality and patterns
      - ensure no test anti-patterns

    ci_system:
      - run all tests on every push
      - enforce coverage thresholds
      - report failures clearly

    maintainer:
      - monitor test health over time
      - remove or fix flaky tests
      - update test infrastructure

  # ---------------------------------------------------------------------------
  # Test Review Checklist
  # ---------------------------------------------------------------------------
  review_checklist:
    - tests_exist_for_new_functionality
    - tests_cover_happy_path_and_edge_cases
    - tests_are_readable_and_maintainable
    - no_implementation_details_tested
    - appropriate_test_level_used
    - no_flaky_patterns_introduced
    - mocks_are_minimal_and_necessary

  # ---------------------------------------------------------------------------
  # Flaky Test Policy
  # ---------------------------------------------------------------------------
  flaky_tests:
    definition: Test that fails intermittently without code changes
    
    detection:
      - CI reports same test failing sporadically
      - Test passes locally but fails in CI
      - Test requires specific timing or ordering

    response:
      immediate:
        - quarantine test with ticket reference
        - create issue with flaky label
      resolution:
        - investigate root cause
        - fix or delete within 1 week
        - document learnings

    prevention:
      - avoid timing-dependent assertions
      - use proper async await
      - isolate test state
      - use stable selectors
