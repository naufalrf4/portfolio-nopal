current_state:
  root:
    ci: no CI workflow files found (no `.github/`)
    shared_test_command: none
    build: 'bun run build (bun --filter chain over admin/public-astro/links-astro/ngl-svelte/rag-service; excludes live-presence)'
    lint: 'bun run lint (admin + ngl-svelte filters)'
    typecheck: 'bun run typecheck (admin + ngl-svelte + rag-service filters)'
  admin:
    evidence:
      - bun run typecheck
      - bun run build
      - bun run lint
    missing:
      - no dedicated automated test script in apps/admin/package.json
  public_astro:
    evidence:
      - bun run build
    missing:
      - no lint script
      - no automated test script
  links_astro:
    evidence:
      - bun run build
    missing:
      - no lint script
      - no automated test script
  ngl_svelte:
    evidence:
      - bun run check
      - bun run lint
      - bun run build
    missing:
      - no dedicated automated test runner in manifest
  live_presence:
    evidence:
      - bun run start
      - /health manual verification
      - websocket/manual QA per app-local AGENTS.md
    missing:
      - no build script
      - no lint script
      - no automated test runner in manifest
  rag_service:
    evidence:
      - cd apps/rag-service && bun test (src/llm-provider.test.ts, src/agentic-tools.test.ts)
      - cd apps/rag-service && bun x tsc --noEmit
      - cd apps/rag-service && bun run build
    missing:
      - no lint script in manifest
  e2e_suite:
  evidence:
    - bun run test:e2e (root, e2e/runner.ts - starts only the services each feature needs, reuses ones already up, stops what it started)
    - bun run test:e2e <feature> (single feature, e.g. admin-cron)
    - bun run test:e2e:specs (services already running, orchestration skipped)
    - bun run --cwd e2e typecheck
  layout:
    - e2e/features/<feature>/manifest.ts declares name + required services (runner imports this, no side effects)
    - e2e/features/<feature>/<feature>.spec.ts holds the checks and re-exports the manifest
    - e2e/helpers/{env,http,ws,services}.ts are shared; env.ts loads .env.docker.dev + app .env files and maps ADMIN_* to *
  covers:
    - admin-auth - admin tier gated, POST /api/v1/admin/messages never reaches handler unauthenticated
    - admin-cron - cleanup-chatlogs fail-closed without valid bearer secret
    - public-write - contact/analytics/guestbook schema bounds
    - ip-spoofing - client forwarding headers cannot dictate trusted client IP
    - presence - origin enforcement, oversized frames ignored, /health only {ok:true}
    - rag-chat - ingest auth, chat input bounds, agentic guardrails
    - webhook - unsigned payload rejected, body size capped
  skips_by_design:
    - specs needing CRON_SECRET or PORTFOLIO_WEBHOOK_SECRET skip with the reason printed when unset
    - webhook server is not started by the runner
    - ipHash HMAC output (needs DB read), presence participant caps (needs load harness), real Google OAuth
  not_in_scope:
    - no browser/Playwright, no CI workflow - this suite is a local pre-deploy gate only

shared_packages:
    evidence:
      - cd packages/http && bun test (packages/http/__tests__/index.test.ts)
      - cd packages/contracts && bun test (packages/contracts/__tests__/drift-check.test.ts)

quality_gates_for_future_work:
  - Run the narrowest app-local verification that the touched app actually defines.
  - Do not invent missing lint or test commands; document the gap if the app lacks them.
  - For cross-app boundary changes, verify both the producer app and at least one consumer app build or typecheck path.
  - For security-sensitive changes, verify auth and API boundary behavior in addition to compile/build checks.

critical_paths:
  - Admin auth gating and admin-only dashboard routes.
  - Admin public APIs consumed by Astro and Svelte apps.
  - Live websocket presence compatibility between `apps/public-astro` and `apps/live-presence`.
  - RAG `/chat`, `/chat/confirm`, and `/ingest` contract compatibility (TS/Hono runtime).
  - Public write flows using Turnstile and service-to-service tokens.
