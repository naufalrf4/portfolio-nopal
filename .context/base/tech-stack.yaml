repository:
  name: naufalrf-portfolio
  type: root-shell
  runtime:
    node: '>=22.0.0'
  package_manager: Bun workspaces at root; single root `bun.lock` is the only lockfile (app-level `bun.lock` files were removed)
  version_sources:
    - package manifests in each app
    - root `bun.lock`
  root_scripts:
    - dev / dev:all -> `bash ./start-dev.sh` (six local services)
    - build -> `NODE_OPTIONS=--max-old-space-size=4096 bun run --filter admin build && ... --filter public-astro/links-astro/ngl-svelte build && bun run --filter rag-service build` (covers all apps including rag-service)
    - lint -> `bun run --filter admin lint && bun run --filter ngl-svelte lint`
    - typecheck -> `bun run --filter admin typecheck && bun run --filter ngl-svelte typecheck && bun run --filter rag-service typecheck` (3 filters)
    - reset:seed -> `bash ./scripts/docker-dev-reset-seed.sh`, exists and works
    - docker:dev / docker:dev:down / docker:dev:migrate / docker:dev:seed / docker:dev:reset-seed -> `scripts/docker-dev-*.sh`
    - docker:prod / docker:prod:migrate / docker:prod:bootstrap -> `scripts/docker-prod-*.sh`
    - lint-staged / commitlint hooks

apps:
  admin:
    path: apps/admin
    framework: Next.js 16.1.1
    language: TypeScript
    runtime: Bun + Node-compatible Next runtime
    styling: Tailwind CSS 4 + Radix UI/shadcn; `neu-*` utility names retained as naming layer over flat dark-first token values
    database: Drizzle ORM 0.45.1 + postgres 3.4.8 against the centralized Postgres
    auth: NextAuth 5 beta + Google OAuth allowlist
    testing_stack: typecheck + lint + build in manifest; no dedicated automated test script
    lockfile: none (root `bun.lock` only)
  public_astro:
    path: apps/public-astro
    framework: Astro 5.17.1 + React 19.2.4
    language: TypeScript
    runtime: Bun
    styling: Tailwind CSS 4 + dark-first design tokens + Framer Motion; shared Neu* components renamed to Card/Button/Badge/Input/Textarea
    data_access: Admin public API, including the Admin-proxied RAG chat flow
    testing_stack: build only in manifest; no lint or automated test script
    lockfile: none (root `bun.lock` only)
  links_astro:
    path: apps/links-astro
    framework: Astro 5.17.1 + React 19.2.4
    language: TypeScript
    runtime: Bun
    styling: Tailwind CSS 4 + dark-first design tokens; `neu-*` class names in markup resolve shared token values
    data_access: Admin public API only
    testing_stack: build only in manifest; no lint or automated test script
    lockfile: none (root `bun.lock` only)
  ngl_svelte:
    path: apps/ngl-svelte
    framework: SvelteKit 2.50.2 + Svelte 5.51.0
    language: TypeScript
    runtime: Bun + Vite
    styling: Tailwind CSS 4 + dark-first design tokens
    data_access: Admin public API only
    testing_stack: svelte-check + eslint + prettier; no dedicated automated test runner
    lockfile: none (root `bun.lock` only)
  live_presence:
    path: apps/live-presence
    framework: Bun native server/websocket runtime
    language: TypeScript
    runtime: Bun
    styling: none
    data_access: no database or Admin API access; ephemeral websocket rooms only
    testing_stack: no build, lint, or automated test script; app-local AGENTS directs verification through `bun run start`, `/health`, and websocket QA
    lockfile: none (root `bun.lock` only)
  rag_service:
    path: apps/rag-service
    framework: TypeScript on Bun + Hono (rewritten from Python FastAPI, commit 907aef6)
    language: TypeScript
    runtime: Bun
    data_access: direct Postgres/pgvector access via `postgres` (postgres.js) on the `rag` schema
    ai_stack: multi-provider (openai-compatible default, Gemini as alternate) via `src/llm-provider.ts`, configurable models/embedding
    database_bootstrap: `bun run db:bootstrap` (src/db-bootstrap.ts) creates rag schema + vector extension
    testing_stack: `bun test` (`src/llm-provider.test.ts`, `src/agentic-tools.test.ts`), `bun x tsc --noEmit`, `bun run build`
    lockfile: none (root `bun.lock` only)

shared_tooling:
  root_hooks:
    - Husky pre-commit
    - Husky commit-msg
    - lint-staged
    - root ESLint config
  ci: no `.github/workflows` directory found
  deploy:
    - GitHub webhook pull-based deploy: `scripts/github_webhook_server.py` (HMAC-verified) -> `scripts/github-webhook-deploy.sh` (fetch/checkout/pull + docker-prod-up + docker-prod-migrate)
    - Docker/Dokploy: `docker-compose.prod.yml` runs all services; production Postgres is a Dokploy-managed `pgvector/pgvector` container (`DB_HOST:-db`)
