repository:
  name: naufalrf-portfolio
  type: root-shell
  runtime:
    node: '>=22.0.0'
  package_manager: none-at-root
  version_sources:
    - package manifests in each app
    - app-local lockfiles (`bun.lock`, `uv.lock`)

apps:
  admin:
    path: apps/admin
    framework: Next.js 16.1.1
    language: TypeScript
    runtime: Bun + Node-compatible Next runtime
    styling: Tailwind CSS 4 + Radix UI + custom neumorphic utility classes
    database: Drizzle ORM 0.45.1 + postgres 3.4.8 against centralized Neon/Postgres
    auth: NextAuth 5 beta + Google OAuth allowlist
    testing_stack: typecheck only evidenced in manifest; no dedicated test script found
    lockfile: apps/admin/bun.lock
  public_astro:
    path: apps/public-astro
    framework: Astro 5.17.1 + React 19.2.4
    language: TypeScript
    runtime: Bun
    styling: Tailwind CSS 4 + neumorphic React/Astro components + Framer Motion
    data_access: Admin public API + direct browser/server fetch to RAG service for chat
    testing_stack: no lint or test script found in manifest
    lockfile: apps/public-astro/bun.lock
  links_astro:
    path: apps/links-astro
    framework: Astro 5.17.1 + React 19.2.4
    language: TypeScript
    runtime: Bun
    styling: Tailwind CSS 4 + neumorphic Astro components
    data_access: Admin public API only
    testing_stack: no lint or test script found in manifest
    lockfile: apps/links-astro/bun.lock
  ngl_svelte:
    path: apps/ngl-svelte
    framework: SvelteKit 2.50.2 + Svelte 5.51.0
    language: TypeScript
    runtime: Bun + Vite
    styling: Tailwind CSS 4 + custom neumorphic utility classes
    data_access: Admin public API only
    testing_stack: svelte-check + eslint + prettier; no dedicated automated test runner found
    lockfile: apps/ngl-svelte/bun.lock
  live_presence:
    path: apps/live-presence
    framework: Bun native server/websocket runtime
    language: TypeScript
    runtime: Bun
    styling: none
    data_access: no database or Admin API access; ephemeral websocket rooms only
    testing_stack: no build, lint, or automated test script found; app-local AGENTS directs verification through `bun run start`, `/health`, and websocket QA
    lockfile: no lockfile found
  rag_service:
    path: apps/rag-service
    framework: FastAPI >=0.115,<1 with Uvicorn
    language: Python 3.12+
    wrapper_runtime: Bun scripts shelling into `fastapi/`
    data_access: direct Postgres/pgvector access via SQLAlchemy async engine
    ai_stack: Google Gemini via `google-genai`
    testing_stack: pytest + pytest-asyncio + ruff in `fastapi/pyproject.toml`
    lockfile: apps/rag-service/fastapi/uv.lock

shared_tooling:
  root_hooks:
    - Husky pre-commit
    - Husky commit-msg
    - lint-staged
    - root ESLint config
  ci: no `.github/workflows` directory found
