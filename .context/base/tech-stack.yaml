---
# Tech Stack — Migration Target
# Source of truth: AGENTS.md
# This file describes the TARGET stack (post-migration), not the legacy codebase.

project: naufalrf-portfolio
type: personal-portfolio-monorepo

monorepo:
  tooling: pnpm workspaces (native)
  package_manager: pnpm
  pnpm_version: '>=9.0.0'
  no_turborepo: true

runtime:
  node_version: '22 LTS'
  python_version: '3.12'

applications:
  apps/admin:
    framework: Next.js 14+ App Router
    port: 3001
    auth: NextAuth v5 + Google OAuth
    db_access: Direct Drizzle ORM
    language: TypeScript 5.x strict

  apps/public:
    framework: Astro SSR
    port: 3000
    auth: Lucia Auth v3 + Google OAuth
    db_access: Admin API (SDK)
    language: TypeScript 5.x strict

  apps/links:
    framework: Astro SSR
    port: 3002
    auth: None
    db_access: Admin API (read-only, SDK)
    language: TypeScript 5.x strict

  apps/ngl:
    framework: SvelteKit
    port: 3003
    auth: None
    db_access: Admin API (write-only, SDK)
    language: TypeScript 5.x strict

  apps/rag-service:
    framework: Python FastAPI + uvicorn
    port: 3004
    auth: X-Service-Token header
    db_access: Admin API + pgvector
    language: Python 3.12 (type hints throughout)
    dependency_manager: uv

shared_packages:
  packages/ui:
    contents: Shared React components (Neumorphism + shadcn/ui base)
  packages/types:
    contents: TypeScript DTOs, enums, API contracts
  packages/sdk:
    contents: Typed API clients (used by all non-admin apps)
  packages/config:
    contents: Shared ESLint, TypeScript, Tailwind configs
  packages/auth:
    contents: Shared NextAuth v5 config (DrizzleAdapter)

database:
  engine: PostgreSQL (Neon — serverless)
  orm: Drizzle ORM
  driver: postgres.js
  vector_extension: pgvector
  schema_location: apps/admin/db/schema.ts
  migrations_location: apps/admin/db/migrations/
  drizzle_config: apps/admin/drizzle.config.ts
  access_boundary: ONLY apps/admin connects directly; all others use Admin API

storage:
  primary_db: PostgreSQL on Neon (serverless)
  vector_store: pgvector (PostgreSQL extension — NOT a separate service)

auth:
  admin:
    library: NextAuth v5
    provider: Google OAuth
    adapter: DrizzleAdapter
    session: database sessions
  public:
    library: Lucia Auth v3 + arctic
    provider: Google OAuth
    session: cookies via Astro middleware

frameworks:
  web:
    admin: Next.js 14+ App Router
    public: Astro SSR (node adapter)
    links: Astro SSR (node adapter)
    ngl: SvelteKit (node adapter)
  backend_service:
    rag: FastAPI (Python 3.12) + uvicorn

ai:
  embeddings:
    provider: OpenAI
    model: text-embedding-3-small
    dimensions: 1536
  llm:
    primary: configurable (PRIMARY_LLM env var)
    fallback: configurable (FALLBACK_LLM env var)
    supported_providers: [openai, gemini, groq]
  vector_search: pgvector (cosine similarity)
  no_langchain: true

ui:
  design_system:
    theme: neumorphism
    color_mode: light_only
    background: '#E0E5EC'
    text: '#3D4852'
    accent: '#6C63FF'
    shadow_system: dual (extruded + inset)
  typography:
    font_sans: Plus Jakarta Sans
    font_ui: DM Sans
    font_mono: JetBrains Mono
  component_base: shadcn/ui (modified for Neumorphism)
  css_framework: Tailwind CSS

forms:
  library: react-hook-form
  validation: zod
  resolver: '@hookform/resolvers/zod'

state:
  client: Zustand or React context (feature-scoped, if needed)

analytics:
  provider: Google Analytics 4

notifications:
  provider: Telegram Bot API

ci_cd:
  commands:
    lint: pnpm lint
    typecheck: pnpm typecheck
    test: pnpm test
    build: pnpm build
  no_turbo_cache: true

dockerfile_pattern:
  base: node:22-alpine
  python_base: python:3.12-slim
