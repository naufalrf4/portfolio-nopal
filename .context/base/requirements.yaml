mode: init
functional_requirements:
  - Keep the repository as a shell for standalone apps under `apps/*`.
  - Maintain `apps/admin` as the primary dashboard, content authority, and API authority.
  - Route all `public-astro`, `links-astro`, and `ngl-svelte` data access through Admin HTTP APIs.
  - Allow direct database access only for `apps/admin` and `apps/rag-service`, with RAG scoped to its approved retrieval and ingest responsibilities.
  - Preserve page, component, and overall design direction from `../naufalrf-portfolio-phase2` across the unfinished apps.

quality_attributes:
  - Favor explicit service boundaries over convenience cross-calls.
  - Favor security hardening over permissive defaults.
  - Document only repo-evidenced or user-confirmed truths.
  - Keep commands and workflow instructions app-local when the root does not define a shared command.

non_goals:
  - Do not invent a shared workspace package manager flow at the root.
  - Do not add speculative feature requirements that are not evidenced yet.
  - Do not move non-admin frontend apps to direct database access.

forbidden_changes:
  - No direct Neon/Postgres access from `apps/public-astro`, `apps/links-astro`, or `apps/ngl-svelte`.
  - No design reset that discards the legacy phase2 neumorphic baseline without explicit user direction.
  - No silent expansion of root-level commands beyond what manifests and docs currently define.
