# Development Plan

# =============================================================================
# PHASED DEVELOPMENT ROADMAP
# =============================================================================
# Defines the execution phases, milestones, and dependencies for building
# the NaufalRF Portfolio Ecosystem from inception to production.
# =============================================================================

# -----------------------------------------------------------------------------
# PLANNING ASSUMPTIONS
# -----------------------------------------------------------------------------
assumptions:
  team_size: 1 developer (solo project)
  availability: part-time (15 hours/week)
  timeline: flexible, milestone-driven
  approach: iterative with working software at each phase
  priority: functional core first, polish later


# -----------------------------------------------------------------------------
# PHASE 0: FOUNDATION
# -----------------------------------------------------------------------------
phases:

  - name: Foundation
    id: phase-0
    description: Establish monorepo structure, tooling, and shared infrastructure.
    duration_estimate: 1-2 weeks
    
    objectives:
      - Set up Turborepo monorepo with pnpm workspaces
      - Configure shared TypeScript, ESLint, and Prettier
      - Create shared packages structure
      - Set up Docker development environment
      - Configure Git hooks and commit conventions

    milestones:
      - id: M0.1
        name: Monorepo Initialization
        deliverables:
          - pnpm workspace configuration
          - Turborepo pipeline setup
          - Root package.json with workspace scripts
        acceptance: pnpm install and pnpm build work from root

      - id: M0.2
        name: Shared Config Package
        deliverables:
          - packages/config with ESLint config
          - packages/config with TypeScript base config
          - packages/config with Tailwind config
          - packages/config with Prettier config
        acceptance: All configs importable by apps

      - id: M0.3
        name: Shared Types Package
        deliverables:
          - packages/types with base DTOs
          - packages/types with API response types
          - packages/types with enum definitions
        acceptance: Types importable with proper autocomplete

      - id: M0.4
        name: Development Environment
        deliverables:
          - docker-compose.yaml for local services
          - Local PostgreSQL container
          - Local Qdrant container
          - .env.example templates
        acceptance: docker compose up starts all services

      - id: M0.5
        name: Git Configuration
        deliverables:
          - Husky pre-commit hooks
          - lint-staged configuration
          - commitlint with conventional commits
          - GitHub repository setup
        acceptance: Commits are validated, staged files are linted

    dependencies: none
    risks:
      - Turborepo configuration complexity
      - pnpm workspace resolution issues
    mitigations:
      - Follow official Turborepo examples
      - Test package linking early


  # ---------------------------------------------------------------------------
  # PHASE 1: ADMIN CORE
  # ---------------------------------------------------------------------------
  - name: Admin Core
    id: phase-1
    description: Build the Admin Dashboard with authentication, database, and core CRUD APIs.
    duration_estimate: 2-3 weeks
    
    objectives:
      - Set up Next.js Admin app with App Router
      - Configure Prisma with Neon PostgreSQL
      - Implement Google OAuth with NextAuth
      - Build core data models and migrations
      - Create admin CRUD API endpoints
      - Build basic admin dashboard UI

    milestones:
      - id: M1.1
        name: Admin App Scaffold
        deliverables:
          - apps/admin Next.js app with App Router
          - Tailwind CSS configuration
          - shadcn/ui installation
          - Basic layout with navigation
        acceptance: App runs at localhost:3001

      - id: M1.2
        name: Database Setup
        deliverables:
          - Prisma schema with core models
          - User, Project, ProjectContext models
          - BlogLink, GuestbookEntry models
          - AnonymousMessage, ChatLog models
          - ProfileLink, KnowledgeDoc models
          - Initial migration
        acceptance: prisma migrate dev succeeds

      - id: M1.3
        name: Authentication
        deliverables:
          - NextAuth configuration
          - Google OAuth provider
          - Admin allowlist enforcement
          - Role assignment (admin/user)
          - Session management
          - packages/auth shared config
        acceptance: Only allowlisted emails get admin role

      - id: M1.4
        name: Admin API - Projects
        deliverables:
          - GET /api/admin/projects (list)
          - GET /api/admin/projects/:id (detail)
          - POST /api/admin/projects (create)
          - PUT /api/admin/projects/:id (update)
          - DELETE /api/admin/projects/:id (delete)
          - Zod validation schemas
        acceptance: Full CRUD works via API client

      - id: M1.5
        name: Admin API - Context Sections
        deliverables:
          - CRUD endpoints for ProjectContext
          - Ordering support
          - Type enum enforcement
        acceptance: Context sections linked to projects

      - id: M1.6
        name: Admin Dashboard UI - Projects
        deliverables:
          - Projects list table with actions
          - Project create/edit form
          - Context section management UI
          - Visibility toggle
          - Drag-and-drop ordering (optional)
        acceptance: Full project management via UI

      - id: M1.7
        name: Public Read API
        deliverables:
          - GET /api/public/projects
          - GET /api/public/projects/:slug
          - Pagination support
          - Only visible items returned
        acceptance: Public endpoints work without auth

    dependencies:
      - phase-0

    risks:
      - Neon connection issues in development
      - NextAuth v5 beta stability
    mitigations:
      - Use local PostgreSQL for development
      - Pin NextAuth version, test thoroughly


  # ---------------------------------------------------------------------------
  # PHASE 2: PUBLIC PORTFOLIO
  # ---------------------------------------------------------------------------
  - name: Public Portfolio
    id: phase-2
    description: Build the public-facing portfolio website consuming Admin APIs.
    duration_estimate: 2-3 weeks
    
    objectives:
      - Set up Next.js Public app with App Router
      - Implement SDK for Admin API consumption
      - Build home page with featured projects
      - Build projects listing and detail pages
      - Implement dynamic context section rendering
      - Add curated blogs display

    milestones:
      - id: M2.1
        name: Public App Scaffold
        deliverables:
          - apps/public Next.js app
          - Tailwind CSS with playful geometric theme
          - packages/ui shared components
          - Layout with navigation
        acceptance: App runs at localhost:3000

      - id: M2.2
        name: SDK Package
        deliverables:
          - packages/sdk with typed API client
          - Admin public API client
          - Error handling utilities
          - Response type inference
        acceptance: SDK provides full type safety

      - id: M2.3
        name: Home Page
        deliverables:
          - Hero section with positioning
          - Featured projects grid
          - Navigation to all sections
          - Responsive design
        acceptance: Page loads with SSR, content from API

      - id: M2.4
        name: Projects Listing
        deliverables:
          - Projects page with grid layout
          - Category filter
          - Depth indicator (context count)
          - Pagination
          - Project cards with hover effects
        acceptance: Filter and pagination work correctly

      - id: M2.5
        name: Project Detail
        deliverables:
          - Dynamic route /projects/:slug
          - Context section renderer
          - Section type styling
          - Navigation between projects
          - Related projects (optional)
        acceptance: All context types render correctly

      - id: M2.6
        name: Blog Links
        deliverables:
          - Admin CRUD for blog links
          - Metadata fetching from URLs
          - Public blog links page
          - Card display with thumbnails
        acceptance: Blog links display with fetched metadata

      - id: M2.7
        name: UI Polish
        deliverables:
          - Playful geometric design system
          - Animations with Framer Motion
          - Dark mode support
          - Accessibility review
        acceptance: Lighthouse score > 90

    dependencies:
      - phase-1

    risks:
      - API response time affecting SSR
      - Design complexity
    mitigations:
      - Implement caching strategies
      - Use design system constraints


  # ---------------------------------------------------------------------------
  # PHASE 3: INTERACTIVE FEATURES
  # ---------------------------------------------------------------------------
  - name: Interactive Features
    id: phase-3
    description: Add guestbook, anonymous feedback, and links hub applications.
    duration_estimate: 2 weeks
    
    objectives:
      - Build authenticated guestbook with reactions
      - Build anonymous feedback submission (NGL)
      - Build lightweight links hub
      - Implement rate limiting for public writes

    milestones:
      - id: M3.1
        name: Guestbook Backend
        deliverables:
          - POST /api/public-write/guestbook (auth required)
          - Reaction support in data model
          - Admin moderation endpoints
          - Rate limiting middleware
        acceptance: Authenticated users can post, rate limited

      - id: M3.2
        name: Guestbook Frontend
        deliverables:
          - Guestbook page in public app
          - Google sign-in integration
          - Entry display with reactions
          - Post form with validation
        acceptance: Full guestbook flow works

      - id: M3.3
        name: NGL App
        deliverables:
          - apps/ngl Next.js app
          - Anonymous message form
          - Rate limiting (IP-based)
          - Success confirmation
          - Admin inbox in dashboard
        acceptance: Messages appear in admin, rate limited

      - id: M3.4
        name: Links Hub
        deliverables:
          - apps/links Next.js app
          - Profile links display
          - Admin CRUD for profile links
          - Minimal, fast design
        acceptance: Links load from API, open correctly

      - id: M3.5
        name: Rate Limiting Infrastructure
        deliverables:
          - Rate limit middleware for public-write
          - IP-based tracking
          - 429 responses with retry-after
          - Admin visibility into limits
        acceptance: Abuse attempts are blocked

    dependencies:
      - phase-2

    risks:
      - Rate limiting evasion
      - Auth state management across apps
    mitigations:
      - Implement IP hashing, consider CAPTCHA
      - Use shared auth package


  # ---------------------------------------------------------------------------
  # PHASE 4: RAG CHATBOT
  # ---------------------------------------------------------------------------
  - name: RAG Chatbot
    id: phase-4
    description: Build the conversational RAG service with LLM routing and vector search.
    duration_estimate: 3-4 weeks
    
    objectives:
      - Set up Node.js RAG service with Fastify
      - Implement vector storage with Qdrant
      - Build ingestion pipeline
      - Implement LLM routing with fallback
      - Add session memory with pruning
      - Integrate chat UI in public portfolio

    milestones:
      - id: M4.1
        name: RAG Service Scaffold
        deliverables:
          - apps/rag-service Node.js app
          - Fastify server setup
          - Health check endpoint
          - Docker configuration
        acceptance: Service runs and responds to health checks

      - id: M4.2
        name: Vector Store Integration
        deliverables:
          - Qdrant client setup
          - Collection creation
          - Embedding generation (OpenAI)
          - Similarity search implementation
        acceptance: Can store and retrieve embeddings

      - id: M4.3
        name: Ingestion Pipeline
        deliverables:
          - Content fetch from Admin API
          - Document chunking
          - Embedding generation
          - Qdrant indexing
          - Internal trigger endpoint
        acceptance: Admin can trigger ingestion

      - id: M4.4
        name: LLM Integration
        deliverables:
          - LangChain.js setup
          - Provider clients (Gemini, Groq, OpenAI, DeepSeek)
          - Primary/fallback routing
          - Environment-based selection
        acceptance: Fallback works when primary fails

      - id: M4.5
        name: Chat Endpoint
        deliverables:
          - POST /chat endpoint
          - RAG chain implementation
          - Session memory storage
          - Context pruning for long sessions
          - Deep link extraction
        acceptance: Conversational responses with context

      - id: M4.6
        name: Chat Log Forwarding
        deliverables:
          - Internal API to Admin for logs
          - Async log forwarding
          - Failure resilience
        acceptance: Logs appear in admin dashboard

      - id: M4.7
        name: Chat UI Integration
        deliverables:
          - Floating chatbot component
          - Message display
          - Typing indicators
          - Deep link rendering
          - Session persistence
        acceptance: Full chat experience in public portfolio

    dependencies:
      - phase-3

    risks:
      - LLM API rate limits
      - Context window management
      - Embedding costs
    mitigations:
      - Implement caching, use fallback
      - Aggressive pruning strategy
      - Batch embeddings, cache results


  # ---------------------------------------------------------------------------
  # PHASE 5: INFRASTRUCTURE & DEPLOYMENT
  # ---------------------------------------------------------------------------
  - name: Infrastructure and Deployment
    id: phase-5
    description: Set up production infrastructure, CI/CD, and deploy to production.
    duration_estimate: 1-2 weeks
    
    objectives:
      - Configure Traefik reverse proxy
      - Set up Docker production builds
      - Implement CI/CD with GitHub Actions
      - Deploy to production VPS
      - Configure TLS with Let's Encrypt

    milestones:
      - id: M5.1
        name: Production Dockerfiles
        deliverables:
          - Multi-stage Dockerfile for each app
          - Optimized images (node:alpine)
          - Production docker-compose.yaml
        acceptance: All images build successfully

      - id: M5.2
        name: Traefik Configuration
        deliverables:
          - Traefik container setup
          - Host-based routing rules
          - TLS configuration with Let's Encrypt
          - Health check integration
        acceptance: All domains route correctly with HTTPS

      - id: M5.3
        name: CI Pipeline
        deliverables:
          - GitHub Actions workflow
          - Lint, typecheck, test, build stages
          - Docker image build and push
          - Caching for performance
        acceptance: CI runs on all PRs and pushes

      - id: M5.4
        name: CD Pipeline
        deliverables:
          - SSH deployment to VPS
          - Image pull and restart
          - Database migration step
          - Health verification
        acceptance: Push to main deploys to production

      - id: M5.5
        name: Production Deployment
        deliverables:
          - VPS provisioned and configured
          - Docker and Docker Compose installed
          - Environment variables configured
          - All services running
          - Domains pointed correctly
        acceptance: All apps accessible via production domains

      - id: M5.6
        name: Monitoring Setup
        deliverables:
          - Health check endpoints
          - Uptime monitoring (external service)
          - Basic alerting
          - Log aggregation (optional)
        acceptance: Downtime alerts work

    dependencies:
      - phase-4

    risks:
      - VPS configuration issues
      - TLS certificate challenges
      - Resource constraints
    mitigations:
      - Document server setup
      - Use HTTP-01 challenge
      - Monitor resource usage


  # ---------------------------------------------------------------------------
  # PHASE 6: POLISH & OPTIMIZATION
  # ---------------------------------------------------------------------------
  - name: Polish and Optimization
    id: phase-6
    description: Final polish, performance optimization, and documentation.
    duration_estimate: 1-2 weeks
    
    objectives:
      - Performance optimization
      - Accessibility audit and fixes
      - Security hardening
      - Documentation completion
      - Final testing

    milestones:
      - id: M6.1
        name: Performance Optimization
        deliverables:
          - Lighthouse audit and fixes
          - Image optimization
          - Bundle analysis
          - Caching improvements
        acceptance: All public pages score > 90

      - id: M6.2
        name: Accessibility Audit
        deliverables:
          - WCAG 2.1 AA compliance check
          - Keyboard navigation testing
          - Screen reader testing
          - Color contrast fixes
        acceptance: No critical accessibility issues

      - id: M6.3
        name: Security Hardening
        deliverables:
          - Security header configuration
          - Dependency audit fixes
          - Rate limiting verification
          - Secret exposure audit
        acceptance: No high/critical vulnerabilities

      - id: M6.4
        name: Documentation
        deliverables:
          - README files for all packages/apps
          - Architecture documentation review
          - Environment setup guide
          - Deployment runbook
        acceptance: New developer can set up project

      - id: M6.5
        name: Final Testing
        deliverables:
          - E2E test suite execution
          - Cross-browser testing
          - Mobile responsiveness check
          - Edge case testing
        acceptance: All critical paths work correctly

    dependencies:
      - phase-5

    risks:
      - Scope creep on polish
      - Diminishing returns
    mitigations:
      - Time-box polish activities
      - Focus on high-impact improvements


# -----------------------------------------------------------------------------
# DEPENDENCY GRAPH
# -----------------------------------------------------------------------------
dependency_graph:
  visualization: |
    Phase 0 (Foundation)
         │
         ▼
    Phase 1 (Admin Core)
         │
         ▼
    Phase 2 (Public Portfolio)
         │
         ▼
    Phase 3 (Interactive Features)
         │
         ▼
    Phase 4 (RAG Chatbot)
         │
         ▼
    Phase 5 (Infrastructure)
         │
         ▼
    Phase 6 (Polish)

  critical_path:
    - phase-0
    - phase-1
    - phase-2
    - phase-4
    - phase-5


# -----------------------------------------------------------------------------
# EFFORT ESTIMATES
# -----------------------------------------------------------------------------
effort_summary:
  total_estimated_weeks: 12-18
  breakdown:
    phase_0: 1-2 weeks
    phase_1: 2-3 weeks
    phase_2: 2-3 weeks
    phase_3: 2 weeks
    phase_4: 3-4 weeks
    phase_5: 1-2 weeks
    phase_6: 1-2 weeks

  notes:
    - Estimates assume 10-15 hours per week
    - Actual duration depends on complexity discoveries
    - Parallelization not possible for solo developer
    - Buffer recommended for unexpected issues


# -----------------------------------------------------------------------------
# SUCCESS CRITERIA
# -----------------------------------------------------------------------------
success_criteria:
  phase_completion:
    - All milestones delivered
    - Acceptance criteria met
    - No critical bugs remaining

  project_completion:
    - All 5 apps deployed and functional
    - All APIs documented and tested
    - CI/CD pipeline operational
    - Monitoring in place
    - Documentation complete

  quality_gates:
    - Lighthouse performance > 90
    - Zero high/critical vulnerabilities
    - Test coverage > 70%
    - All E2E tests passing
