root:
  install: '`bun install` at the root installs all apps + shared packages into the single root `bun.lock`. Per-app installs are unnecessary.'
  dev: 'bun run dev:all (alias `bun run dev`) -> `bash ./start-dev.sh`, starts all six local services'
  build: 'bun run build -> bun --filter chain over admin, public-astro, links-astro, ngl-svelte, and rag-service (covers all apps except live-presence)'
  test: no single root test command
  lint: 'bun run lint -> `bun run --filter admin lint && bun run --filter ngl-svelte lint`'
  typecheck: 'bun run typecheck -> `bun run --filter admin typecheck && bun run --filter ngl-svelte typecheck && bun run --filter rag-service typecheck` (3 filters)'
  hooks:
    pre_commit: bun run lint-staged
    commit_msg: bun run commitlint --edit "$1"
    lint_staged_config: .lintstagedrc.js
  helper_notes:
    - '`bun run dev:all` works, backed by `start-dev.sh` (six local services incl. live-presence).'
    - '`bun run reset:seed` -> `bash ./scripts/docker-dev-reset-seed.sh`, which exists and works; it is the same flow as `bun run docker:dev:reset-seed`.'
    - 'Docker dev: `bun run docker:dev` (+ `docker:dev:down`), bootstrap via `docker:dev:migrate` then `docker:dev:seed`; `docker:dev:reset-seed` resets Admin DB and reseeds.'
    - 'Docker prod: `bun run docker:prod` (up), `docker:prod:migrate`, `docker:prod:bootstrap`; production DB is a Dokploy-managed postgres service reachable at `DB_HOST:-db`.'
    - 'Deploy: GitHub webhook server (`scripts/github_webhook_server.py`, HMAC-verified, port 9010) triggers `scripts/github-webhook-deploy.sh` which pulls `main` and runs docker-prod-up + docker-prod-migrate. The last successful revision is recorded under `/var/lib/portfolio-webhook`; failed deploy retries compare against that revision. Pull-based only.'
app_commands:
  admin:
    install: none needed; root `bun install` covers it
    dev: cd apps/admin && bun run dev
    build: cd apps/admin && bun run build
    lint: cd apps/admin && bun run lint
    typecheck: cd apps/admin && bun run typecheck
    db:
      - cd apps/admin && bun run db:generate
      - cd apps/admin && bun run db:migrate
      - cd apps/admin && bun run db:push
      - cd apps/admin && bun run db:studio
      - cd apps/admin && bun run db:seed
  public_astro:
    install: none needed; root `bun install` covers it
    dev: cd apps/public-astro && bun run dev
    build: cd apps/public-astro && bun run build
    preview: cd apps/public-astro && bun run preview
    lint: not defined in manifest
    test: not defined in manifest
  links_astro:
    install: none needed; root `bun install` covers it
    dev: cd apps/links-astro && bun run dev
    build: cd apps/links-astro && bun run build
    preview: cd apps/links-astro && bun run preview
    lint: not defined in manifest
    test: not defined in manifest
  ngl_svelte:
    install: none needed; root `bun install` covers it
    dev: cd apps/ngl-svelte && bun run dev
    build: cd apps/ngl-svelte && bun run build
    check: cd apps/ngl-svelte && bun run check
    lint: cd apps/ngl-svelte && bun run lint
    test: no dedicated automated test runner in manifest
  live_presence:
    install: none needed; root `bun install` covers it
    dev: cd apps/live-presence && bun run dev
    start: cd apps/live-presence && bun run start
    build: not defined in manifest
    test: none; verify via /health + websocket QA per app-local AGENTS.md
  rag_service:
    install: none needed; root `bun install` covers it
    dev: cd apps/rag-service && bun run dev
    build: cd apps/rag-service && bun run build
    typecheck: cd apps/rag-service && bun x tsc --noEmit
    test: cd apps/rag-service && bun test
    lint: not defined in manifest
    db_bootstrap: cd apps/rag-service && bun run db:bootstrap
docker_commands:
  dev:
    up: bun run docker:dev
    down: bun run docker:dev:down
    migrate: bun run docker:dev:migrate
    seed: bun run docker:dev:seed
    reset_seed: bun run docker:dev:reset-seed
  prod:
    up: bun run docker:prod
    migrate: bun run docker:prod:migrate
    bootstrap: bun run docker:prod:bootstrap
  notes:
    - Use `.env.docker.dev` or `.env.docker.prod` copied from the committed examples before running compose wrappers.
    - `docker:dev:migrate` first runs `rag-bootstrap` (`bun run db:bootstrap` — rag schema + vector extension), then Admin `db:migrate`.
    - Dev compose mounts the whole repo (`.:/app`) with a shared `root-node-modules` volume; rag service runs the Bun TS stack, not the removed FastAPI runtime.
git_process:
  branch_strategy: not codified in current repo; default user's current branch unless explicitly told otherwise
  review_flow: not codified in current repo shell; do not assume auto-PR creation
  auto_commit: forbidden default
  auto_push: forbidden default
  push_identity: use only user's identity
  co_authors: forbidden unless user explicitly asks
  ignored_local_artifacts:
    - .agents/
    - .agent-workspace/
    - .agent-review/
    - .evals/
    - .reviews/
    - .opencode/
environment_rules:
  - Keep env files per app; do not introduce root runtime `.env`.
  - Use app-local `.env.example` files for variables; docker wrappers use `.env.docker.dev` / `.env.docker.prod`.
  - Treat service tokens and database URLs as secrets; never commit them.
