services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data-dev:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    working_dir: /app/apps/admin
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${ADMIN_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${ADMIN_PUBLIC_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_INTERNAL_API_TOKEN: ${ADMIN_INTERNAL_API_TOKEN}
      ADMIN_PUBLIC_API_ALLOWED_ORIGINS: ${ADMIN_PUBLIC_API_ALLOWED_ORIGINS}
      RAG_INGEST_SERVICE_TOKEN: ${RAG_INGEST_SERVICE_TOKEN}
      RAG_SERVICE_URL: http://rag:3005
      NODE_ENV: development
      PORT: 3001
      GCS_PROJECT_ID: ${ADMIN_GCS_PROJECT_ID}
      GCS_BUCKET_NAME: ${ADMIN_GCS_BUCKET_NAME}
      GCS_PUBLIC_BASE_URL: ${ADMIN_GCS_PUBLIC_BASE_URL}
      GCS_SERVICE_ACCOUNT_JSON: ${ADMIN_GCS_SERVICE_ACCOUNT_JSON}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${ADMIN_NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${ADMIN_TURNSTILE_SECRET_KEY}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${ADMIN_NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${ADMIN_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${ADMIN_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${ADMIN_GOOGLE_REDIRECT_URI}
      GOOGLE_REFRESH_TOKEN: ${ADMIN_GOOGLE_REFRESH_TOKEN}
      GA_PROPERTY_ID: ${ADMIN_GA_PROPERTY_ID}
      GA_SERVICE_ACCOUNT: ${ADMIN_GA_SERVICE_ACCOUNT}
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  rag:
    build:
      context: .
      dockerfile: apps/rag-service/Dockerfile
      target: dev
    working_dir: /app/apps/rag-service
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 3005
      LOG_LEVEL: ${RAG_LOG_LEVEL}
      RAG_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_API_URL: http://admin:3001
      ADMIN_INTERNAL_API_TOKEN: ${ADMIN_INTERNAL_API_TOKEN}
      RAG_INGEST_SERVICE_TOKEN: ${RAG_INGEST_SERVICE_TOKEN}
      OPENAI_API_KEY: ${RAG_OPENAI_API_KEY}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION}
      CHAT_MODEL: ${RAG_CHAT_MODEL}
      CONTEXT_MODEL: ${RAG_CONTEXT_MODEL}
      ADMIN_API_TIMEOUT_MS: ${RAG_ADMIN_API_TIMEOUT_MS}
      CORS_ORIGINS: ${RAG_CORS_ORIGINS}
      CHUNK_TARGET_TOKENS: ${RAG_CHUNK_TARGET_TOKENS}
      CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS}
      INGESTION_BATCH_SIZE: ${RAG_INGESTION_BATCH_SIZE}
      RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT}
      CHAT_HISTORY_LIMIT: ${RAG_CHAT_HISTORY_LIMIT}
    ports:
      - '${RAG_PORT:-3005}:3005'
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_started

  rag-bootstrap:
    build:
      context: .
      dockerfile: apps/rag-service/Dockerfile
      target: dev
    working_dir: /app/apps/rag-service
    command: ['bun', 'run', 'db:bootstrap']
    environment:
      APP_ENV: development
      RAG_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    profiles: ['ops']

  public:
    build:
      context: .
      dockerfile: apps/public-astro/Dockerfile
      target: dev
    working_dir: /app/apps/public-astro
    environment:
      ADMIN_API_URL: http://admin:3001
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
      RAG_SERVICE_URL: http://rag:3005
      PUBLIC_CURSOR_WS_URL: ${PRESENCE_PUBLIC_WS_URL}
      SITE_URL: ${PUBLIC_SITE_CANONICAL_URL}
    ports:
      - '${PUBLIC_PORT:-3000}:3000'
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    depends_on:
      admin:
        condition: service_started
      rag:
        condition: service_started
      live-presence:
        condition: service_started

  links:
    build:
      context: .
      dockerfile: apps/links-astro/Dockerfile
      target: dev
    working_dir: /app/apps/links-astro
    environment:
      ADMIN_API_URL: http://admin:3001
      SITE_URL: ${LINKS_SITE_URL}
    ports:
      - '${LINKS_PORT:-3002}:3002'
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    depends_on:
      admin:
        condition: service_started

  ngl:
    build:
      context: .
      dockerfile: apps/ngl-svelte/Dockerfile
      target: dev
    working_dir: /app/apps/ngl-svelte
    environment:
      ADMIN_API_URL: http://admin:3001
      PUBLIC_TURNSTILE_SITE_KEY: ${NGL_PUBLIC_TURNSTILE_SITE_KEY}
      PUBLIC_GA_MEASUREMENT_ID: ${NGL_PUBLIC_GA_MEASUREMENT_ID}
      HOST: 0.0.0.0
      PORT: 3003
    ports:
      - '${NGL_PORT:-3003}:3003'
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
    depends_on:
      admin:
        condition: service_started

  live-presence:
    build:
      context: .
      dockerfile: apps/live-presence/Dockerfile
      target: dev
    working_dir: /app/apps/live-presence
    environment:
      NODE_ENV: development
      PORT: 3006
      ALLOWED_ORIGINS: ${PRESENCE_ALLOWED_ORIGINS}
    ports:
      - '${PRESENCE_PORT:-3006}:3006'
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules

volumes:
  db-data-dev:
  root-node-modules:
