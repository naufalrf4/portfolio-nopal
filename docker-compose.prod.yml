  live-presence:
    build:
      context: .
      dockerfile: apps/live-presence/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      NODE_ENV: production
      PORT: 3006
      ALLOWED_ORIGINS: ${PRESENCE_ALLOWED_ORIGINS}
    expose:
      - '3006'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3006/health').then(r=>{if(!r.ok) throw new Error('health')})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
        reservations:
          memory: 32m
          cpus: "0.1"
    networks:
      - internal
      - dokploy-network

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
