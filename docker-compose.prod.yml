services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LINKS_DOMAIN: ${LINKS_DOMAIN}
      NGL_DOMAIN: ${NGL_DOMAIN}
      PRESENCE_DOMAIN: ${PRESENCE_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      admin:
        condition: service_started
      public:
        condition: service_started
      links:
        condition: service_started
      ngl:
        condition: service_started
      rag:
        condition: service_started
      live-presence:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data-prod:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: ./apps/admin
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_TRUST_HOST: ${ADMIN_AUTH_TRUST_HOST:-true}
      NEXTAUTH_SECRET: ${ADMIN_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${ADMIN_PUBLIC_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_INTERNAL_API_TOKEN: ${ADMIN_INTERNAL_API_TOKEN}
      ADMIN_PUBLIC_API_ALLOWED_ORIGINS: ${ADMIN_PUBLIC_API_ALLOWED_ORIGINS}
      RAG_INGEST_SERVICE_TOKEN: ${RAG_INGEST_SERVICE_TOKEN}
      FASTAPI_RAG_SERVICE_URL: http://rag:3005
      NODE_ENV: production
      PORT: 3001
      GCS_PROJECT_ID: ${ADMIN_GCS_PROJECT_ID}
      GCS_BUCKET_NAME: ${ADMIN_GCS_BUCKET_NAME}
      GCS_PUBLIC_BASE_URL: ${ADMIN_GCS_PUBLIC_BASE_URL}
      GCS_SERVICE_ACCOUNT_JSON: ${ADMIN_GCS_SERVICE_ACCOUNT_JSON}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${ADMIN_NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${ADMIN_TURNSTILE_SECRET_KEY}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${ADMIN_NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${ADMIN_NEXT_PUBLIC_GA_MEASUREMENT_ID}
      GOOGLE_CLIENT_ID: ${ADMIN_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${ADMIN_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${ADMIN_GOOGLE_REDIRECT_URI}
      GOOGLE_REFRESH_TOKEN: ${ADMIN_GOOGLE_REFRESH_TOKEN}
      GA_PROPERTY_ID: ${ADMIN_GA_PROPERTY_ID}
      GA_SERVICE_ACCOUNT: ${ADMIN_GA_SERVICE_ACCOUNT}
    expose:
      - '3001'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  rag:
    build:
      context: ./apps/rag-service
      target: prod
    restart: unless-stopped
    environment:
      PYTHONPATH: /app/fastapi
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 3005
      LOG_LEVEL: ${RAG_LOG_LEVEL}
      RAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_API_URL: http://admin:3001
      ADMIN_INTERNAL_API_TOKEN: ${ADMIN_INTERNAL_API_TOKEN}
      RAG_INGEST_SERVICE_TOKEN: ${RAG_INGEST_SERVICE_TOKEN}
      GEMINI_API_KEY: ${RAG_GEMINI_API_KEY}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION}
      CHAT_MODEL: ${RAG_CHAT_MODEL}
      CONTEXT_MODEL: ${RAG_CONTEXT_MODEL}
      ADMIN_API_TIMEOUT_MS: ${RAG_ADMIN_API_TIMEOUT_MS}
      CORS_ORIGINS: ${RAG_CORS_ORIGINS}
      CHUNK_TARGET_TOKENS: ${RAG_CHUNK_TARGET_TOKENS}
      CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS}
      INGESTION_BATCH_SIZE: ${RAG_INGESTION_BATCH_SIZE}
      RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT}
      CHAT_HISTORY_LIMIT: ${RAG_CHAT_HISTORY_LIMIT}
    expose:
      - '3005'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_started

  rag-bootstrap:
    build:
      context: ./apps/rag-service
      target: prod
    command: ['.venv/bin/python', 'scripts/bootstrap_db.py']
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 3005
      LOG_LEVEL: ${RAG_LOG_LEVEL}
      RAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_API_URL: http://admin:3001
      ADMIN_INTERNAL_API_TOKEN: ${ADMIN_INTERNAL_API_TOKEN}
      RAG_INGEST_SERVICE_TOKEN: ${RAG_INGEST_SERVICE_TOKEN}
      GEMINI_API_KEY: ${RAG_GEMINI_API_KEY}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION}
      CHAT_MODEL: ${RAG_CHAT_MODEL}
      CONTEXT_MODEL: ${RAG_CONTEXT_MODEL}
      ADMIN_API_TIMEOUT_MS: ${RAG_ADMIN_API_TIMEOUT_MS}
      CORS_ORIGINS: ${RAG_CORS_ORIGINS}
      CHUNK_TARGET_TOKENS: ${RAG_CHUNK_TARGET_TOKENS}
      CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS}
      INGESTION_BATCH_SIZE: ${RAG_INGESTION_BATCH_SIZE}
      RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT}
      CHAT_HISTORY_LIMIT: ${RAG_CHAT_HISTORY_LIMIT}
    depends_on:
      db:
        condition: service_healthy
    profiles: ['ops']

  public:
    build:
      context: ./apps/public-astro
      target: prod
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin:3001
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
      RAG_SERVICE_URL: http://rag:3005
      PUBLIC_CURSOR_WS_URL: ${PRESENCE_PUBLIC_WS_URL}
      SITE_URL: ${PUBLIC_SITE_CANONICAL_URL}
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - '3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      admin:
        condition: service_started
      rag:
        condition: service_started
      live-presence:
        condition: service_started

  links:
    build:
      context: ./apps/links-astro
      target: prod
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin:3001
      SITE_URL: ${LINKS_SITE_URL}
      HOST: 0.0.0.0
      PORT: 3002
    expose:
      - '3002'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      admin:
        condition: service_started

  ngl:
    build:
      context: ./apps/ngl-svelte
      target: prod
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://admin:3001
      PUBLIC_TURNSTILE_SITE_KEY: ${NGL_PUBLIC_TURNSTILE_SITE_KEY}
      PUBLIC_GA_MEASUREMENT_ID: ${NGL_PUBLIC_GA_MEASUREMENT_ID}
      HOST: 0.0.0.0
      PORT: 3003
    expose:
      - '3003'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      admin:
        condition: service_started

  live-presence:
    build:
      context: ./apps/live-presence
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      ALLOWED_ORIGINS: ${PRESENCE_ALLOWED_ORIGINS}
    expose:
      - '3006'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3006/health').then(r=>{if(!r.ok) throw new Error('health')})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  db-data-prod:
