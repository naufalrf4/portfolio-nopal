    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.25"
    depends_on:
      admin:
        condition: service_started
      rag:
        condition: service_started
      live-presence:
        condition: service_started
    networks:
      - internal
      - dokploy-network

  links:
    build:
      context: .
      dockerfile: apps/links-astro/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      ADMIN_API_URL: http://admin:3001
      ADMIN_INTERNAL_API_TOKEN: ${ADMIN_INTERNAL_API_TOKEN}
      PUBLIC_CURSOR_WS_URL: ${PRESENCE_PUBLIC_WS_URL}
      SITE_URL: ${LINKS_SITE_URL}
      HOST: 0.0.0.0
      PORT: 3002
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
