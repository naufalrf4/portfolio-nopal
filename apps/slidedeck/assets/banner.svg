<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="HTML Slidedeck animated banner" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F3F6FC"/>
      <stop offset="1" stop-color="#E7ECF8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="430" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="none" stroke="#1E3A8A" stroke-opacity="0.08" stroke-width="2" rx="20"/>
    <circle cx="960" cy="100" r="220" fill="url(#glow)">
      <animate attributeName="cy" values="100;140;100" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="360" r="160" fill="url(#glow)" opacity="0.7">
      <animate attributeName="cx" values="180;240;180" dur="11s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.08" stroke="#1E3A8A" stroke-width="1">
      <line x1="0" y1="110" x2="1200" y2="110"/>
      <line x1="0" y1="320" x2="1200" y2="320"/>
    </g>

    <g transform="translate(72,132)">
      <text font-size="20" letter-spacing="9" fill="#3B82F6" font-weight="600">MODULAR PRESENTATION TEMPLATE</text>
      <text y="92" font-size="78" font-weight="800" fill="#131A2B" letter-spacing="-1">HTML Slidedeck</text>
      <text y="150" font-size="24" fill="#45506B" font-weight="500">Data-driven slides, present mode, one page per slide PDF export.</text>
      <g transform="translate(0,188)">
        <rect width="150" height="40" rx="20" fill="url(#accent)"/>
        <text x="75" y="26" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">npm run dev</text>
        <g transform="translate(168,0)">
          <rect width="160" height="40" rx="20" fill="none" stroke="#1E3A8A" stroke-opacity="0.4" stroke-width="1.5"/>
          <text x="80" y="26" font-size="16" font-weight="600" fill="#45506B" text-anchor="middle">Vite + Tailwind</text>
        </g>
      </g>
      <text y="248" font-size="14" fill="#808AA1" font-weight="500">Crafted by <tspan fill="#1E3A8A" font-weight="700">naufalrf4</tspan> · github.com/naufalrf4</text>
    </g>

    <g transform="translate(800,124)">
      <g transform="translate(0,0)">
        <rect width="300" height="170" rx="14" fill="#FFFFFF" stroke="#D5DEF2" stroke-width="1.5"/>
        <rect x="22" y="26" width="120" height="10" rx="5" fill="#1E3A8A">
          <animate attributeName="width" values="0;120" dur="1s" begin="0s" fill="freeze"/>
        </rect>
        <rect x="22" y="52" width="200" height="8" rx="4" fill="#C2CEE8">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
        </rect>
        <rect x="22" y="72" width="160" height="8" rx="4" fill="#C2CEE8">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.7s" fill="freeze"/>
        </rect>
        <rect x="22" y="104" width="78" height="44" rx="8" fill="#EEF2FB"/>
        <rect x="111" y="104" width="78" height="44" rx="8" fill="#EEF2FB"/>
        <rect x="200" y="104" width="78" height="44" rx="8" fill="#EEF2FB"/>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
          <rect x="-6" y="-6" width="312" height="182" rx="16" fill="none" stroke="url(#accent)" stroke-width="2"/>
        </g>
      </g>
      <g transform="translate(150,140) scale(0.86)" opacity="0.55">
        <rect width="300" height="170" rx="14" fill="#F3F6FC" stroke="#D5DEF2" stroke-width="1.5"/>
      </g>
      <circle cx="150" cy="245" r="34" fill="url(#accent)">
        <animate attributeName="r" values="34;38;34" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M140 230 L140 260 L166 245 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
