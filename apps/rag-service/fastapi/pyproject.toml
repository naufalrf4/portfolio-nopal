[project]
name = "rag-service-fastapi"
version = "0.1.0"
description = "FastAPI contextual RAG scaffold for NaufalRF portfolio"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.14.0,<2.0.0",
  "pgvector>=0.3.6,<1.0.0",
  "google-genai>=1.20.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "tiktoken>=0.8.0,<1.0.0",
  "pymupdf>=1.25.0,<2.0.0",
  "pypdf>=5.1.0,<6.0.0",
  "python-docx>=1.1.2,<2.0.0",
  "pdf2image>=1.17.0,<2.0.0",
  "pytesseract>=0.3.13,<1.0.0",
  "Pillow>=11.0.0,<12.0.0",
  "python-magic>=0.4.27,<1.0.0",
  "orjson>=3.10.0,<4.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
